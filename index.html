s generation, where future tokens aren’t known."], ["Why do transformers need positional encoding?", "Attention alone treats the input as an unordered set."]]}, "found-counting": {"ex": ["Counting rules let you count outcomes without listing them. If one step has m choices and the next n, there are m × n combinations. Permutations count ordered arrangements; combinations count unordered selections.", "Use P(n, r) when order matters (rankings, passwords), C(n, r) when it doesn’t (teams, lottery picks).", "<b>Example:</b> picking 3 people from 10: C(10, 3) = 120 teams, but P(10, 3) = 720 ways to fill president, VP and treasurer."], "q": [["Arrangements of the letters of LEVEL?", "5!/(2!·2!) = 30 (L and E repeat)."], ["Order matters: permutation or combination?", "Permutation."]]}, "found-probability-basics": {"ex": ["Probability follows three axioms: non-negative, total 1, and additive for events that can’t happen together. Everything else, including conditional probability and Bayes’ theorem, is built on them.", "Conditional probability P(A|B) restricts the world to cases where B happened. Independence means knowing B doesn’t change A’s probability.", "<b>Example:</b> two dice: P(sum = 8) = 5/36. Given the first die is 3, P(sum = 8) = P(second = 5) = 1/6."], "q": [["If A and B are independent, what is P(A|B)?", "P(A)."], ["Can mutually exclusive events with non-zero probability be independent?", "No: knowing one happened makes the other impossible."]]}, "found-random-variables": {"ex": ["A random variable assigns a number to each outcome. Discrete ones have a PMF (probability of each value); continuous ones have a PDF (density) where probabilities are areas. The CDF gives P(X ≤ x).", "Expectation is the long-run average; variance measures spread. Expectation is linear: E[aX + b] = aE[X] + b; Var[aX + b] = a²Var[X].", "<b>Example:</b> a fair die: E[X] = 3.5, E[X²] = 91/6, so Var = 91/6 − 3.5² ≈ 2.92."], "q": [["Can a PDF value be greater than 1?", "Yes; densities can exceed 1, only areas must be at most 1."], ["Var(3X + 2) if Var(X) = 4?", "9 × 4 = 36."]]}, "found-descriptive-stats": {"ex": ["Descriptive statistics summarise data: mean, median and mode for centre; variance and standard deviation for spread. Covariance and correlation measure how two variables move together.", "Correlation ranges from −1 to 1 and only captures linear relationships; correlation isn’t causation.", "<b>Example:</b> {2, 4, 4, 4, 5, 5, 7, 9}: mean 5, median 4.5, mode 4, population standard deviation 2."], "q": [["Why is the median robust to outliers?", "It depends on the middle position, not on extreme values."], ["Correlation 0 means no relationship?", "No linear relationship; there may still be a non-linear one."]]}, "found-discrete-distributions": {"ex": ["Discrete distributions model counts. Bernoulli is one yes/no trial; binomial counts successes in n independent trials; Poisson counts events in a fixed interval at a known average rate.", "Binomial mean np, variance np(1 − p). Poisson mean and variance are both λ.", "<b>Example:</b> a server fails on average 2 times a month (Poisson λ = 2). P(no failures) = e^−2 ≈ 0.135."], "q": [["Mean and variance of Binomial(10, 0.3)?", "Mean 3, variance 2.1."], ["Which distribution fits calls arriving per minute?", "Poisson."]]}, "found-continuous-distributions": {"ex": ["Continuous distributions describe measurements. Uniform spreads evenly; exponential models waiting times; the normal (bell) curve appears everywhere because of the central limit theorem.", "For the normal, about 68%, 95% and 99.7% of values lie within 1, 2 and 3 standard deviations. The t and chi-squared distributions are used in tests.", "<b>Example:</b> response times average 200 ms with SD 20 ms (normal): about 95% fall between 160 and 240 ms."], "q": [["Which distribution is memoryless?", "Exponential."], ["When do you use t instead of z?", "When the population standard deviation is unknown and estimated from a small sample."]]}, "found-clt-ci": {"ex": ["The central limit theorem says the average of many independent samples is approximately normal, whatever the original distribution, with standard error σ/√n.", "That lets you build confidence intervals: x̄ ± z·σ/√n. A 95% interval means the method captures the true mean 95% of the time.", "<b>Example:</b> n = 100, x̄ = 50, σ = 10: SE = 1, so the 95% CI is 50 ± 1.96 = (48.04, 51.96)."], "q": [["How does the standard error change if n quadruples?", "It halves (divides by √4)."], ["Does a 95% CI mean a 95% chance the mean is inside this interval?", "Not strictly; 95% of intervals built this way contain the true mean."]]}, "found-hypothesis": {"ex": ["A hypothesis test asks whether data contradicts a default claim (H₀). Compute a test statistic, find the p-value (chance of a result this extreme if H₀ were true), and reject H₀ if p is below α (often 0.05).", "Type I error: rejecting a true H₀. Type II: missing a real effect. z-tests use known σ, t-tests estimate it, chi-squared tests compare counts.", "<b>Example:</b> claimed mean 100, σ = 15, n = 36, sample mean 105: z = 5/(15/6) = 2.0, p ≈ 0.046 two-sided, so reject at α = 0.05."], "q": [["What does a p-value measure?", "The probability of data at least this extreme assuming H₀ is true."], ["Which test compares observed vs expected counts?", "Chi-squared."]]}, "found-vector-spaces": {"ex": ["A vector space is a set where you can add vectors and scale them and stay inside. A subspace is a smaller such set through the origin.", "Vectors are independent if none is a combination of the others. A basis is an independent set that spans the space; the number of basis vectors is the dimension.", "<b>Example:</b> (1, 0, 1), (0, 1, 1), (1, 1, 2): the third is the sum of the first two, so they are dependent and span only a 2-dimensional plane."], "q": [["Is the set of vectors with x + y = 1 a subspace?", "No; it doesn’t contain the zero vector."], ["What is the dimension of the space of 2×2 matrices?", "4."]]}, "found-linear-systems": {"ex": ["Solve Ax = b with Gaussian elimination: row-reduce to echelon form and back-substitute. Rank is the number of independent rows (pivots).", "A solution exists if rank(A) = rank([A|b]); it’s unique if that rank equals the number of unknowns. Rank + nullity = number of columns. A square A is invertible iff det(A) ≠ 0.", "<b>Example:</b> a 3×5 matrix of rank 3 has nullity 2, so Ax = 0 has a 2-parameter family of solutions."], "q": [["If det(A) = 0 for a square A, what can you say?", "A is singular: not invertible, and Ax = b has no or infinitely many solutions."], ["Rank 2, 4 columns: nullity?", "2."]]}, "found-eigen": {"ex": ["An eigenvector of A is a direction that A only stretches, not rotates: Av = λv. The stretch factor λ is the eigenvalue.", "Find λ from det(A − λI) = 0. The eigenvalues sum to the trace and multiply to the determinant. Symmetric matrices have real eigenvalues and orthogonal eigenvectors, which is why PCA works.", "<b>Example:</b> A = [[2, 1], [1, 2]]: λ² − 4λ + 3 = 0, so λ = 3 (eigenvector (1, 1)) and λ = 1 (eigenvector (1, −1))."], "q": [["Eigenvalues of A² if A has eigenvalue 3?", "9."], ["Why do eigenvectors matter for PCA?", "The covariance matrix’s eigenvectors are the principal directions; eigenvalues are the variances."]]}, "found-projections-decomp": {"ex": ["Projection finds the closest point in a line or subspace, the basis of least squares. Orthogonal matrices preserve lengths; quadratic forms xᵀAx describe bowls and saddles.", "Factorisations split matrices into simpler parts: LU for solving systems, eigendecomposition for symmetric matrices, and SVD (A = UΣVᵀ) for any matrix, used in PCA, compression and recommender systems.", "<b>Example:</b> project b = (2, 3) onto a = (1, 0): p = (aᵀb/aᵀa)a = (2, 0); the error (0, 3) is perpendicular to a."], "q": [["What does SVD give for any matrix?", "Orthogonal U and V and non-negative singular values Σ with A = UΣVᵀ."], ["Why is projection central to least squares?", "The best-fit solution projects y onto the column space of X."]]}, "found-limits-derivatives": {"ex": ["A limit describes what f(x) approaches as x gets close to a value. A function is continuous if there are no jumps or holes: the limit equals the value.", "The derivative is the instantaneous rate of change, the slope of the tangent. Differentiable implies continuous, but not the reverse (|x| at 0 has a corner).", "<b>Example:</b> f(x) = x²: f′(x) = lim (2xh + h²)/h = 2x, so the slope at x = 3 is 6."], "q": [["Is |x| differentiable at 0?", "No; the left and right slopes (−1 and 1) differ."], ["Does continuity imply differentiability?", "No."]]}, "found-taylor-optimization": {"ex": ["A Taylor series approximates a smooth function near a point with a polynomial built from its derivatives; a few terms are often enough locally.", "To optimise, find where f′(x) = 0, then use the second derivative: positive means a minimum, negative a maximum. On a closed interval also check the endpoints.", "<b>Example:</b> f(x) = x³ − 3x: f′ = 3x² − 3 = 0 at x = ±1; f″(1) = 6 > 0 (local min, f = −2), f″(−1) = −6 (local max, f = 2)."], "q": [["First three terms of eˣ at 0?", "1 + x + x²/2."], ["f′(a) = 0 and f″(a) = 0: what can you conclude?", "Nothing yet; the test is inconclusive (could be an inflection point)."]]}, "found-python": {"ex": ["Python interview and exam questions test details: mutable vs immutable types, floor division with negatives, slicing rules, default argument pitfalls and scope.", "Read code by tracing variables line by line. Lists are mutable and passed by reference; ints, strings and tuples are immutable.", "<b>Example:</b> def f(x=[]): x.append(1); return x — calling f() twice returns [1, 1], because the default list is created once and shared."], "q": [["What is -7 // 2 in Python?", "-4 (floor division rounds down)."], ["What does 'abcdef'[1:5:2] return?", "'bd'."]]}, "found-asymptotics": {"ex": ["Asymptotic analysis describes how running time grows with input size, ignoring constants: O is an upper bound, Ω a lower bound, Θ both.", "Count loops, and solve recurrences for recursive algorithms, often with the master theorem.", "<b>Example:</b> merge sort T(n) = 2T(n/2) + n. Here a = 2, b = 2, n^(log₂2) = n matches f(n) = n, so T(n) = Θ(n log n)."], "q": [["Order these: n log n, n², log n, 2ⁿ.", "log n < n log n < n² < 2ⁿ."], ["Nested loops i = 1..n, j = 1..i: complexity?", "Θ(n²)."]]}, "found-stacks-queues": {"ex": ["A stack is last-in-first-out (like plates); a queue is first-in-first-out (like a line). Both support O(1) add and remove at their ends.", "Stacks power function calls, undo and expression evaluation; queues power BFS and task scheduling. In Python use a list as a stack and collections.deque as a queue.", "<b>Example:</b> postfix 2 3 4 * +: push 2, 3, 4; * pops 3 and 4 → push 12; + pops 2 and 12 → 14."], "q": [["Which structure does BFS use?", "A queue."], ["Why is list.pop(0) slow for a queue in Python?", "It shifts every element: O(n). deque.popleft() is O(1)."]]}, "found-linked-lists": {"ex": ["A linked list stores elements in nodes that point to the next node. Inserting or deleting at a known node is O(1), but finding the k-th element takes O(k) because there is no indexing.", "Variants: doubly linked (prev and next pointers), circular. Classic problems: reverse a list, detect a cycle (fast and slow pointers), find the middle.", "<b>Example:</b> reversing 1→2→3: walk with prev = None, flip each next pointer; you end with 3→2→1 in O(n) time and O(1) space."], "q": [["Linked list or array for frequent inserts at the front?", "Linked list (O(1) vs O(n))."], ["How do you detect a cycle?", "Floyd’s fast and slow pointers: if they meet, there’s a cycle."]]}, "found-trees": {"ex": ["Trees store hierarchical data: each node has children, the top is the root, the bottom nodes are leaves. In a binary search tree, left < node < right, giving O(log n) search when balanced.", "Traversals: inorder (left, node, right; sorted order for a BST), preorder, postorder and level order. Heaps are complete trees where each parent beats its children, used for priority queues.", "<b>Example:</b> inserting 50, 30, 70, 20, 40 into a BST; inorder traversal gives 20, 30, 40, 50, 70."], "q": [["What does inorder traversal of a BST produce?", "Keys in sorted order."], ["Worst-case search in an unbalanced BST?", "O(n), when it degenerates into a chain."]]}, "found-hash-tables": {"ex": ["A hash table maps keys to slots with a hash function, giving average O(1) lookup. When two keys land in the same slot (a collision), chaining keeps a list per slot; open addressing probes for another slot.", "Performance depends on the load factor α = n/m; tables resize when α gets high.", "<b>Example:</b> h(k) = k mod 7 with keys 10, 17, 24: all go to slot 3. With linear probing they occupy slots 3, 4, 5."], "q": [["Average search cost with chaining?", "O(1 + α)."], ["Why do hash tables resize?", "To keep the load factor low so collisions stay rare."]]}, "found-searching": {"ex": ["Linear search checks items one by one: O(n). Binary search works on sorted data: compare with the middle and discard half each time: O(log n).", "Compute mid as low + (high − low)//2 and be careful with loop bounds; most bugs are off-by-one errors.", "<b>Example:</b> searching 23 in 10 sorted items takes at most ⌈log₂(11)⌉ = 4 comparisons, versus up to 10 for linear search."], "q": [["Maximum comparisons for binary search on 1,000 items?", "About 10."], ["What must be true for binary search to work?", "The data must be sorted (or monotonic)."]]}, "found-basic-sorts": {"ex": ["Selection sort repeatedly picks the smallest remaining item; bubble sort swaps adjacent out-of-order pairs; insertion sort inserts each item into the sorted part on its left. All are O(n²) in the worst case.", "Insertion sort is fast on nearly sorted data (O(n) best case) and is stable; selection sort makes the fewest swaps.", "<b>Example:</b> after one bubble pass, [5, 1, 4, 2, 8] becomes [1, 4, 2, 5, 8]; the largest value has “bubbled” to the end."], "q": [["Which simple sort is best for nearly sorted data?", "Insertion sort."], ["Is selection sort stable?", "Not in its usual form."]]}, "found-divide-conquer": {"ex": ["Divide and conquer splits a problem, solves the parts recursively and combines them. Merge sort splits in half and merges sorted halves: always O(n log n), stable, needs extra memory.", "Quicksort partitions around a pivot: O(n log n) on average, O(n²) in the worst case (bad pivots), in-place and usually fastest in practice; random pivots avoid the worst case.", "<b>Example:</b> merging [1, 4, 7] and [2, 3, 9] compares the fronts each step: 1, 2, 3, 4, 7, 9 in 5 comparisons."], "q": [["When does quicksort hit O(n²)?", "When pivots are consistently the smallest or largest, e.g. sorted input with a first-element pivot."], ["Which is stable: merge sort or quicksort?", "Merge sort."]]}, "found-graph-basics": {"ex": ["A graph is vertices connected by edges, directed or undirected, weighted or not. The degree of a vertex is its number of edges; in an undirected graph the degrees add up to twice the number of edges.", "Store sparse graphs as adjacency lists (O(V + E) space) and dense graphs as adjacency matrices (O(V²) space, O(1) edge lookup).", "<b>Example:</b> a graph with 5 vertices and 6 edges has total degree 12."], "q": [["Adjacency list or matrix for a sparse social network?", "Adjacency list."], ["How many edges does a tree with n vertices have?", "n − 1."]]}, "found-graph-traversal": {"ex": ["Breadth-first search explores level by level using a queue, finding shortest paths in unweighted graphs. Depth-first search goes as deep as possible first using a stack or recursion.", "DFS is used for cycle detection, topological sorting and connected components. Both take O(V + E) time.", "<b>Example:</b> from A with edges A–B, A–C, B–D: BFS visits A, B, C, D; DFS visits A, B, D, C."], "q": [["Which traversal finds shortest paths in an unweighted graph?", "BFS."], ["Time complexity of BFS/DFS with adjacency lists?", "O(V + E)."]]}, "found-shortest-paths": {"ex": ["Dijkstra finds shortest paths from one source when all weights are non-negative, always expanding the closest unvisited vertex. Bellman-Ford handles negative weights and detects negative cycles. Floyd-Warshall finds all pairs.", "Choose by graph: non-negative single-source → Dijkstra; negatives → Bellman-Ford; all pairs in small graphs → Floyd-Warshall.", "<b>Example:</b> A–B 4, A–C 2, C–B 1: Dijkstra finalises C at 2, then updates B to 2 + 1 = 3, shorter than the direct 4."], "q": [["Why does Dijkstra fail with negative weights?", "A finalised vertex might later be reachable more cheaply via a negative edge."], ["Time complexity of Floyd-Warshall?", "O(V³)."]]}, "found-er": {"ex": ["The entity-relationship model sketches data before building tables: entities (Student), attributes (name, roll no.) and relationships (Student enrols in Course), with cardinalities like one-to-many.", "Weak entities depend on another entity for identity. Each part of an ER diagram maps to tables, keys and foreign keys.", "<b>Example:</b> Customer 1—N Bill: each bill belongs to one customer, so Bill gets a customer_id foreign key."], "q": [["How is a many-to-many relationship turned into tables?", "A separate junction table with foreign keys to both entities."], ["What is a weak entity?", "An entity without its own key that depends on an owner entity (e.g. dependents of an employee)."]]}, "found-relational": {"ex": ["The relational model stores data in tables (relations) of rows and columns. Keys identify rows: a candidate key is a minimal unique set; the chosen one is the primary key.", "Integrity rules keep data valid: primary keys are unique and not null; foreign keys must match an existing row or be null.", "<b>Example:</b> in Employee(emp_id, email, name), both emp_id and email are candidate keys; emp_id is chosen as the primary key."], "q": [["Super key vs candidate key?", "A super key identifies rows; a candidate key is a minimal super key."], ["What does referential integrity require?", "Foreign key values must exist in the referenced table (or be null)."]]}, "found-relalg": {"ex": ["Relational algebra is the set of operations behind SQL: selection σ filters rows, projection π picks columns, joins combine tables, and union, difference and intersection combine compatible tables.", "Division answers “for all” questions, like students who took every course.", "<b>Example:</b> π_name(σ_dept='CS'(Student)) gives names of CS students, the same as SELECT DISTINCT name FROM Student WHERE dept = 'CS'."], "q": [["Which operation removes columns?", "Projection (π)."], ["Which operation answers “students enrolled in all courses”?", "Division."]]}, "found-trc": {"ex": ["Tuple relational calculus describes what you want rather than how to get it: { t | condition on t }. It uses ∧, ∨, ¬, ∃ and ∀.", "Safe expressions only produce finite results drawn from the database. TRC has the same power as relational algebra.", "<b>Example:</b> { t.name | t ∈ Student ∧ ∃ e ∈ Enrolled (e.sid = t.sid ∧ e.cid = 'DB101') } lists students enrolled in DB101."], "q": [["Is TRC procedural or declarative?", "Declarative."], ["What makes a TRC expression unsafe?", "It could return infinitely many tuples, e.g. { t | ¬(t ∈ Student) }."]]}, "found-sql": {"ex": ["SQL runs clauses in a logical order different from how you write them: FROM/JOIN, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT. That’s why you can’t use a SELECT alias in WHERE.", "WHERE filters rows before grouping; HAVING filters groups after. NULL means unknown: comparisons with NULL are unknown, so use IS NULL; COUNT(column) skips NULLs.", "<b>Example:</b> SELECT dept, AVG(salary) FROM emp GROUP BY dept HAVING AVG(salary) > 50000 lists departments with high average pay."], "q": [["Difference between WHERE and HAVING?", "WHERE filters rows before grouping; HAVING filters groups after."], ["What does COUNT(*) count that COUNT(col) doesn’t?", "Rows where col is NULL."]]}, "found-sql-joins": {"ex": ["Joins combine tables: INNER keeps matches; LEFT keeps every left row (with NULLs where no match); FULL keeps both sides. Subqueries nest one query in another; window functions compute rankings and running totals without collapsing rows.", "An anti-join (LEFT JOIN … WHERE right.id IS NULL, or NOT EXISTS) finds rows with no match.", "<b>Example:</b> RANK() OVER (PARTITION BY dept ORDER BY salary DESC) ranks employees within each department, keeping every row."], "q": [["How do you find customers with no orders?", "LEFT JOIN orders and filter where orders.id IS NULL (or NOT EXISTS)."], ["Difference between GROUP BY and a window function?", "GROUP BY collapses rows; window functions keep every row."]]}, "found-normalization": {"ex": ["Normalization removes redundancy that causes update anomalies. A functional dependency X → Y means X determines Y. Normal forms progressively remove bad dependencies.", "1NF: atomic values. 2NF: no partial dependency on part of a key. 3NF: no transitive dependency through non-keys. BCNF: every determinant is a candidate key.", "<b>Example:</b> Orders(order_id, customer_id, customer_city): customer_city depends on customer_id, not the key, so move it to a Customers table (3NF)."], "q": [["What anomaly does storing customer city in every order cause?", "Update anomaly: changing the city means updating many rows."], ["What does BCNF require?", "For every non-trivial dependency X → Y, X is a super key."]]}, "found-indexing": {"ex": ["Indexes let the database find rows without scanning the whole table. B+ trees keep keys sorted and balanced, so lookups and range scans take O(log n) block reads.", "A clustered index orders the table itself (one per table); secondary indexes point to rows. Indexes speed reads but slow writes and use space.", "<b>Example:</b> a B+ tree with fan-out 100 reaches 1 million rows in 3 levels (100³), so a lookup reads about 3 index blocks plus the data block."], "q": [["Why are B+ trees good for range queries?", "Leaves are linked in sorted order, so you scan along them."], ["Cost of adding many indexes?", "Slower inserts and updates, plus extra storage."]]}, "found-transactions": {"ex": ["A transaction is a unit of work that must be ACID: atomic (all or nothing), consistent, isolated and durable. Without isolation you get anomalies like dirty reads and lost updates.", "Isolation levels trade safety for concurrency. Locking (two-phase locking) or multiversion concurrency control enforce them; serializability means the result equals some serial order.", "<b>Example:</b> two transfers read balance 1,000 at once and each writes 900. One update is lost; proper locking makes the second wait and write 800."], "q": [["What is a dirty read?", "Reading data written by a transaction that hasn’t committed (and may roll back)."], ["What does two-phase locking guarantee?", "Conflict serializability."]]}, "found-data-transform": {"ex": ["Before analysis, data is typed (nominal, ordinal, interval, ratio), scaled, sometimes binned into ranges, sampled and compressed.", "Min-max and z-score scaling make features comparable; discretisation turns numbers into categories; sampling reduces size while keeping the distribution; compression (e.g. PCA) reduces dimensions.", "<b>Example:</b> min-max scaling 4 in the range [2, 10] gives (4 − 2)/(10 − 2) = 0.25."], "q": [["Equal-width vs equal-frequency binning?", "Equal-width bins have the same range; equal-frequency bins have the same number of items."], ["Why use stratified sampling?", "To keep each group’s share the same as in the full data."]]}, "found-warehouse": {"ex": ["Data warehouses are designed for analysis, not daily transactions. A fact table holds measures (revenue, units) with keys to dimension tables (date, product, region).", "Star schemas keep dimensions flat for fast queries; snowflake schemas normalise dimensions. OLAP operations: roll-up, drill-down, slice, dice and pivot.", "<b>Example:</b> revenue by month → roll-up to quarter; filter region = South → slice; then drill down from quarter back to day."], "q": [["OLTP vs OLAP?", "OLTP handles many small transactions; OLAP runs large analytical queries."], ["Star vs snowflake schema?", "Star has denormalised dimensions; snowflake normalises them into sub-tables."]]}, "found-concept-hierarchies": {"ex": ["Concept hierarchies define levels of detail: city → state → country, day → month → year. Data cubes precompute aggregates along these levels.", "Measures are distributive (sum, count: combine partial results directly), algebraic (average: computed from a few distributive values) or holistic (median: needs all data).", "<b>Example:</b> average revenue per region can be rebuilt from regional sums and counts (algebraic), but the median can’t be built from regional medians (holistic)."], "q": [["Is AVG distributive, algebraic or holistic?", "Algebraic (sum ÷ count)."], ["How many cuboids does a cube with 3 dimensions (no hierarchies) have?", "2³ = 8."]]}};

const USE_ML={

'ml-modes':{s:`A news site's click-through model must adapt within hours as stories change, while a credit model is retrained quarterly and audited.`,what:`Online updates with partial_fit for clicks; batch retraining for credit.`,why:`Fast-moving data needs online learning; regulated models need fixed, reviewable batch versions.`,link:[`scikit-learn: out-of-core (online) text classification`,`https://github.com/scikit-learn/scikit-learn/blob/HEAD/examples/applications/plot_out_of_core_classification.py`]},

'ml-lifecycle':{s:`A team ships a demand forecast and must retrain it monthly, track which data and code produced each version, and roll back if it gets worse.`,what:`Experiment tracking and a model registry (MLflow), with a simple baseline to beat.`,why:`Without versions and a baseline you can’t tell whether the new model is better or reproduce the old one.`,link:[`MLflow: tracking and model registry`,`https://github.com/mlflow/mlflow`]},
'ml-gathering':{s:`An analyst needs daily exchange rates from an API plus a sales export from a database, joined into one table.`,what:`requests for the API, pandas read_sql / read_csv for the rest, and a saved raw copy before any cleaning.`,why:`Keeping raw pulls lets you re-run cleaning without hitting the source again.`,link:[`pandas: IO tools source`,`https://github.com/pandas-dev/pandas/tree/HEAD/pandas/io`]},

'inf-metrics':{s:`A dashboard shows a healthy average latency while users complain about stutter.`,what:`TTFT, TPOT and end-to-end latency at P50/P99, and goodput against SLOs.`,why:`Users feel the tail; means hide it.`,link:[`vLLM: benchmark scripts`,`https://github.com/vllm-project/vllm/tree/HEAD/benchmarks`]},
'inf-quant':{s:`A team wants a 70B model on fewer GPUs without hurting answer quality.`,what:`FP8 or 4-bit weight quantization, checked on their own eval slices.`,why:`Smaller weights fit more KV cache and cost less, if quality holds on your tasks.`,link:[`llm-compressor: quantization for vLLM`,`https://github.com/vllm-project/llm-compressor`]},
'inf-spec':{s:`A code-completion product needs lower latency per user at modest traffic.`,what:`Speculative decoding with a small draft model or n-gram drafts.`,why:`Predictable text gets several tokens per target-model pass.`,link:[`vLLM: speculative decoding module`,`https://github.com/vllm-project/vllm/tree/HEAD/vllm/v1/spec_decode`]},
'inf-parallel':{s:`A model is too large for one GPU, or long prompts disrupt streaming for others.`,what:`Tensor parallelism within a node, pipeline across nodes, and disaggregated prefill/decode.`,why:`Each split matches a bottleneck: memory, interconnect speed or mixed workloads.`,link:[`NVIDIA Dynamo: disaggregated serving`,`https://github.com/ai-dynamo/dynamo`]},
'inf-engines':{s:`A regulated company must keep data in-region, while a startup wants zero ops.`,what:`Self-hosted vLLM or SGLang behind a gateway, versus a managed API.`,why:`Data rules, utilization and team skills decide which is cheaper and safer.`,link:[`LiteLLM: gateway across providers and self-hosted models`,`https://github.com/BerriAI/litellm`]},
'inf-cost':{s:`An assistant’s monthly bill must fall 5× without losing quality.`,what:`Prompt caching, answer caching, routing easy traffic to smaller models and batch APIs, all checked by evals.`,why:`Most spend is repeated input and over-powered models on easy requests.`,link:[`RouteLLM: cost-aware model routing`,`https://github.com/lm-sys/RouteLLM`]},
'inf-ops':{s:`A new model version must roll out with no downtime, and survive a provider outage.`,what:`Shadow traffic, canaries with automatic rollback, queue-based autoscaling and fallback routes.`,why:`Releases fail safely and capacity follows real load, not CPU.`,link:[`KServe: model serving on Kubernetes`,`https://github.com/kserve/kserve`]},
'ev-driven':{s:`A team keeps tweaking prompts and can’t tell if things got better.`,what:`A versioned eval set run on every change, built from real failures.`,why:`Decisions rest on measured results instead of a few hand-picked examples.`,link:[`promptfoo: eval and red-team CLI`,`https://github.com/promptfoo/promptfoo`]},
'ev-datasets':{s:`A support bot needs a test set that covers languages, products and hard edge cases.`,what:`A golden set sampled from real traffic, labelled, sliced and kept apart from prompt examples.`,why:`Representative, uncontaminated cases make scores mean something.`,link:[`Inspect: eval framework with datasets and scorers`,`https://github.com/UKGovernmentBEIS/inspect_ai`]},
'ev-metrics':{s:`You need to know whether retrieval finds the right document and whether code answers pass tests.`,what:`Recall@k, MRR and nDCG for retrieval; pass@k for code; exact match for short answers.`,why:`Each metric answers a specific question about quality.`,link:[`BEIR: retrieval benchmark and metrics`,`https://github.com/beir-cellar/beir`]},
'ev-judge':{s:`Open-ended answers can’t be scored with exact match.`,what:`An LLM judge with a rubric, calibrated against human labels (agreement and kappa), order randomized.`,why:`Judges scale review, but only after you know they agree with people.`,link:[`OpenAI Evals: model-graded evals`,`https://github.com/openai/evals`]},
'ev-rag':{s:`A RAG bot gives wrong answers and you need to know if retrieval or generation is at fault.`,what:`Separate retrieval metrics (recall@k) from generation metrics (faithfulness, answer correctness).`,why:`Splitting the pipeline shows where to fix.`,link:[`Ragas: RAG evaluation`,`https://github.com/explodinggradients/ragas`]},
'ev-agents':{s:`An agent must create correct support tickets reliably, not just once.`,what:`Checks on final state in the real system, pass^k over repeated runs, cost per successful task.`,why:`Agents are judged by what changed, and by consistency.`,link:[`τ-bench: tool-agent benchmark with pass^k`,`https://github.com/sierra-research/tau-bench`]},
'ev-stats':{s:`A prompt change moves accuracy from 82% to 85% on 50 questions.`,what:`Confidence intervals and a paired bootstrap on per-question results.`,why:`Small eval sets are noisy; stats tell you if the change is real.`,link:[`SciPy: bootstrap confidence intervals`,`https://github.com/scipy/scipy/blob/HEAD/scipy/stats/_resampling.py`]},
'ev-regression':{s:`A provider retires your model in 60 days, and a prompt change last week broke tool calls.`,what:`An eval suite in CI with a fast smoke subset per commit and per-slice gates.`,why:`Regressions are caught before users see them, and migrations are measured.`,link:[`promptfoo: CI integration`,`https://github.com/promptfoo/promptfoo`]},
'ev-online':{s:`A new retrieval setup looks better offline; you need proof on real users.`,what:`Shadow traffic, then a canary, then an A/B test run to a planned sample size; user feedback logged.`,why:`Real traffic differs from eval sets, and staged rollout limits risk.`,link:[`Arize Phoenix: online LLM evaluation and tracing`,`https://github.com/Arize-ai/phoenix`]},
'sec-threat':{s:`A team adds an email-sending tool to their assistant.`,what:`A threat model mapping data, tools and trust boundaries against the OWASP LLM Top 10.`,why:`Each new tool is a new path for abuse; listing them makes controls deliberate.`,link:[`OWASP Top 10 for LLM Applications`,`https://github.com/OWASP/www-project-top-10-for-large-language-model-applications`]},
'sec-injection':{s:`A browsing assistant reads a web page with hidden text telling it to send the user’s data elsewhere.`,what:`Treating all retrieved content as untrusted and testing with injection payloads.`,why:`Indirect injection arrives through data the model reads, not from the user.`,link:[`garak: LLM vulnerability scanner`,`https://github.com/NVIDIA/garak`]},
'sec-defense':{s:`An email triage agent reads untrusted inbound mail and can reply.`,what:`Least privilege, a quarantined model for untrusted text, fixed reply targets and an egress allowlist.`,why:`Controls outside the model still hold when the model is fooled.`,link:[`CaMeL: separating control and data flow (paper code)`,`https://github.com/google-research/camel-prompt-injection`]},
'sec-output':{s:`A chat UI renders Markdown images, and an injected prompt makes the model emit an image URL carrying secrets.`,what:`Output encoding, domain allowlists for images and links, and parameterized tools instead of raw SQL.`,why:`Model output is untrusted input to the browser and backend.`,link:[`DOMPurify: sanitize model-generated HTML`,`https://github.com/cure53/DOMPurify`]},
'sec-agency':{s:`A support agent holds an admin key that can change any customer’s account.`,what:`User-scoped credentials, narrow task-specific tools, limits per task and approval above them.`,why:`A fooled agent can only do what its permissions allow.`,link:[`OpenAI Agents SDK: guardrails and tool scoping`,`https://github.com/openai/openai-agents-python`]},
'sec-mcp':{s:`A team installs a third-party MCP server, and a later update changes its tool descriptions.`,what:`Version pinning, descriptor review and hashing, and namespaced tools.`,why:`Tool descriptions are instructions the model reads; changes need review.`,link:[`MCP specification: security considerations`,`https://github.com/modelcontextprotocol/modelcontextprotocol`]},
'sec-data':{s:`Traces with full customer chats are exported to an analytics vendor.`,what:`Secrets kept in tool code, PII redaction before logging and export, and retention limits.`,why:`Anything in a prompt or log can leak; keep sensitive data out of both.`,link:[`Microsoft Presidio: PII redaction`,`https://github.com/microsoft/presidio`]},
'sec-rag':{s:`Anyone can edit the wiki that feeds an HR assistant.`,what:`Write controls on trusted sources, provenance on chunks, ingest-time scanning for hidden text.`,why:`Poisoned documents become trusted answers if nothing checks them.`,link:[`LLM Guard: input and output scanners`,`https://github.com/protectai/llm-guard`]},
'sec-dos':{s:`A public demo endpoint runs up a large bill over a weekend.`,what:`Authentication, per-user rate limits, token caps and spend alerts at the gateway.`,why:`Every request costs money; limits stop abuse before the invoice does.`,link:[`LiteLLM: budgets and rate limits per key`,`https://github.com/BerriAI/litellm`]},
'sec-redteam':{s:`Before launch, a team wants evidence the assistant resists jailbreaks and leaks.`,what:`Automated scanners plus scenario-specific red teaming, measured as attack success and false blocks.`,why:`Scanners cover known attacks; your tools and data need custom tests.`,link:[`PyRIT: red-teaming toolkit`,`https://github.com/Azure/PyRIT`]},
};
