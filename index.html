<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Engineering Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F4F7FA; --card:#FFFFFF; --ink:#12243A; --muted:#566678; --line:#D3DCE6; --grid:rgba(18,36,58,.055);
  --teal:#0B7A75; --violet:#5B3FD9; --amber:#C98A00; --rose:#C23A5E; --good:#1B7F4B; --bad:#B3261E;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1B2A; --card:#142A40; --ink:#E8EEF5; --muted:#9BACBF; --line:#274560; --grid:rgba(255,255,255,.045);
    --teal:#3FC6BE; --violet:#A898FF; --amber:#F2C14E; --rose:#F28AA5; --good:#5BD08A; --bad:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1B2A; --card:#142A40; --ink:#E8EEF5; --muted:#9BACBF; --line:#274560; --grid:rgba(255,255,255,.045);
  --teal:#3FC6BE; --violet:#A898FF; --amber:#F2C14E; --rose:#F28AA5; --good:#5BD08A; --bad:#FF8A80;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;color:var(--ink);font:400 16px/1.55 var(--sans);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;display:flex;gap:4px;padding:8px 12px;overflow-x:auto}
.tab{flex:1 0 auto;border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:500;color:var(--muted);text-decoration:none;text-align:center;white-space:nowrap}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
main{max-width:760px;margin:0 auto;padding:20px 16px 72px}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:28px 0 10px;font-weight:600}
h3{font-size:1rem;margin:0 0 4px;font-weight:600}
p{margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}

.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.meter>i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.small{font-size:.85rem;color:var(--muted)}
.search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:14px 0 4px}

.grp{margin:24px 0 8px;font-size:.95rem;font-weight:600;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--teal));border-radius:10px;padding:12px 14px;margin-bottom:8px}
.row:hover{border-color:var(--c,var(--teal))}
.row .t{flex:1;min-width:0}
.row b{display:block;font-weight:600;line-height:1.3}
.row span{display:block;color:var(--muted);font-size:.88rem;line-height:1.35;margin-top:2px}
.row .chk{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.row .chk.on{background:var(--teal);border-color:var(--teal)}
.row .chk svg{width:12px;height:12px;stroke:var(--paper);fill:none;stroke-width:3}

.back{display:inline-block;margin-bottom:10px;color:var(--muted);text-decoration:none;font-weight:500}
.fig{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px 8px;margin:14px 0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.85rem;color:var(--muted);padding:6px 8px 2px}
ul.pts{padding-left:20px;margin:0}
ul.pts li{margin-bottom:8px}
.formula{border-left:4px solid var(--teal);background:var(--card);border-radius:0 10px 10px 0;padding:8px 12px;margin:8px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.formula small{display:block;color:var(--muted);font-size:.8rem}
.formula code{font:500 .95rem/1.5 var(--mono);word-break:break-word}

.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.q p{font-weight:500}
.opt{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--violet)}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.why{font-size:.92rem;color:var(--muted);margin:4px 0 0}
details.fc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
details.fc summary{cursor:pointer;font-weight:500}
details.fc p{margin:8px 0 0;color:var(--muted)}

.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.nav2 a{flex:1;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem}
.nav2 a small{display:block;color:var(--muted)}
.nav2 a:last-child{text-align:right}

.flash{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:240px;padding:24px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;width:100%;font-size:1.1rem;line-height:1.5}
.flash small{color:var(--muted);margin-bottom:10px;font-size:.85rem}
.flash.back-side{border-color:var(--teal)}
select{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.score{font-size:2.4rem;font-weight:700}


.tracks{display:grid;gap:12px;margin:14px 0}
.tcard{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c,var(--teal));border-radius:12px;padding:14px 16px}
.tcard h2{margin:0 0 6px}
.tcard .gl{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:.88rem}
ol.path{padding-left:22px;margin:0 0 14px}
ol.path li{margin-bottom:8px}
@media (min-width:640px){.tracks{grid-template-columns:1fr 1fr}}


.md h4{margin:16px 0 4px;font-size:1rem;font-weight:600}
.md p{margin:0 0 10px}.md ul,.md ol{padding-left:20px;margin:0 0 10px}.md li{margin-bottom:6px}
.md code{font:500 .88em var(--mono);background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.md pre{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.md pre code{border:0;padding:0;background:transparent;font-size:.85rem}
.md .tw{overflow-x:auto;margin:0 0 12px}.md table{border-collapse:collapse;font-size:.9rem;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.md th{background:var(--card)}
.ask{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:0 10px 10px 0;padding:8px 12px;margin:12px 0;font-size:.95rem}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.shead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:transparent;border:0;padding:12px 14px;text-align:left}
.shead h3{margin:0}
.pbar{width:84px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:none}.pbar i{display:block;height:100%;background:var(--teal)}
.sbody{padding:4px 14px 12px;border-top:1px solid var(--line)}
.rlinks{margin:8px 0}.rlinks a{display:inline-block;margin:0 14px 4px 0;font-size:.88rem;color:var(--violet)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}.pt{flex:1;min-width:0;font-size:.95rem}
.steps{display:flex;gap:6px;flex:none}
.st{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:transparent;font-weight:700;color:var(--muted)}
.st.on.L{background:var(--violet);border-color:var(--violet);color:#fff}
.st.on.P{background:var(--amber);border-color:var(--amber);color:#12243A}
.st.on.R{background:var(--good);border-color:var(--good);color:#fff}
.dateinput{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);margin:4px 0}
.routes{display:grid;gap:12px}
.route{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.route h3{margin:4px 0 6px}.route .tag{font-size:.8rem;color:var(--muted)}
.route ul{margin:0;padding-left:18px}.route li{margin-bottom:6px;font-size:.95rem}

.slink{font-size:.8rem;color:var(--violet);margin-left:6px;white-space:nowrap}
.answer{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical;line-height:1.5}

pre.code{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:12.5px/1.5 var(--mono);margin:6px 0}
pre.code.out{background:var(--card)}
.codehead{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.btn.sm{padding:4px 12px;font-size:.85rem}
.ex{margin:10px 0}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{font-size:.75rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.challenge{border-color:var(--rose);color:var(--rose)}
.badge.core{border-color:var(--teal);color:var(--teal)}
details.sol summary{cursor:pointer;font-weight:500;margin-top:8px}
details.exrow{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:0 12px}
details.exrow>summary{display:flex;gap:12px;align-items:center;padding:12px 0;cursor:pointer;list-style:none}
details.exrow>summary::-webkit-details-marker{display:none}
details.exrow .t{display:flex;flex-direction:column}
details.exrow .chk{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
details.exrow .chk.on{background:var(--teal);border-color:var(--teal)}
details.exrow .chk svg{width:12px;height:12px;stroke:var(--paper);fill:none;stroke-width:3}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.grades .btn{display:flex;flex-direction:column;align-items:center;padding:10px 6px}
.grades .btn small{font-weight:400;font-size:.75rem;opacity:.85}
.inp{width:100%;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);margin:4px 0 10px}
.card.today{border-left:5px solid var(--teal);margin-top:12px}
.news{margin-bottom:12px}

/* diagram styles */
svg .ln{stroke:var(--ink);stroke-width:1.5;fill:none}
svg .lm{stroke:var(--muted);stroke-width:1;fill:none;opacity:.55}
svg .bx{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
svg .c1{fill:var(--teal);fill-opacity:.16;stroke:var(--teal);stroke-width:1.5}
svg .c2{fill:var(--violet);fill-opacity:.16;stroke:var(--violet);stroke-width:1.5}
svg .c3{fill:var(--amber);fill-opacity:.22;stroke:var(--amber);stroke-width:1.5}
svg .c4{fill:var(--rose);fill-opacity:.16;stroke:var(--rose);stroke-width:1.5}
svg .g{fill:var(--muted);fill-opacity:.14;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
svg .t{fill:var(--ink);font:500 11px var(--sans)}
svg .tb{fill:var(--ink);font:700 12px var(--sans)}
svg .tm{fill:var(--muted);font:400 10px var(--sans)}
svg .tf{fill:var(--ink);font:500 11px var(--mono)}
svg .s1{stroke:var(--teal);stroke-width:2.2;fill:none}
svg .s2{stroke:var(--violet);stroke-width:2.2;fill:none}
svg .s3{stroke:var(--amber);stroke-width:2.2;fill:none}
svg .s4{stroke:var(--rose);stroke-width:2.2;fill:none}
svg .ar{stroke:var(--ink);stroke-width:1.5;fill:none;marker-end:url(#ah)}
svg .art{stroke:var(--teal);stroke-width:1.6;fill:none;marker-end:url(#aht)}
svg .arr{stroke:var(--rose);stroke-width:1.6;fill:none;marker-end:url(#ahr)}
svg .mk{fill:var(--ink)} svg .mkt{fill:var(--teal)} svg .mkr{fill:var(--rose)}
svg .dash{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3;fill:none}
svg .fill1{fill:var(--teal)} svg .fill2{fill:var(--violet)} svg .fill3{fill:var(--amber)} svg .fill4{fill:var(--rose)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.bar{display:none}body{background:#fff}}

.use{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:0 12px 12px 0;padding:4px 16px 14px;margin:16px 0}
.use h2{margin:10px 0 8px;font-size:1rem}
.use dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px}
.use dt{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.use dd{margin:0}
.uselink{display:inline-block;margin-top:10px;font-size:.9rem;color:var(--violet)}
@media (max-width:480px){.use dl{grid-template-columns:1fr;gap:2px}.use dd{margin-bottom:8px}}
.explain{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:0 12px 12px 0;padding:4px 16px;margin:12px 0}
.explain p{margin:10px 0}
.qa{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
.qa summary{cursor:pointer;font-weight:600}
.qa p{margin:8px 0 2px;color:var(--muted)}
</style>
</head>
<body>

<main id="app"></main>

<script>
/* SVG helpers and diagram functions (FIG). Add new diagrams with Object.assign(FIG, { name(){ ... } }). */

/* ---------- SVG helpers ---------- */
const DEFS='<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" class="mk"/></marker><marker id="aht" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" class="mkt"/></marker><marker id="ahr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" class="mkr"/></marker></defs>';
const svg=(h,body)=>`<svg viewBox="0 0 360 ${h}" role="img" aria-label="Diagram">${DEFS}${body}</svg>`;
const tx=(x,y,s,c='t',a='middle')=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}">${s}</text>`;
const rc=(x,y,w,h,c='bx',r=8)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="${c}"/>`;
const ci=(x,y,r,c='bx')=>`<circle cx="${x}" cy="${y}" r="${r}" class="${c}"/>`;
const ln=(x1,y1,x2,y2,c='ln')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`;
const pa=(d,c='ln')=>`<path d="${d}" class="${c}"/>`;

function chainH(items,y=22,note,ncls='tm'){
  const n=items.length,gap=14,bw=(336-gap*(n-1))/n;let b='';
  items.forEach((it,i)=>{
    const x=12+i*(bw+gap);
    b+=rc(x,y,bw,58,it.c||'bx');
    b+=tx(x+bw/2,y+25,it.t,'tb');
    if(it.s)b+=tx(x+bw/2,y+43,it.s,'tm');
    if(i<n-1)b+=ln(x+bw,y+29,x+bw+gap-1,y+29,'ar');
  });
  if(note)b+=tx(180,y+58+22,note,ncls);
  return svg(y+58+(note?34:22),b);
}
function chainV(items){
  let b='',y=10;
  items.forEach((it,i)=>{
    b+=rc(50,y,260,32,it.c||'bx',7)+tx(62,y+20,it.t,'tb','start')+tx(298,y+20,it.s||'','tm','end');
    if(i<items.length-1)b+=ln(180,y+32,180,y+44,'ar');
    y+=44;
  });
  return svg(y+4,b);
}
function netDiagram(layers){
  const xs=layers.map((_,i)=>40+i*(280/(layers.length-1)));let b='';
  const pos=layers.map((n,li)=>Array.from({length:n},(_,i)=>[xs[li],95+(i-(n-1)/2)*32]));
  for(let l=0;l<layers.length-1;l++)pos[l].forEach(p=>pos[l+1].forEach(q=>b+=ln(p[0],p[1],q[0],q[1],'lm')));
  pos.forEach((ps,l)=>ps.forEach(p=>b+=ci(p[0],p[1],10,l===0?'c1':(l===layers.length-1?'c3':'c2'))));
  layers.forEach((n,l)=>b+=tx(xs[l],185,l===0?'input':(l===layers.length-1?'output':'hidden'),'tm')+tx(xs[l],200,n+' nodes','tm'));
  return svg(212,b);
}
function plot(series,o){
  const h=o.h||210,L=36,R=348,T=14,B=h-44,x0=o.x0,x1=o.x1,y0=o.y0,y1=o.y1;
  const mx=x=>L+(x-x0)/(x1-x0)*(R-L),my=y=>T+(1-(y-y0)/(y1-y0))*(B-T);
  let b=ln(L,B,R,B,'lm')+ln(L,T,L,B,'lm');
  if(y0<0&&y1>0)b+=ln(L,my(0),R,my(0),'dash');
  if(x0<0&&x1>0)b+=ln(mx(0),T,mx(0),B,'dash');
  series.forEach(s=>{
    let d='',pen=false;
    for(let i=0;i<=120;i++){
      const x=x0+(x1-x0)*i/120,y=s.f(x);
      if(y>=y0&&y<=y1){d+=(pen?'L':'M')+mx(x).toFixed(1)+','+my(y).toFixed(1);pen=true}else pen=false;
    }
    b+=pa(d,s.c);
  });
  const w=(R-L)/series.length;
  series.forEach((s,i)=>{const x=L+i*w;b+=ln(x,h-16,x+18,h-16,s.c)+tx(x+23,h-12,s.n,'tm','start')});
  if(o.xl)b+=tx((L+R)/2,h-28,o.xl,'tm');
  return svg(h,b+(o.extra?o.extra(mx,my,B,T):''));
}

/* ---------- Figures ---------- */
const FIG={
dl(){
  let b=ci(92,105,86,'c4')+ci(92,122,62,'c2')+ci(92,138,36,'c1');
  b+=tx(92,40,'AI','tb')+tx(92,78,'Machine learning','t')+tx(92,142,'Deep','tb')+tx(92,155,'learning','tb');
  const L=['Raw pixels','Edges','Parts: eyes, nose','Whole face'];
  L.forEach((s,i)=>{const y=22+i*52;b+=rc(210,y,134,30,i===3?'c1':'bx',7)+tx(277,y+19,s,'t');if(i<3)b+=ln(277,y+30,277,y+50,'ar')});
  b+=tx(277,12,'What each layer learns','tm');
  return svg(222,b);
},
perceptron(){
  let b='';
