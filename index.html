 formulas:[[`Guardrail quality`,`block rate on attacks (recall) vs false blocks on normal traffic`]],
 fig:'defense',cap:`Detection and response are the last layer, not the only one.`,
 src:[L(`Red-team tooling: garak, Llama Guard, PyRIT`,`18-ethics-safety-alignment/16-red-team-tooling-garak-llamaguard-pyrit`),L(`Red teaming and automated attacks`,`18-ethics-safety-alignment/12-red-teaming-pair-automated-attacks`),L(`Chaos engineering for LLMs`,`17-infrastructure-and-production/24-chaos-engineering-llm`)]}
];

const G6='Module 6: Fine-tuning and post-training';
const ENG6=[
{id:'ft-guide',grp:G6,ch:'Start here',title:'Study guide: the Unsloth fine-tuning guide, step by step',tag:`Read one section of the guide, then watch the matching videos. Eight steps, about two weekends.`,
 points:[`Step 1, what fine-tuning is: post-training to change behaviour, add knowledge or optimise a task. Methods are SFT, preference optimisation (DPO, ORPO), distillation and RL (GRPO, GSPO). LoRA trains about 1% of weights; QLoRA does it on a 4-bit base and saves about 75% memory. Watch: Karpathy, State of GPT; Krish Naik's course, first hour.`,
  `Step 2, choose model and method: start with a small instruct model and QLoRA. Unsloth says full fine-tuning is usually unnecessary, and a run that fails with LoRA/QLoRA rarely succeeds with FFT. Names: unsloth-bnb-4bit = dynamic 4-bit (more accurate), bnb-4bit = standard 4-bit, no suffix = original weights. Only one of load_in_4bit / load_in_8bit / full_finetuning may be on. Watch: Dettmers QLoRA talk; Julia Turc or Adam Lucek on quantization.`,
  `Step 3, the dataset: usually question and answer columns. Quality and quantity decide most of the result; synthetic data from a strong model is fine. Watch: pookie's Unsloth guide (dataset formats section). For LogLens this is gen_data.py plus schema checks.`,
  `Step 4, hyperparameters: rank 16 or 32, alpha = r or 2r, all seven target modules, LR 2e-4 (5e-6 for DPO/GRPO), 1–3 epochs, effective batch 16, warmup 5–10%, train on responses only. See the next lesson for the full table. Watch: Trelis on picking LoRA rank and alpha (search link).`,
  `Step 5, install: start in Unsloth's Colab/Kaggle notebooks; local install needs Linux, WSL or Windows (pip install unsloth or Docker).`,
  `Step 6, train and evaluate: loss around 0.5–1.0 is often fine, loss falling toward 0 suggests overfitting. Quick test with max_steps = 60, real runs with 1–3 epochs. Hold out about 20% for testing if you can; automated metrics may not match your criteria, so also chat-test it. Watch: Tech With Tim end to end.`,
  `Step 7, run and deploy: FastLanguageModel.for_inference for faster generation; save the LoRA adapter (about 100 MB) or push to Hugging Face; export GGUF for Ollama or LM Studio on one device, or serve with vLLM for many users.`,
  `Step 8, go further: preference tuning (DPO/ORPO/KTO) and RL (GRPO) in Unsloth's RL guide. Watch: Umar Jamil on DPO, Yannic Kilcher on GRPO.`],
 formulas:[[`Effective batch`,`per_device_train_batch_size × gradient_accumulation_steps`],[`Unsloth starting point`,`r=16, α=16–32, lr=2e-4, batch 2 × accum 4–8, epochs 1–3, warmup 5–10%`]],
 cap:``},

{id:'ft-when',grp:G6,ch:'Lesson 1',title:'When to fine-tune, and the post-training stages',tag:`Fine-tune for behaviour; retrieve for knowledge.`,
 points:[`Prompting first: it is free to iterate. Add RAG when the model needs private or changing facts. Fine-tune when you need a fixed behaviour the prompt can't hold reliably: an output format, a narrow skill, a tone, or a smaller and cheaper model doing one job well.`,
  `Post-training runs in stages. Pretraining gives a base model; SFT (supervised fine-tuning) teaches it to follow instructions and formats; preference tuning (RLHF, DPO) or RL with verifiable rewards (GRPO) sharpens which answers it prefers.`,
  `A small fine-tuned model (1 to 8B) often matches a frontier model on one narrow task at a fraction of the cost and latency, and it can run locally where data can't leave.`,
  `Fine-tuning does not reliably add facts. Knowledge that changes belongs in retrieval; fine-tuning on facts tends to raise hallucination on nearby questions.`,
  `Decide your eval before you train. If you can't measure the behaviour, you can't tell whether training helped.`],
 formulas:[[`Rule of thumb`,`changing knowledge → RAG · fixed behaviour/format → fine-tune · both → fine-tune + RAG`]],
 cap:``},

{id:'ft-templates',grp:G6,ch:'Lesson 2',title:'Chat templates, special tokens and loss masking',tag:`Most silent fine-tuning bugs live here.`,
 points:[`An instruct model was trained on text wrapped in a fixed chat template: role markers, turn separators and an end-of-text token. Granite, for example, wraps turns as <|start_of_role|>user<|end_of_role|> ... <|end_of_text|>.`,
  `Always build training text with tokenizer.apply_chat_template(messages); never hand-format it. A mismatched template teaches a format the model never sees at inference.`,
  `Every assistant turn must end with the EOS token, or the model never learns to stop and rambles.`,
  `Loss masking: set labels to -100 for system and user tokens so cross-entropy counts only the assistant's answer. Without it, capacity goes to reproducing long inputs.`,
  `Before every first run, decode one tokenized row with only the unmasked tokens. You should see exactly the answer and its EOS, nothing else.`,
  `For GGUF, llama.cpp needs --jinja (or an explicit template in the Ollama Modelfile) to use the model's real template.`],
 formulas:[[`Masked SFT loss`,`L = −(1/|A|) Σ_{t∈A} log p(x_t | x_1 … x_(t−1))    A = assistant token positions`]],
 cap:``},

{id:'ft-data',grp:G6,ch:'Lesson 3',title:'Building the dataset: synthetic data that doesn’t lie',tag:`The dataset is the project; the training run is the easy part.`,
 points:[`Start from hand-written seeds that cover every class and edge case, then let a strong model generate variations (services, noise, formats, misleading lines).`,
  `Validate every row with code: a schema (Pydantic or JSON Schema), range checks, and cross-checks against the input (for example, cited line numbers must exist). Drop, don't fix, failing rows.`,
  `Dedupe near-identical rows and balance labels; a class under 3 to 4% of rows is usually learned poorly.`,
  `Quality beats quantity: 2,000 to 5,000 clean rows is plenty for a narrow LoRA task. IBM curated Granite 4.1's SFT data with an LLM-as-judge filter for the same reason.`,
  `Hold out a test set, hand-check it, and never train on it. Add a small real-world slice (public GitHub issues, open datasets) to catch a model that only learned the generator's style.`,
  `Never put client or production data into training sets you plan to publish, even scrubbed.`],
 formulas:[[`Split`,`train ≈ 85% · val ≈ 7.5% · test ≈ 7.5% (test hand-verified, never trained on)`]],
 cap:``},

{id:'ft-lora',grp:G6,ch:'Lesson 4',title:'LoRA and QLoRA: the memory math',tag:`Why a 3B model fine-tunes on a free 16 GB T4.`,
 points:[`LoRA freezes the base weights W and learns a low-rank update BA. B starts at zero, so training begins exactly at the base model.`,
  `Rank r sets adapter capacity: 8 to 16 for formats and narrow skills, 32 to 64 for harder behaviour. alpha scales the update; alpha = r or 2r is common.`,
  `Target all linear layers (q, k, v, o, gate, up, down); attention-only usually trains worse for the same budget.`,
  `Worked example (a 32-layer model, hidden 2048, MLP 8192, r = 16): attention adds 4 × 16 × (2048 + 2048) = 262,144 params per layer and MLP adds 3 × 16 × (2048 + 8192) = 491,520, so 753,664 per layer and about 24.1M in total, under 1% of a 3B model.`,
  `QLoRA stores the frozen base in 4-bit NF4 (with double-quantized scales and paged optimizers). A 3B base is about 3e9 × 0.5 bytes ≈ 1.5 to 2 GB; the 24M trainable params cost about 16 bytes each with Adam (about 0.4 GB). Activations, with gradient checkpointing, take most of the rest.`,
  `Trade-off: QLoRA is slightly below 16-bit LoRA in quality, for a large memory saving.`],
 formulas:[[`LoRA update`,`W′ = W + (α / r) · B·A    A: r×k, B: d×r, B₀ = 0`],[`Params per adapted matrix`,`r × (d_in + d_out)`],[`Base memory in 4-bit`,`≈ params × 0.5 bytes`]],
 cap:``},

{id:'ft-hparams',grp:G6,ch:'Lesson 4b',title:'LoRA hyperparameters cheat sheet (Unsloth)',tag:`Every knob, its starting value, and what to turn when it over- or underfits.`,
 points:[`Rank r: 8–128, start with 16 or 32. Higher adds capacity and memory and can overfit.`,
  `Alpha: r or 2 × r (alpha/r of 1–2). 2× learns more aggressively. rsLoRA scales by alpha/√r instead and can help at high ranks.`,
  `Dropout: 0 (fastest in Unsloth) up to 0.1 if overfitting.`,
  `Target modules: all seven, q, k, v, o, gate, up, down. Dropping some saves little memory and costs accuracy.`,
  `Learning rate: 2e-4 for LoRA/QLoRA, about 5e-6 for DPO and GRPO, lower again for full fine-tuning.`,
  `Epochs 1–3; batch 2 with gradient accumulation 8 (effective 16); weight decay 0.01–0.1; warmup 5–10% of steps; linear or cosine schedule; fix a seed such as 3407.`,
  `Train on responses only (train_on_responses_only with the model's instruction and response markers): masks user turns, worth about 1% accuracy, more on multi-turn data.`,
  `Gradient checkpointing "unsloth" saves about 30% more memory. LoRA in 16-bit is slightly more accurate; QLoRA in 4-bit uses about 4× less VRAM.`,
  `Overfitting (training loss under about 0.2): lower LR, fewer epochs, more weight decay or dropout, bigger batch, early stopping, or halve alpha.`,
  `Underfitting: raise LR, train longer while watching validation loss, raise rank and alpha, or use more relevant data.`],
 formulas:[[`LoRA scale`,`α / r   (rsLoRA: α / √r)`],[`Total steps`,`⌈rows / (batch × accum)⌉ × epochs`],[`Warmup steps`,`≈ 0.05–0.10 × total steps`]],
 cap:``},

{id:'ft-sft',grp:G6,ch:'Lesson 5',title:'Running SFT and reading the loss curve',tag:`Loss going down is not the goal; the task metric is.`,
 points:[`Typical QLoRA SFT start: learning rate 2e-4, cosine schedule, about 5% warmup, 1 to 3 epochs, effective batch 16, 8-bit AdamW.`,
  `Unsloth plus Hugging Face TRL's SFTTrainer is the usual free-GPU stack; Unsloth's train_on_responses_only applies the assistant-only mask.`,
  `Train and val both falling: keep going. Train falling but val rising: overfitting, so stop at the best checkpoint or cut epochs.`,
  `Loss near zero almost immediately: duplicates or leakage between train and val. Spiky loss or NaN: learning rate too high or a malformed row.`,
  `Run the task eval (format validity, accuracy) on checkpoints. Val loss can rise slightly while the task metric still improves.`,
  `Kaggle (2× T4, a fixed weekly GPU quota, background runs) or Colab (one T4; free time is dynamic and idle sessions disconnect) both run a 3B QLoRA job in an hour or two.`],
 formulas:[[`Effective batch`,`per-device batch × grad accumulation × GPUs`],[`Steps`,`⌈rows / effective batch⌉ × epochs`]],
 cap:``},

{id:'ft-dpo',grp:G6,ch:'Lesson 6',title:'Preference tuning with DPO',tag:`Teach the model which of two good-looking answers is better.`,
 points:[`DPO trains on (prompt, chosen, rejected) triples and needs no separate reward model or PPO loop; it optimizes the preference directly against a frozen reference.`,
  `The reference is your SFT model. With LoRA, the reference is just the base with adapters switched off, so no second copy sits in memory.`,
  `Build pairs on-policy: sample 4 or so answers per prompt from the SFT model at temperature about 0.9, rank them with rules plus an LLM judge, and keep best as chosen and worst as rejected.`,
  `β (about 0.1) controls how far the policy may move from the reference; higher β stays closer. Use a much lower learning rate than SFT, about 5e-7 to 5e-6, and usually 1 epoch.`,
  `Watch the reward margin rise. If the chosen answer's log-probability also drops a lot, the model is drifting; lower the learning rate or stop earlier.`,
  `DPO refines a model that can already do the task. It can't teach the format from scratch, which is why it comes after SFT.`],
 formulas:[[`DPO loss`,`L = −log σ( β·[(log π(y_w|x) − log π_ref(y_w|x)) − (log π(y_l|x) − log π_ref(y_l|x))] )`]],
 cap:``},

{id:'ft-eval',grp:G6,ch:'Lesson 7',title:'Evaluating a fine-tuned model honestly',tag:`Same harness, same test set, every system.`,
 points:[`Score base (well prompted), SFT, SFT + DPO and a frontier model with one script, the same prompts and temperature 0.`,
  `Structure metrics first: schema-valid rate, exact match per field, F1 on list fields. Then quality: an LLM judge with a rubric, plus a hand-scored sample to measure judge agreement.`,
  `Run 3 seeds and report the mean; a 300-row test set can swing several points between runs.`,
  `Look for regressions: general chat, refusals, out-of-distribution inputs, and the quantized model (Q4 can cost a point or two).`,
  `Keep eval data separate from training data, and report weaknesses in the model card.`],
 formulas:[[`List-field F1`,`2|P∩G| / (|P| + |G|)`]],
 cap:``},

{id:'ft-ship',grp:G6,ch:'Lesson 8',title:'Merge, quantize and serve',tag:`An adapter isn't a product until someone can run it.`,
 points:[`Either merge the LoRA into the base weights (one model file) or keep adapters separate so one server can host many (vLLM multi-LoRA).`,
  `GGUF for laptops and Ollama: Q4_K_M is the usual size and quality balance; Q8_0 is near lossless.`,
  `Ollama Modelfile: FROM the GGUF, set the chat template and stop tokens, temperature 0 for extraction.`,
  `Use vLLM or SGLang instead of Ollama when you need many concurrent users, continuous batching or multiple adapters.`,
  `Publish the adapter, GGUF and a model card (data, training setup, results table, caveats, licence) to Hugging Face.`],
 formulas:[[`Q4 model size`,`≈ params × 4.5–5 bits / 8`]],
 cap:``},

{id:'ft-project',grp:G6,ch:'Project',title:'Build it: LogLens-Granite (Granite-4.1-3B, SFT + DPO)',tag:`Your fine-tuning project, plan and progress in one place.`,
 points:[`Goal: Granite-4.1-3B reads a Java/Spring Boot stack trace plus 20 to 60 log lines and returns strict JSON {service, error_class, severity, probable_root_cause, evidence_lines, suggested_fix, confidence}. It becomes the cheap local first-pass triage agent in your RCA GraphRAG system.`,

  `Phase 2 (weekend 3, Lessons 4 and 5): QLoRA r = 16, α = 32, all linear layers, 2 epochs, LR 2e-4, assistant-only loss; gate at 97% or more JSON-valid and clearly above baseline.`,
  `Phase 3 (weekend 4, Lesson 6): 1,500 prompts × 4 samples, rank by rules plus judge, DPO β = 0.1, LR 5e-6, 1 epoch; gate: root-cause score up with no drop in validity.`,
  `Phase 4 (weekend 5, Lesson 8): merge, Q4_K_M GGUF, Hugging Face adapter and GGUF, Ollama Modelfile, wired into the RCA demo, model card.`,

  `Resume line: Fine-tuned IBM Granite-4.1-3B with QLoRA SFT + DPO for Java microservice log triage; raised schema-valid output from X% to Y% and error-class accuracy by Z points over base on a 300-case held-out set; served via Ollama as the first-pass agent in a multi-agent GraphRAG RCA system.`,
  `Ground rules: no AT&T or BGW logs, names or error codes, even scrubbed; personal hardware and accounts; check IBM outside-activity and open-source guidelines before publishing; no IBM branding in the repo name.`],

const G7='Module 7: What’s new (frontier watch, Nov 2026)';
const ENG7=[
{id:'nw-map',grp:G7,ch:'Overview',title:'The 2026 map: where LLMs are changing',tag:`Five shifts to track. Dated 24 Nov 2026; revisit monthly.`,
 points:[`Architecture, depth: looped (recurrent-depth) transformers reuse the same layers several times, adding compute without adding parameters. GLM-5.4 (23 Nov 2026) is the first big flagship built this way. Lesson 1.`,
  `Architecture, attention: hybrids mix a few full-attention layers with cheaper linear or sliding-window layers. By late 2026 about half of new open models use some full attention and half use none. Lesson 2.`,
  `Architecture, capacity: sparse mixture-of-experts is the default for big models: hundreds of billions of total parameters, tens of billions active per token. Lesson 3.`,
  `Training: post-training has shifted from RLHF toward RL with verifiable rewards (RLVR) using GRPO-style algorithms, and its share of compute keeps growing. Lesson 4.`,
  `Wild cards: diffusion language models that generate tokens in parallel, and tiny recursive models that beat big ones on puzzles like ARC-AGI. Lesson 5.`,
  `Ecosystem: strong open weights (Qwen, DeepSeek, GLM, Kimi, Mistral, Meta, NVIDIA) make fine-tuning and self-hosting realistic. Lesson 6.`,
  `How the shifts relate: MoE keeps compute fixed and grows parameters (more knowledge); looping keeps parameters fixed and grows compute (more reasoning); hybrid attention cuts the cost of long context.`],
 formulas:[[`Three scaling knobs`,`MoE: ↑ params, = FLOPs/token · Looping: = params, ↑ FLOPs/token · Hybrid attention: ↓ KV memory and attention cost`]],
 cap:``},

{id:'nw-loop',grp:G7,ch:'Lesson 1',title:'Looped transformers and GLM-5.4',tag:`Run the same layers again instead of adding new ones.`,
 points:[`A normal transformer passes each token through N different layers once. A looped (recurrent-depth) transformer passes it through a shared block r times, so effective depth grows with r while parameters stay the same.`,
  `The idea goes back to the Universal Transformer (2018). Recent work: Huginn (Geiping et al., 2025) loops a recurrent block a variable number of times and improves on reasoning with more test-time iterations; Ouro (ByteDance and others, 2025) trained looped LMs through the full pipeline and reports 2 to 3x parameter efficiency.`,
  `Why it matters: it is a new axis of test-time compute. Instead of writing a long chain of thought in tokens, the model "thinks" in its hidden state by iterating, sometimes called latent reasoning.`,
  `Design pattern: prelude layers (encode) → recurrent core looped r times → coda layers (decode). Huginn re-injects the input at each loop for stability.`,
  `GLM-5.4 (Z.ai / Zhipu, 23 Nov 2026): about 750B parameters, built by continued training of the GLM-5 base rather than from scratch. It runs 28 existing layers twice with shared weights; the second pass keeps an extra cache only for a recent window of tokens.`,
  `Z.ai's evidence: on a controlled 30B experiment, looping with about 10% more training compute raised GPQA-Diamond from 47.58 to 56.26 and cut output length 11.7%. Its flagship win-rate chart (51.1% wins vs GLM-5.3) gives no task details, so the "comparable to 2–3T models" claim is unverified so far.`,
  `Trade-offs: the extra pass costs compute per token; reviewers saw long "marathon thinking" runs in agentic coding. Weights are promised after safety hardening, with no date yet.`,
  `Interview line: "MoE scales parameters at fixed compute; looping scales compute at fixed parameters. They're complementary."`],
 formulas:[[`Effective depth`,`layers_prelude + r × layers_core + layers_coda   (params count the core once)`],[`GLM-5.4 example`,`28 shared layers × 2 passes → 56 layers of compute, 28 layers of weights`]],
 cap:``},

{id:'nw-hybrid',grp:G7,ch:'Lesson 2',title:'Hybrid and linear attention',tag:`Keep a little full attention for recall; make the rest cheap.`,
 points:[`Full softmax attention costs grow with the square of sequence length, and the KV cache grows with every token. That is the long-context bottleneck (see Module 3, KV cache).`,
  `Linear attention and state-space models (Mamba, Gated DeltaNet) keep a fixed-size state instead of a growing cache, so cost is linear and memory constant, but exact recall over long context is weaker.`,
  `The 2025–26 answer is hybrids: for example 3 linear-attention layers to 1 full-attention layer (Qwen3-Next, Qwen3.5, Kimi Linear), or sliding-window plus global layers.`,
  `Sebastian Raschka's survey: in 2025 most open models still used full attention everywhere; by the second half of 2026 it is roughly a 50/50 split between "some full attention" hybrids and models with no full attention at all.`,
  `Related tricks you'll see in model cards: MLA (multi-head latent attention, compresses KV), DeepSeek Sparse Attention, sliding-window attention, GQA.`,
  `Practical effect for you: cheaper 1M-token contexts and faster long-document RAG; check that your serving engine supports the architecture before choosing a model.`],
 formulas:[[`Full attention cost`,`O(n²) compute, KV memory ∝ n`],[`Linear attention / SSM`,`O(n) compute, fixed-size state`]],
 cap:``},

{id:'nw-moe',grp:G7,ch:'Lesson 3',title:'Mixture-of-experts is the default',tag:`Huge total parameters, small active set per token.`,
 points:[`An MoE layer replaces one MLP with many expert MLPs plus a router that sends each token to a few experts (top-k). Only those experts run.`,
  `So "816B total / 42B active" means memory for 816B parameters but compute per token like a 42B dense model. Example: Meta's Muse Spark Open routes each token to 8 of 256 experts.`,
  `Benefits: more knowledge capacity at the same per-token cost. Costs: all experts must sit in memory, routing needs load balancing, and serving needs expert parallelism (Module 3, parallelism lesson).`,
  `Fine-tuning MoE with LoRA works but is memory-heavy; for your LogLens project a dense 3B model is the right choice.`],
 formulas:[[`Per-token compute`,`≈ 2 × active params FLOPs`],[`Memory`,`∝ total params (all experts loaded)`]],
 cap:``},

{id:'nw-post',grp:G7,ch:'Lesson 4',title:'Post-training now: RLVR, GRPO and agents',tag:`Rewards from checkers, not just human preferences.`,
 points:[`RLVR (reinforcement learning with verifiable rewards), named in AI2's Tülu 3, trains on tasks whose answers a program can check: math answers, unit tests, format rules. The reward is often simply 1 or 0.`,
  `DeepSeek-R1 popularised it with GRPO: sample a group of answers per prompt, score them, and use each answer's reward relative to the group as its advantage, with no separate value model.`,
  `RLHF and RLVR are both policy-gradient methods; the difference is the reward signal, not the maths.`,
  `Trend: post-training's share of compute is rising fast. R1 used about 5% of its compute on RL; newer models use much more, extended to agentic tasks (tool use, multi-step environments).`,
  `Limit: RLVR needs automatic checkers, so it is strongest in math, code and structured outputs, and reward hacking is a constant risk.`,
  `For LogLens: your JSON schema validator and error-class match are verifiable rewards, so a small GRPO stage after SFT is a natural extension.`],
 formulas:[[`GRPO advantage`,`Aᵢ = (rᵢ − mean(r₁…r_G)) / std(r₁…r_G)`],[`RLVR reward`,`r(x, y) ∈ {0, 1} from a verifier, minus β · KL(π ‖ π_ref)`]],
 cap:``},

{id:'nw-wild',grp:G7,ch:'Lesson 5',title:'Wild cards: diffusion LMs and tiny recursive models',tag:`Two directions that could change the defaults.`,
 points:[`Diffusion language models generate by refining a whole block of masked tokens in parallel instead of one token at a time. Examples: LLaDA (scaled to 100B in LLaDA 2.0), Gemini Diffusion, Mercury. Claimed speeds reach about 1,000 tokens per second on standard GPUs.`,
  `Trade-off: very fast, but quality and tooling still lag autoregressive models for most production uses.`,
  `Tiny recursive models: HRM (Hierarchical Reasoning Model) and TRM (Tiny Recursive Model) loop very small networks and beat frontier LLMs on puzzle benchmarks like ARC-AGI with a tiny fraction of the parameters. They're specialists, not chatbots, but they inspired the looping trend (Lesson 1).`],
 formulas:[],
 cap:``},

{id:'nw-open',grp:G7,ch:'Lesson 6',title:'Open-weight landscape and how to keep up',tag:`Who ships what, and a 30-minute weekly routine.`,
 points:[`As of November 2026, Hugging Face had public weights for Qwen3.8 models, GLM-5.3, DeepSeek V4, Mistral Large 4 and, from early November, Kimi K3.1 Pro (1M context). Meta's Muse Spark Open and NVIDIA's Nemotron 3 Ultra are other notable open releases. Licences vary: some Apache-2.0 or MIT, several custom.`,
  `For coding, vendor-reported Terminal-Bench 2.1 leaders among open models in November 2026 include DeepSeek V4.1-Flash, Kimi K3 and GLM-5.3. Treat vendor numbers as claims until independent evals agree.`,
  `IBM Granite (4.1: 3B, 8B, 30B) remains the practical small-model choice for your fine-tuning work; frontier open models are for self-hosted inference and distillation.`,
  `Weekly routine: skim Raschka's architecture gallery and blog for new model diagrams; read one model card or tech report end to end; check Hugging Face trending; watch one deep-dive video. Update this module when something sticks.`,
  `When reading a release: separate (1) architecture changes, (2) training/data changes, (3) evals with named tasks and sample sizes, and (4) marketing claims with no method.`],
 formulas:[],
 cap:``}
];

/* Plain-language explanations, diagrams and self-checks for Modules 6 and 7. */
const EXTRA67={
'ft-guide':{fig:'ftguide',cap:'The eight steps of Unsloth’s guide, with what to watch at each.',
 ex:[`Think of fine-tuning as on-the-job training for a model that already speaks the language. Pretraining taught it language and facts from the internet; fine-tuning teaches it your job: your format, your vocabulary, your decisions.`,
  `The guide is a recipe. Pick a small instruct model, load it in 4-bit (QLoRA), show it a few thousand good examples, train for one to three passes, check it, then export it. Most of the skill is in the data and in reading the loss, not in exotic settings.`,
  `<b>Example:</b> for LogLens you show Granite-4.1-3B 3,400 pairs of “log lines → triage JSON”. After training it produces that JSON reliably, where the base model often drifted from the schema.`],
 q:[[`Why start with QLoRA instead of full fine-tuning?`,`It fits on a free 16 GB GPU, trains ~1% of the weights, and Unsloth notes that if LoRA/QLoRA fails, full fine-tuning rarely fixes it.`],[`What usually decides whether a fine-tune works?`,`Dataset quality and quantity, more than hyperparameters.`]]},
'ft-when':{fig:'ftstages',cap:'The post-training stages, from base model to verified skills.',fig2:'ftdecide',cap2:'A quick decision: RAG for facts that change, fine-tuning for behaviour.',
 ex:[`A base model only continues text. SFT shows it examples of instructions and good answers, so it learns to follow requests and formats. Preference tuning (DPO, RLHF) then teaches it which of two reasonable answers people prefer. RL with verifiable rewards (GRPO) lets it practise on tasks a program can check.`,
  `RAG and fine-tuning solve different problems. RAG puts fresh documents in front of the model at question time. Fine-tuning changes the model’s habits. If your answer depends on facts that change weekly, retrieve them; if it depends on a style or a decision procedure, train it.`,
  `<b>Example:</b> a billing bot needs today’s tariff (RAG) and must always answer in your ticket template (fine-tune). Use both.`],
 q:[[`A model ignores your JSON schema 10% of the time even with a good prompt. RAG or fine-tune?`,`Fine-tune: it is a behaviour/format problem, not missing knowledge.`],[`What does SFT teach that pretraining doesn’t?`,`To follow instructions and produce answers in a given format, turn by turn.`]]},
'ft-templates':{fig:'fttemplate',cap:'Only the assistant tokens and the end-of-text token count in the loss.',
 ex:[`Chat models read conversations as one long string with special markers: who is speaking, where each turn ends. Granite wraps each turn in role markers and ends it with an end-of-text token. If you train with different markers, the model learns a dialect it will never see in real use.`,
  `Loss masking decides what the model is graded on. You set the label of every system and user token to -100, which tells the loss function to skip it. The model is then only scored on producing the answer and the stop token, which is exactly the behaviour you want.`,
  `<b>Example:</b> a LogLens row is about 600 tokens of logs and 80 tokens of JSON. Without masking, 88% of the training signal would be “predict the next log line”, which is useless.`],
 q:[[`Your fine-tuned model answers correctly but never stops. Likely cause?`,`The EOS token is missing from the assistant turns in the training data, or the chat template doesn’t match.`],[`What does a label of -100 mean?`,`Ignore this token in the cross-entropy loss.`]]},
'ft-data':{fig:'ftdata',cap:'A synthetic-data pipeline where code, not hope, guarantees quality.',
 ex:[`Synthetic data means asking a strong model to write training examples for a smaller one. It is cheap and fast, but the generator makes mistakes and repeats itself, so every row must pass automatic checks before it is kept.`,
  `Checks are simple and strict: does the JSON parse, are all fields valid, do the cited line numbers exist, is the label what we asked for? A row that fails is dropped. Then remove near-duplicates and make sure each class has enough examples.`,
  `<b>Example:</b> if 4,000 rows are generated and 3,800 pass, you train on 3,800. If “DEADLOCK” only has 40 rows, generate more for it before training.`],
 q:[[`Why keep a small set of real (non-synthetic) test cases?`,`To catch a model that only learned the generator’s style; a big gap between synthetic and real scores shows it.`],[`Should you hand-fix rows that fail validation?`,`No. Drop them; fixing invites inconsistent labels and bias.`]]},
'ft-lora':{fig:'ftlora',cap:'LoRA: the big matrix W stays frozen; two thin matrices A and B learn the change.',fig2:'ftmem',cap2:'Why QLoRA fits a free GPU: memory for weights and trainable state.',
 ex:[`A layer’s weight matrix W might be 2048 × 2048, about four million numbers. Full fine-tuning updates all of them. LoRA bets that the change you need is simple, so it learns it as the product of two thin matrices: A (16 × 2048) and B (2048 × 16), about 65,000 numbers.`,
  `B starts at zero, so at step zero the model is exactly the original. During training only A and B change, and their product is added to W’s output, scaled by α/r. QLoRA stores W in 4-bit to save memory while A and B train in 16-bit.`,
  `<b>Example:</b> with rank 16 on all seven layer types of a 32-layer model, LoRA trains about 24 million parameters, under 1% of a 3B model.`],
 q:[[`Why does B start at zero?`,`So B·A = 0 and training starts from the exact base model.`],[`What does QLoRA quantize, and what stays 16-bit?`,`The frozen base weights go to 4-bit NF4; the LoRA adapters (and their gradients) stay 16-bit.`]]},
'ft-hparams':{fig:'fthparams',cap:'Read the loss, then turn the right knob.',
 ex:[`Most runs need only a few settings: rank, alpha, learning rate, epochs and effective batch size. Start from Unsloth’s defaults and change one thing at a time.`,
  `If training loss drops very low (under about 0.2) the model is memorising: make learning gentler or shorter. If loss stays high, the model is not learning enough: give it more capacity, more steps or better data.`,
  `<b>Example:</b> 3,400 rows, batch 2 × accumulation 8 = 16 per step → 213 steps per epoch → 426 steps for 2 epochs → about 21–43 warmup steps.`],
 q:[[`Loss falls to 0.05 by epoch 2. What two changes do you try first?`,`Fewer epochs (or early stopping) and a lower learning rate; halving alpha is another option.`],[`What learning rate is typical for LoRA SFT versus DPO?`,`About 2e-4 for LoRA/QLoRA SFT; about 5e-6 for DPO or GRPO.`]]},
'ft-sft':{fig:'ftloss',cap:'Train loss keeps falling; validation loss turns up when overfitting starts.',
 ex:[`During SFT the trainer shows the model batches of examples, measures how surprised it is by the correct answer (the loss), and nudges the adapters to be less surprised. Watching both training and validation loss tells you whether it is learning or memorising.`,
  `Stop at the checkpoint where validation loss is lowest, then confirm with your task metric. Sometimes validation loss rises slightly while the task metric still improves; trust the task metric, but check outputs by hand.`,
  `<b>Example:</b> on Kaggle a 3B QLoRA run with 3,400 rows and 2 epochs typically takes 1–2 hours; first try max_steps = 60 to make sure everything runs.`],
 q:[[`Loss is near zero after 30 steps. What is the likely problem?`,`Duplicates or leakage between train and validation data, or a trivial task.`],[`Why do a 60-step test run first?`,`To catch template, masking and memory bugs in minutes, not hours.`]]},
'ft-dpo':{fig:'ftdpo',cap:'On-policy DPO: sample, rank, then train on best versus worst.',
 ex:[`SFT teaches the model to copy one good answer. But often several answers are valid and some are better than others. DPO shows the model pairs, a chosen answer and a rejected one, and pushes it to prefer the chosen one more than a frozen copy of itself (the reference) does.`,
  `β controls how far it may drift from the reference. The learning rate is far smaller than in SFT because you are refining, not teaching from scratch.`,
  `<b>Example:</b> for one log, the SFT model writes four triages. The one naming “HikariCP pool exhausted after downstream latency spike” beats “database issue”. That pair becomes a DPO example.`],
 q:[[`Why must SFT come before DPO here?`,`DPO only reweights answers the model can already produce; it can’t teach the JSON format from scratch.`],[`What happens if β is very small?`,`The model is allowed to move far from the reference and may drift or over-optimise the preference data.`]]},
'ft-eval':{fig:'fteval',cap:'One test set, one harness, four systems.',
 ex:[`An evaluation is only fair if every system gets the same inputs, the same prompt and the same decoding settings. Otherwise you are comparing setups, not models.`,
  `Measure structure first (is the JSON valid, are fields right), then quality (is the root cause specific and correct). Use an LLM judge for quality, but hand-score a sample so you know how often the judge agrees with you.`,
  `<b>Example:</b> base 71% JSON-valid, SFT 98%, SFT+DPO 98% with a better judge score. That is a clean story for your resume.`],
 q:[[`Why run three seeds?`,`Small test sets are noisy; the mean of three runs shows whether a gain is real.`],[`What should you check after quantizing to Q4?`,`Re-run the same eval; quantization can lower scores slightly.`]]},
'ft-ship':{fig:'ftship',cap:'Two deployment paths: a single local model, or one server with many adapters.',
 ex:[`After training you have a small adapter file. For a laptop, merge it into the base and export a quantized GGUF file that Ollama or llama.cpp can run. For a team service, keep adapters separate and let vLLM serve one base model with several adapters.`,
  `Quantization shrinks the model (Q4_K_M is the usual balance of size and quality) but can cost a little accuracy, so always re-run your eval on the exact file you ship.`,
  `<b>Example:</b> a 3B model in Q4_K_M is about 2 GB and runs comfortably on an 8 GB laptop GPU.`],
 q:[[`When would you choose vLLM over Ollama?`,`Many concurrent users, continuous batching, or several LoRA adapters on one base.`],[`Which quant level is the usual default?`,`Q4_K_M; Q8_0 if you need near-lossless quality.`]]},
'ft-project':{fig:'ftproject',cap:'Five phases, each with a pass/fail gate.',
 ex:[`The project is staged so you never build on a broken step. Each phase ends with a gate: a number or check that must pass before you continue.`,
  `This mirrors how real ML teams work: baseline first, then data, then training, then refinement, then shipping, with evaluation at every step.`],
 q:[[`Why measure the base model before training anything?`,`Without a baseline you can’t show that fine-tuning helped, or by how much.`]]},
'nw-map':{fig:'nwmap',cap:'Five shifts to watch in 2026.',
 ex:[`Model progress used to mean “same design, bigger”. In 2026 the design itself is changing on several fronts at once: how deep the computation goes, how attention handles long text, how capacity is spread across experts, and how models are trained after pretraining.`,
  `A simple way to hold it: MoE gives more knowledge for the same compute; looping gives more thinking for the same parameters; hybrid attention makes long context cheaper; RLVR teaches skills that can be checked.`],
 q:[[`Which knob adds parameters without adding per-token compute?`,`Mixture-of-experts.`],[`Which knob adds compute without adding parameters?`,`Looping (recurrent depth).`]]},
'nw-loop':{fig:'nwloop',cap:'A standard stack versus a looped stack: same core weights, used r times.',fig2:'nwglm',cap2:'How GLM-5.4 applies the idea, per Z.ai’s announcement and coverage.',
 ex:[`A transformer thinks by passing each token’s hidden state up through its layers. More layers mean more steps of computation, but also more parameters to store. A looped transformer reuses one block several times, so the hidden state gets refined repeatedly without new weights.`,
  `This lets a model “think longer” internally instead of writing a long chain of thought. Researchers call it latent reasoning. Training is trickier: loops can become unstable, so designs re-inject the input at each loop and train with varying loop counts.`,
  `<b>Example:</b> GLM-5.4 runs 28 of its layers twice. Z.ai reports a 30B experiment where this raised a reasoning benchmark by about 9 points for ~10% more training compute. Big claims about matching 2–3T models are not yet backed by published evals.`],
 q:[[`What grows with the number of loops, and what stays fixed?`,`Compute per token grows; parameter count stays fixed.`],[`Why did Z.ai adapt GLM-5 rather than train from scratch?`,`Looped models trained from scratch still trail standard ones at the same cost, so they converted a strong pretrained base with continued training.`]]},
'nw-hybrid':{fig:'nwhybrid',cap:'A 3:1 hybrid: mostly cheap linear layers, some full attention for exact recall.',fig2:'nwcost',cap2:'How cost grows with context length.',
 ex:[`Full attention compares every token with every earlier token, so doubling the context quadruples the work, and the KV cache keeps growing. Linear attention and state-space models squash the past into a fixed-size memory, so cost grows only linearly, but they recall exact details less well.`,
  `Hybrids keep a few full-attention layers to look things up precisely and make the rest cheap. That is why recent models handle 1M-token contexts at reasonable cost.`,
  `<b>Example:</b> in a 48-layer 3:1 hybrid only 12 layers keep a full KV cache, roughly a quarter of the memory of an all-attention model at long context.`],
 q:[[`What do linear-attention layers trade away for speed?`,`Exact long-range recall; they compress history into a fixed-size state.`],[`Why keep any full-attention layers?`,`To retrieve precise details (names, numbers, code) from far back in the context.`]]},
'nw-moe':{fig:'nwmoe',cap:'A router picks 2 of 8 experts for this token; the rest stay idle.',
 ex:[`In a mixture-of-experts layer, the single feed-forward block is replaced by many smaller “experts”. A router looks at each token and sends it to the best few. The model knows a lot (many experts), but each token only pays for the few it visits.`,
  `The catch is memory and serving: every expert must be loaded, the router must spread work evenly, and big MoE models are split across many GPUs.`,
  `<b>Example:</b> 816B total / 42B active means you need memory for 816B parameters but each token costs about as much compute as a 42B dense model.`],
 q:[[`Does MoE reduce the memory needed to serve a model?`,`No. All experts must be in memory; it reduces compute per token.`]]},
'nw-post':{fig:'nwgrpo',cap:'GRPO with a verifier: answers above the group average are reinforced.',
 ex:[`RLHF needs people (or a reward model) to say which answer is better. RLVR replaces that with a checker: run the unit tests, compare the maths answer, validate the JSON. The reward is often just 1 or 0.`,
  `GRPO makes this cheap: for each prompt, sample a group of answers, score them all, and treat each answer’s score relative to the group average as its advantage. No separate value model is needed.`,
  `<b>Example:</b> for LogLens, reward = 1 if the JSON is valid and the error class matches the gold label, else 0. Four samples score 1, 0, 1, 0, so the two correct ones get pushed up.`],
 q:[[`Where does RLVR work best?`,`Where correctness can be checked automatically: maths, code, structured outputs.`],[`What does GRPO use instead of a value model?`,`The mean and standard deviation of rewards across a group of samples for the same prompt.`]]},
'nw-wild':{fig:'nwdiff',cap:'Autoregressive generation versus diffusion-style parallel refinement.',
 ex:[`Normal LLMs write one token at a time, left to right. Diffusion language models start with a block of masked placeholders and fill them in over a few rounds, many tokens at once. That can be much faster, but quality and tooling are still catching up.`,
  `Tiny recursive models go the other way: very small networks that loop many times on hard puzzles. They are specialists, but they showed how much looping can do, which fed into the looped-transformer trend.`],
 q:[[`What is the main advantage of diffusion LMs?`,`Parallel generation, so much higher tokens per second.`]]},
'nw-open':{fig:'nwrelease',cap:'Sort every model release into four buckets before believing it.',
 ex:[`New models arrive weekly, and announcements mix real changes with marketing. Reading every release the same way keeps you calm: what changed in the architecture, what changed in training, which evaluations were run (named tasks and sample sizes), and which claims have no method behind them.`,
  `Open weights matter to you because they can be fine-tuned and self-hosted. Small open models like Granite are for your own training; large open models are for self-hosted inference and for generating training data.`],
 q:[[`A launch chart shows win rates with no tasks or sample size. How much weight do you give it?`,`Very little until independent or detailed evals appear.`]]}

const EX2=[
{id:'found-python',grp:EXG4,ch:'Python',title:'Python programming fundamentals',tag:`Reading and tracing code is a core skill, so know the gotchas.`,
 points:[`Immutable types: int, float, str, tuple, frozenset. Mutable: list, dict, set. Names are references: b = a makes two names for one object; a[:] or a.copy() makes a new list.`,
  `Division and modulo: 7 // 2 = 3, −7 // 2 = −4 (floor division rounds toward minus infinity), −7 % 3 = 2 (the result takes the sign of the divisor). Exponent is right-associative: 2 ** 3 ** 2 = 512.`,
  `Slicing s[start:stop:step] excludes stop. For s = “abcdef”: s[1:5:2] = “bd”, s[::-1] = “fedcba”; list(range(10))[-3:] = [7, 8, 9].`,
  `Comprehensions: [x*x for x in range(5) if x % 2 == 0] gives [0, 4, 16]. Dictionaries: d.get(key, default) avoids KeyError; sets drop duplicates.`,
  `Short-circuit: 0 or 5 returns 5; 3 and 0 returns 0 (the last evaluated operand, not True or False).`,
  `Default-argument trap: def f(x, L=[]) reuses one list across calls, so f(1) then f(2) returns [1, 2]. A tuple is immutable but can hold a mutable list: t = (1, [2, 3]); t[1].append(4) gives (1, [2, 3, 4]).`,
  `Recursion needs a base case and a smaller subproblem. def fact(n): return 1 if n <= 1 else n * fact(n − 1) gives fact(5) = 120. Python has a recursion depth limit.`,
  `Exceptions: try / except / finally; finally always runs. Scope: names assigned inside a function are local unless declared global.`],
 formulas:[[`Floor division`,`a // b = ⌊a / b⌋,  a % b = a − b · (a // b)`],[`Slice`,`s[start:stop:step]  (stop excluded)`],[`Identity vs equality`,`is compares objects; == compares values`]],
 fig:'pyref',cap:`Names are references. b shares a’s object; c is a separate copy.`},

{id:'found-asymptotics',grp:EXG4,ch:'Algorithm analysis',title:'Asymptotic analysis and recurrences',tag:`Count how work grows with input size.`,
 points:[`O gives an upper bound, Ω a lower bound, Θ a tight bound. Drop constants and lower-order terms: 3n² + 5n + 2 = Θ(n²).`,
  `Typical order: 1 < log n < √n < n < n log n < n² < n³ < 2ⁿ < n!.`,
  `Loop counting. A single loop to n is Θ(n). Nested loops where the inner runs i times give n(n − 1)/2 = Θ(n²). A loop that doubles i each time (i *= 2 while i < n) runs about log₂ n times.`,
  `Master theorem for T(n) = a T(n/b) + f(n): compare f(n) with n^(log_b a). If f is smaller by a polynomial factor, T = Θ(n^(log_b a)); if equal, T = Θ(n^(log_b a) · log n); if larger (with regularity), T = Θ(f(n)).`,
  `Examples: T(n) = 2T(n/2) + n gives Θ(n log n) (merge sort). T(n) = T(n/2) + 1 gives Θ(log n) (binary search). T(n) = 4T(n/2) + n gives Θ(n²). T(n) = T(n − 1) + n gives Θ(n²) (worst-case quicksort).`,
  `Best, average and worst case can differ. Space complexity counts extra memory, including the recursion stack.`],
 formulas:[[`Master theorem form`,`T(n) = a T(n/b) + f(n),  critical exponent log_b a`],[`Merge sort`,`T(n) = 2T(n/2) + n  ⇒  Θ(n log n)`],[`Binary search`,`T(n) = T(n/2) + 1  ⇒  Θ(log n)`],[`Arithmetic sum`,`1 + 2 + … + n = n(n + 1)/2`]],
 fig:'growth',cap:`Growth rates: exponential growth outruns every polynomial.`},

{id:'found-stacks-queues',grp:EXG4,ch:'Data structures',title:'Stacks and queues',tag:`Last-in-first-out versus first-in-first-out.`,
 points:[`Stack (LIFO): push and pop at the top, all O(1). Uses: function call stack, undo, balanced-parentheses checking, evaluating postfix expressions, DFS.`,
  `Queue (FIFO): enqueue at the rear, dequeue at the front, O(1). Uses: BFS, scheduling, buffering. A circular array queue reuses freed slots (full when (rear + 1) mod n = front).`,
  `Deque (double-ended queue) allows both ends; in Python use collections.deque, since list.pop(0) is O(n).`,
  `Postfix evaluation: scan tokens; push numbers; on an operator pop two values, apply, push the result. “5 3 + 8 2 − *” gives 8 and 6, then 48.`,
  `Balanced parentheses: push each opener, pop and match on each closer; balanced iff the stack is empty at the end.`,
  `A queue can be built from two stacks (move items from the input stack to the output stack when the output is empty); each operation is amortized O(1).`],
 formulas:[[`Stack and queue operations`,`push, pop, enqueue, dequeue:  O(1) each`],[`Circular queue full`,`(rear + 1) mod n = front`]],
 fig:'stackqueue',cap:`A stack works at one end; a queue works at both.`},

{id:'found-linked-lists',grp:EXG4,ch:'Data structures',title:'Linked lists',tag:`Nodes joined by pointers: cheap insertion, slow lookup.`,
 points:[`A singly linked list node holds data and a pointer to the next node; the list is reached through its head. Doubly linked nodes also keep a previous pointer.`,
  `Insert or delete at the head: O(1). Insert or delete after a node you already hold: O(1). Search or access the k-th item: O(n). Insert at the tail: O(n) without a tail pointer, O(1) with one.`,
  `Compared with arrays: no random access and extra pointer memory, but no shifting on insertion.`,
  `Reverse a singly linked list in O(n) time and O(1) space with three pointers (prev, curr, next): save next, point curr to prev, advance both.`,
  `Cycle detection (Floyd): move a slow pointer by one and a fast pointer by two; they meet iff there is a cycle. The middle node is where slow stands when fast reaches the end.`,
  `Deleting a given node in a singly linked list needs its predecessor, so it costs O(n) unless you already hold that pointer.`],
 formulas:[[`Costs`,`insert at head O(1);  search O(n);  reverse O(n) time, O(1) space`]],
 fig:'linkedlist',cap:`Reversing a list flips every pointer.`},

{id:'found-trees',grp:EXG4,ch:'Data structures',title:'Trees: binary trees, BSTs, traversals and heaps',tag:`Hierarchical data and the four ways to walk it.`,
 points:[`Terms: root, parent, child, leaf, subtree, depth (edges from root), height (longest path down). A binary tree has at most two children per node.`,
  `Counts: a binary tree of height h has at most 2^(h + 1) − 1 nodes. In a full binary tree (every node has 0 or 2 children), leaves = internal nodes + 1. A tree with n nodes has n − 1 edges. A complete tree with n nodes has height ⌊log₂ n⌋.`,
  `Traversals. Inorder: left, node, right. Preorder: node, left, right. Postorder: left, right, node. Level order: by depth, using a queue. For the BST built from 50, 30, 70, 20, 40, 60, 80 they give 20 30 40 50 60 70 80, 50 30 20 40 70 60 80, 20 40 30 60 80 70 50, and 50 30 70 20 40 60 80.`,
  `Binary search tree: left subtree < node < right subtree, so inorder is sorted. Search, insert and delete cost O(h): O(log n) if balanced, O(n) if skewed (for example, inserting sorted data).`,
  `Deleting from a BST: a leaf is removed; a node with one child is replaced by it; a node with two children is replaced by its inorder successor (or predecessor).`,
  `Binary heap: a complete tree stored in an array. For index i (0-based) the parent is (i − 1)//2, and the children are 2i + 1 and 2i + 2. Min-heap: parent ≤ children. Insert and delete-min are O(log n); building a heap is O(n); heapsort is O(n log n).`],
 formulas:[[`Max nodes at height h`,`2^(h + 1) − 1`],[`Full binary tree`,`leaves = internal nodes + 1`],[`Heap indexes (0-based)`,`parent (i − 1)//2,  children 2i + 1, 2i + 2`]],
 fig:'bst',cap:`A BST and its four traversal orders.`},

{id:'found-hash-tables',grp:EXG4,ch:'Data structures',title:'Hash tables',tag:`Jump straight to the slot: average O(1), if collisions are handled.`,
 points:[`A hash function maps a key to a slot index in a table of m slots, for example h(k) = k mod m. A good function spreads keys uniformly. Python’s dict and set are hash tables.`,
  `Collision: two keys map to one slot. Chaining stores colliding keys in a list at that slot. Open addressing probes for another slot: linear (h + i), quadratic (h + i²), or double hashing (h₁ + i·h₂).`,
  `Load factor α = n/m. With chaining, expected search time is O(1 + α). Open addressing needs α < 1 and gets slow as α approaches 1.`,
  `Worked example: m = 7, h(k) = k mod 7, linear probing, insert 10, 17, 24, 3. Every key hashes to slot 3. They land in slots 3, 4, 5, 6 respectively. Clustering is why long runs slow later insertions.`,
  `Deletion in open addressing needs a tombstone marker so later searches don’t stop early.`,
  `Worst case is O(n) when all keys collide. Hash tables don’t keep keys in sorted order.`],
 formulas:[[`Load factor`,`α = n / m`],[`Linear probing`,`slot = (h(k) + i) mod m,  i = 0, 1, 2, …`],[`Chaining search`,`expected O(1 + α)`]],
 fig:'hashprobe',cap:`Linear probing places colliding keys in the next free slots.`},

{id:'found-searching',grp:EXG4,ch:'Searching',title:'Linear search and binary search',tag:`Scan everything, or halve the problem each step.`,
 points:[`Linear search checks items one by one: O(n) comparisons in the worst case, works on any list.`,
  `Binary search needs a sorted array. Compare with the middle, discard half: T(n) = T(n/2) + 1 = Θ(log n). The worst case takes ⌊log₂ n⌋ + 1 comparisons (1024 elements: 11).`,
  `Trace: searching 23 in [2, 5, 8, 12, 16, 23, 38, 56, 72, 91]: mid = 4 (16, too small), mid = 7 (56, too large), mid = 5 (23, found) after 3 steps.`,
  `Use mid = lo + (hi − lo)//2 to avoid integer overflow in other languages. Python’s bisect module does binary search on sorted lists.`,
  `Sorting first costs O(n log n), so for a single lookup in unsorted data linear search is cheaper; for many lookups, sort once (or hash).`],
 formulas:[[`Binary search recurrence`,`T(n) = T(n/2) + 1  ⇒  Θ(log n)`],[`Worst-case comparisons`,`⌊log₂ n⌋ + 1`],[`Midpoint`,`mid = lo + (hi − lo) // 2`]],
 fig:'binsearch',cap:`Each step discards half of the remaining range.`},

{id:'found-basic-sorts',grp:EXG4,ch:'Sorting',title:'Selection, bubble and insertion sort',tag:`Three simple O(n²) sorts and what separates them.`,
 points:[`Selection sort: repeatedly select the minimum of the unsorted part and swap it to the front. Always n(n − 1)/2 comparisons (n = 10: 45), at most n − 1 swaps. Not stable (in the usual swap form), not adaptive.`,
  `Bubble sort: compare adjacent pairs and swap if out of order; each pass moves the largest to the end. Worst case n(n − 1)/2 comparisons. With an early-exit flag the best case (already sorted) is O(n). Stable.`,
  `Pass 1 on [5, 1, 4, 2, 8]: (5,1) swap, (5,4) swap, (5,2) swap, (5,8) no swap, giving [1, 4, 2, 5, 8].`,
  `Insertion sort: insert each element into the sorted prefix by shifting larger items right. Best case O(n) (sorted input), worst case O(n²). Stable, adaptive, and fast on nearly sorted data.`,
  `The number of swaps (or shifts) in bubble and insertion sort equals the number of inversions, pairs i < j with a[i] > a[j]. [3, 1, 2] has 2 inversions. A reversed array has n(n − 1)/2.`,
  `All three sort in place with O(1) extra space.`],
 formulas:[[`Comparisons (selection)`,`n(n − 1)/2`],[`Inversions`,`pairs (i, j), i < j, with a[i] > a[j]`],[`Reversed array inversions`,`n(n − 1)/2`]],
 fig:'bubble',cap:`First pass of bubble sort, comparison by comparison.`},

{id:'found-divide-conquer',grp:EXG4,ch:'Sorting',title:'Divide and conquer: merge sort and quicksort',tag:`Split, solve, combine: the route to O(n log n).`,
 points:[`Merge sort: split into halves, sort each recursively, merge in O(n). T(n) = 2T(n/2) + n = Θ(n log n) in best, average and worst cases. Stable. Needs O(n) extra space.`,
  `Quicksort: choose a pivot, partition so smaller items go left and larger go right, then recurse on both sides. Average Θ(n log n); worst case Θ(n²), for example when the pivot is always the smallest or largest (sorted input with first- or last-element pivot), giving T(n) = T(n − 1) + n. In place (O(log n) stack on average), not stable.`,
  `Lomuto partition (pivot = last element) on [8, 3, 1, 7, 0, 10, 2]: items ≤ 2 move left, the result is [1, 0, 2, 7, 3, 10, 8] with the pivot at index 2.`,
  `Random pivots or median-of-three make the worst case unlikely. Merge sort is preferred when stability or guaranteed O(n log n) matters; quicksort is often faster in practice thanks to cache behavior.`,
  `Any comparison-based sort needs Ω(n log n) comparisons in the worst case.`],
 formulas:[[`Merge sort`,`T(n) = 2T(n/2) + n = Θ(n log n)`],[`Quicksort worst case`,`T(n) = T(n − 1) + n = Θ(n²)`],[`Quicksort average`,`Θ(n log n)`]],
 fig:'mergetree',cap:`Merge sort splits down to single items, then merges back up.`},

{id:'found-graph-basics',grp:EXG4,ch:'Graphs',title:'Graph theory basics and representations',tag:`Vertices, edges, and how to store them.`,
 points:[`A graph G = (V, E). Undirected edges are unordered pairs; directed edges are ordered. Degree is the number of incident edges (in-degree and out-degree for directed graphs).`,
  `Handshake lemma: the sum of degrees in an undirected graph is 2|E|, so the number of odd-degree vertices is even. A simple graph on n vertices has at most n(n − 1)/2 edges (n = 6: 15).`,
  `Path, cycle, connected graph, connected components. A tree is a connected acyclic graph with n − 1 edges. A DAG is a directed acyclic graph. A bipartite graph has no odd cycles.`,
  `Adjacency matrix: V × V table; O(V²) space; edge lookup O(1). Adjacency list: O(V + E) space; iterating neighbors is proportional to degree. Use lists for sparse graphs.`,
  `Weighted graphs attach a number (cost, distance) to each edge.`],
 formulas:[[`Handshake lemma`,`Σ deg(v) = 2 |E|`],[`Max edges (simple, undirected)`,`n(n − 1)/2`],[`Tree edges`,`|E| = |V| − 1`]],
 fig:'graphbasics',cap:`The same 5-vertex graph as a drawing, a matrix and an adjacency list.`},

{id:'found-graph-traversal',grp:EXG4,ch:'Graphs',title:'Graph traversals: BFS and DFS',tag:`Visit every reachable vertex, level by level or branch by branch.`,
 points:[`BFS uses a queue: visit a vertex, enqueue unvisited neighbors. It explores level by level and finds shortest paths (fewest edges) in unweighted graphs. Time O(V + E) with adjacency lists.`,
  `DFS uses a stack or recursion: go as deep as possible, then backtrack. Time O(V + E). It yields discovery and finish times and classifies edges (tree, back, forward, cross).`,
  `Example graph: A–B, A–C, B–D, B–E, C–F, E–F, neighbors in alphabetical order. BFS from A visits A B C D E F. DFS from A visits A B D E F C.`,
  `DFS uses: detect cycles (a back edge in a directed graph means a cycle), topological sort of a DAG (reverse finishing order), connected components. BFS uses: shortest hop count, level structure, bipartiteness test.`,
  `Mark vertices visited when first seen, or the same vertex enters the queue repeatedly.`,
  `Different neighbor orders give different (but valid) orders, so always state the order you use.`],
 formulas:[[`BFS and DFS time`,`O(V + E)  (adjacency list)`],[`BFS on a connected graph`,`dist(v) = number of edges on a shortest path from the source`]],
 fig:'bfsdfs',cap:`BFS and DFS visit orders on the same graph (gold numbers).`},

{id:'found-shortest-paths',grp:EXG4,ch:'Graphs',title:'Shortest path algorithms: Dijkstra, Bellman–Ford, Floyd–Warshall',tag:`Choose the algorithm by edge weights and by what you need.`,
 points:[`Dijkstra (single source, non-negative weights): repeatedly take the unvisited vertex with the smallest tentative distance, relax its edges. With a binary heap: O((V + E) log V). It is greedy and fails with negative edges.`,
  `Worked example, edges A–B 4, A–C 2, C–B 1, B–D 5, C–D 8, D–E 3, C–E 10 from A: distances A 0, C 2, B 3 (via C), D 8 (via B), E 11 (via D; the direct C–E route costs 12). Path A, C, B, D, E.`,
  `Bellman–Ford (single source, negative edges allowed): relax all edges V − 1 times, O(VE). A further improving round signals a negative cycle reachable from the source.`,
  `Floyd–Warshall (all pairs): dynamic programming over intermediate vertices, O(V³) time, handles negative edges but not negative cycles.`,
  `Relaxation: if d[u] + w(u, v) < d[v], update d[v].`,
  `Unweighted graph: plain BFS is enough, O(V + E).`],
 formulas:[[`Relaxation`,`if d[u] + w(u, v) < d[v]:  d[v] = d[u] + w(u, v)`],[`Dijkstra (binary heap)`,`O((V + E) log V)`],[`Bellman–Ford`,`O(V E)`],[`Floyd–Warshall`,`O(V³)`]],
 fig:'dijkstra',cap:`Dijkstra from A. Teal edges are the shortest-path tree.`}
];

const EXG5='Foundations 5: Databases and warehousing';
const EX3=[
{id:'found-er',grp:EXG5,ch:'Data modelling',title:'The entity–relationship (ER) model',tag:`Sketch the data before you build the tables.`,
 points:[`Entity: a thing you store data about (Student). Entity set: all of them. Attribute: a property (name). Key attribute: identifies an entity uniquely (sid).`,
  `Attribute kinds: simple vs composite (address = street + city), single vs multivalued (phone numbers), stored vs derived (age from date of birth).`,
  `Relationship: an association between entities (Student Enrolls in Course). It can carry its own attributes (grade).`,
  `Cardinality: one-to-one, one-to-many, many-to-many. Participation: total (every entity must take part, double line) or partial.`,
  `Weak entity: has no key of its own and depends on an owner entity (Dependent of Employee), identified by owner key + partial key.`,
  `Mapping to tables: each strong entity becomes a table; 1:N puts a foreign key on the N side; M:N becomes its own table with both keys (Enrolls(sid, cid, grade)); multivalued attributes get their own table.`],
 formulas:[],fig:'erdiagram',cap:`Student and Course in an M:N relationship with a relationship attribute.`},

{id:'found-relational',grp:EXG5,ch:'Relational model',title:'Relational model, keys and integrity constraints',tag:`Tables, keys, and the rules that keep data valid.`,
 points:[`A relation is a table: attributes are columns, tuples are rows. Order of rows and columns doesn’t matter; no duplicate rows in theory.`,
  `Super key: any set of attributes that identifies a row. Candidate key: a minimal super key. Primary key: the candidate key you choose. Alternate keys: the others. Foreign key: attributes that reference another table’s primary key.`,
  `Entity integrity: primary key values are unique and never NULL.`,
  `Referential integrity: every foreign key value matches an existing primary key value, or is NULL. Deleting a referenced row needs a rule: reject, cascade, or set NULL.`,
  `Domain constraints: values must fit the column type and checks (salary > 0).`,
  `NULL means unknown or not applicable. Comparisons with NULL give UNKNOWN, so use IS NULL, not = NULL.`],
 formulas:[[`Candidate key`,`minimal set K with K → all attributes`]],fig:'pkfk',cap:`A foreign key in Employee referencing Department’s primary key.`},

{id:'found-relalg',grp:EXG5,ch:'Query languages',title:'Relational algebra',tag:`The operations every SQL query is built from.`,
 points:[`Selection σ_condition(R): keep rows. Projection π_columns(R): keep columns (and drop duplicate rows). Rename ρ.`,
  `Set operations need union-compatible relations: union ∪, difference −, intersection ∩.`,
  `Cartesian product R × S: every pair of rows (|R| · |S| rows). Join R ⋈_condition S = σ_condition(R × S). Natural join matches same-named columns and keeps one copy.`,
  `Division R ÷ S answers “for all” questions: students enrolled in every course. Example: with courses C1 and C2, S1 and S3 took both, so the answer is {S1, S3}.`,
  `Composition: π name (σ dept = 'CS' (Student)) is SELECT name FROM Student WHERE dept = 'CS'.`,
  `Outer joins (left, right, full) keep unmatched rows and pad with NULL.`],
 formulas:[[`Join`,`R ⋈_θ S = σ_θ (R × S)`],[`Product size`,`|R × S| = |R| · |S|`],[`Intersection`,`R ∩ S = R − (R − S)`]],
 fig:'relalg',cap:`Selection keeps rows; projection keeps columns.`},

{id:'found-trc',grp:EXG5,ch:'Query languages',title:'Tuple relational calculus',tag:`Describe what you want, not how to get it.`,
 points:[`Tuple relational calculus (TRC) writes queries as { t | P(t) }: the set of tuples t for which the formula P is true.`,
  `Formulas use membership (t ∈ Student), comparisons (t.dept = 'CS'), logic (∧, ∨, ¬) and quantifiers (∃ there exists, ∀ for all).`,
  `Example: names of CS students: { t.name | t ∈ Student ∧ t.dept = 'CS' }.`,
  `Join with ∃: students enrolled in C1: { s.name | s ∈ Student ∧ ∃ e ∈ Enrolled (e.sid = s.sid ∧ e.cid = 'C1') }.`,
  `“For all” with ∀ (or ¬∃ ¬): students in every course: { s | s ∈ Student ∧ ∀ c ∈ Course ∃ e ∈ Enrolled (e.sid = s.sid ∧ e.cid = c.cid) }. SQL writes this with NOT EXISTS ... NOT EXISTS.`,
  `Safe expressions (results drawn only from database values) have exactly the power of relational algebra.`],
 formulas:[[`Form`,`{ t | P(t) }`],[`Quantifier identity`,`∀x P(x) ≡ ¬∃x ¬P(x)`]],
 fig:'trc',cap:`One query in three languages.`},

{id:'found-sql',grp:EXG5,ch:'SQL',title:'SQL: filtering, aggregation and NULLs',tag:`Read queries in the order the database runs them.`,
 points:[`Logical order: FROM and JOIN, then WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT. That is why WHERE can’t use a SELECT alias or an aggregate, while HAVING filters groups.`,
  `Aggregates: COUNT, SUM, AVG, MIN, MAX. COUNT(*) counts rows; COUNT(column) skips NULLs. In the sample employee table, COUNT(*) = 6, COUNT(manager_id) = 3, COUNT(dept) = 5.`,
  `GROUP BY puts NULLs together in one group (the employee with no department forms its own group).`,
  `Example: SELECT dept, COUNT(*), AVG(salary) FROM emp GROUP BY dept HAVING COUNT(*) >= 2 returns ENG (3, 96.7) and HR (2, 65).`,
  `DISTINCT removes duplicate rows. ORDER BY sorts (NULL position depends on the database). LIMIT or FETCH FIRST cuts the result.`,
  `Statements: DDL (CREATE, ALTER, DROP), DML (SELECT, INSERT, UPDATE, DELETE), DCL (GRANT, REVOKE), TCL (COMMIT, ROLLBACK).`],
 formulas:[[`Logical order`,`FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT`],[`Counting`,`COUNT(*) counts rows; COUNT(col) skips NULL`]],
 fig:'sqlorder',cap:`The logical order in which a query is evaluated.`},

{id:'found-sql-joins',grp:EXG5,ch:'SQL',title:'SQL joins, subqueries and window functions',tag:`Combine tables, nest queries, and rank within groups.`,
 points:[`INNER JOIN keeps matching rows only. LEFT JOIN keeps every left row and fills NULLs when there is no match (Vik, with no department, appears with NULL location). RIGHT JOIN mirrors it. FULL OUTER JOIN keeps both sides. CROSS JOIN is the Cartesian product.`,
  `Anti-join: rows with no match. Departments without employees: dept LEFT JOIN emp ... WHERE emp.id IS NULL returns OPS.`,
  `Self join: join a table to itself, for example employee to manager: Ravi → Asha, John → Asha, Sara → Meena.`,
  `Subqueries: in WHERE with IN, EXISTS, or comparisons. A correlated subquery refers to the outer row and runs per row. Example: employees earning above their department’s average: Asha and Meena.`,
  `Window functions compute over a partition without collapsing rows: RANK() OVER (PARTITION BY dept ORDER BY salary DESC) ranks Asha 1, Ravi 2, John 3 in ENG. ROW_NUMBER gives unique numbers; RANK leaves gaps after ties; DENSE_RANK doesn’t.`,
  `Set operators: UNION (removes duplicates), UNION ALL (keeps them), INTERSECT, EXCEPT.`],
 formulas:[[`Anti-join pattern`,`A LEFT JOIN B ON … WHERE B.key IS NULL`],[`Window`,`func() OVER (PARTITION BY … ORDER BY …)`]],
 fig:'joins',cap:`Which rows each join keeps (gold = matched rows).`},

{id:'found-normalization',grp:EXG5,ch:'Design',title:'Functional dependencies and normal forms',tag:`Remove redundancy without losing information.`,
 points:[`A functional dependency X → Y means rows that agree on X agree on Y. Attribute closure X⁺ is everything X determines; X is a key if X⁺ contains all attributes.`,
  `Armstrong’s axioms: reflexivity (Y ⊆ X ⇒ X → Y), augmentation (X → Y ⇒ XZ → YZ), transitivity (X → Y, Y → Z ⇒ X → Z).`,
  `1NF: atomic values. 2NF: no partial dependency of a non-key attribute on part of a candidate key. 3NF: for every X → A, X is a super key or A is a prime attribute (no transitive dependency). BCNF: for every non-trivial X → A, X is a super key.`,
  `Worked example: R(A, B, C, D, E), F = {A → B, B → C, CD → E}. A⁺ = ABC, AD⁺ = ABCDE, so AD is the only candidate key. A → B is a partial dependency, so R is not in 2NF.`,
  `3NF synthesis gives R1(A, B), R2(B, C), R3(C, D, E) and a key table R4(A, D): lossless and dependency preserving.`,
  `A decomposition into R1, R2 is lossless if R1 ∩ R2 → R1 or R1 ∩ R2 → R2. BCNF is always lossless but may lose dependencies; 3NF can always keep both.`],
 formulas:[[`Closure`,`X⁺ = all attributes derivable from X`],[`Lossless test (two parts)`,`R1 ∩ R2 → R1  or  R1 ∩ R2 → R2`],[`BCNF`,`every non-trivial X → A has X a super key`]],
 fig:'normalize',cap:`Decomposing R into 3NF tables, one per dependency plus a key table.`},

{id:'found-indexing',grp:EXG5,ch:'Storage',title:'File organization and indexing',tag:`Make lookups touch as few disk blocks as possible.`,
 points:[`File organizations: heap (unordered, fast insert, slow search), sorted (fast range scans and binary search, costly inserts), hashed (fast equality lookup, no range scans).`,
  `Primary (clustered) index: built on the field that orders the file; one per table. Secondary index: on another field; can be many. Dense index: an entry per record. Sparse index: an entry per block (needs a sorted file).`,
  `B+ tree: balanced, all data pointers in the leaves, leaves linked for range queries. Search, insert and delete cost O(log_f n) block reads, where f is the fanout.`,
  `Worked example: 4 KB blocks, 8-byte keys and 8-byte pointers give fanout 256 (16n − 8 ≤ 4096). 1,000,000 keys need ⌈log₂₅₆ 10⁶⌉ = 3 levels, so about 3 index reads + 1 data read per lookup.`,
  `Hash index: O(1) average for equality, useless for ranges. Composite indexes follow leftmost-prefix order.`,
  `Indexes speed reads but slow writes and use space; index the columns you filter and join on.`],
 formulas:[[`B+ tree height`,`≈ ⌈log_f (number of keys)⌉`],[`Fanout (n pointers, n − 1 keys)`,`n·p + (n − 1)·k ≤ block size`]],
 fig:'bplustree',cap:`A B+ tree: internal nodes route, linked leaves hold the data.`},

{id:'found-transactions',grp:EXG5,ch:'Transactions',title:'Transactions, ACID and concurrency control',tag:`Many users, one consistent database.`,
 points:[`A transaction is a unit of work. ACID: Atomicity (all or nothing), Consistency (constraints hold), Isolation (concurrent runs act as if serial), Durability (committed data survives crashes).`,
  `Anomalies without isolation: dirty read (reading uncommitted data), non-repeatable read (a row changes between reads), phantom (new rows appear in a repeated query), lost update.`,
  `Isolation levels: read uncommitted, read committed, repeatable read, serializable, each preventing more anomalies at more cost.`,
  `Conflict serializability: build a precedence graph with an edge Ti → Tj for each conflicting pair (same item, at least one write, Ti first). Acyclic means conflict-serializable.`,
  `Example: R1(A) W1(A) R2(A) W2(A) R2(B) W2(B) R1(B) W1(B) gives T1 → T2 (on A) and T2 → T1 (on B), a cycle, so it is not conflict-serializable.`,
  `Two-phase locking (growing then shrinking) guarantees conflict serializability but can deadlock. Recovery uses a write-ahead log: log first, then data, so you can undo or redo.`],
 formulas:[[`ACID`,`Atomicity, Consistency, Isolation, Durability`],[`Serializability test`,`precedence graph acyclic ⇒ conflict-serializable`]],
 fig:'precedence',cap:`A precedence graph with a cycle: the schedule is not conflict-serializable.`},

{id:'found-data-transform',grp:EXG5,ch:'Data preparation',title:'Data types and transformation: normalization, discretization, sampling, compression',tag:`Prepare data so analysis is fair, fast and smaller.`,
 points:[`Attribute types: nominal (labels), binary, ordinal (ordered labels), interval (no true zero, e.g. °C), ratio (true zero, e.g. income).`,
  `Normalization (scaling): min-max maps to [0, 1]; z-score centers and scales; decimal scaling divides by a power of 10. Example: income 73,600 with min 12,000 and max 98,000 becomes 0.716; with mean 54,000 and SD 16,000 its z-score is 1.225.`,
  `Discretization: binning into equal-width or equal-frequency bins, then smoothing by bin means, medians or boundaries; concept hierarchies (age → young, middle, senior).`,
  `Example: 4, 8, 9, 15 | 21, 21, 24, 25 | 26, 28, 29, 34 in equal-frequency bins; smoothing by means gives 9, 23 and 29.`,
  `Sampling: simple random (with or without replacement), stratified (sample within groups to keep proportions), cluster, systematic. Reservoir sampling keeps a uniform sample from a stream.`,
  `Compression and reduction: dimensionality reduction (PCA, feature selection), numerosity reduction (histograms, clustering, sampling, regression models), and lossless or lossy compression (wavelets).`],
 formulas:[[`Min-max`,`v′ = (v − min) / (max − min)`],[`z-score`,`v′ = (v − μ) / σ`],[`Decimal scaling`,`v′ = v / 10ʲ  (smallest j with max |v′| < 1)`]],
 fig:'binning',cap:`Equal-frequency binning with smoothing by bin means.`},

{id:'found-warehouse',grp:EXG5,ch:'Data warehousing',title:'Data warehouse modelling: star, snowflake and OLAP',tag:`Model data for analysis, not for transactions.`,
 points:[`OLTP systems run day-to-day transactions (many small writes, normalized). A data warehouse is subject-oriented, integrated, time-variant and non-volatile, built for analysis (OLAP).`,
  `Fact table: measures (units, revenue) plus foreign keys to dimensions, at a stated grain (one row per sale line). Dimension tables: descriptive context (time, product, store, customer).`,
  `Star schema: one fact table with denormalized dimensions (fewest joins). Snowflake schema: dimensions normalized into sub-tables (less redundancy, more joins). Fact constellation: several fact tables sharing dimensions.`,
  `OLAP operations: roll-up (aggregate up a hierarchy, day → month), drill-down (the reverse), slice (fix one dimension), dice (select a sub-cube), pivot (rotate axes).`,
  `ETL loads the warehouse: extract, transform (clean, conform), load. Many modern stacks load first and transform inside the warehouse (ELT).`,
  `Slowly changing dimensions track history, for example by adding a new row with validity dates (type 2).`],
 formulas:[],fig:'starschema',cap:`A star schema: a fact table surrounded by dimension tables.`},

{id:'found-concept-hierarchies',grp:EXG5,ch:'Data warehousing',title:'Concept hierarchies, measures and data cubes',tag:`Levels of detail, and how aggregates combine.`,
 points:[`A concept hierarchy maps low-level values to higher concepts: day → month → quarter → year; city → state → country. It drives roll-up and drill-down.`,
  `Schema hierarchies follow the schema (city → state); set-grouping hierarchies group values (age 0–17 → minor).`,
  `Distributive measures can be computed from partition results with the same function: count, sum, min, max.`,
  `Algebraic measures combine a bounded number of distributive ones: average = sum / count, standard deviation.`,
  `Holistic measures need all the data and can’t be built from fixed-size summaries: median, mode, rank.`,
  `Data cube: with n dimensions and no hierarchies there are 2ⁿ cuboids (3 dimensions: 8). With Lᵢ levels in dimension i (plus “all”), the count is Π(Lᵢ + 1); levels 4, 3 and 2 give 60 cuboids.`],
 formulas:[[`Cuboids (no hierarchies)`,`2ⁿ`],[`Cuboids (with hierarchies)`,`Π (Lᵢ + 1)`],[`Algebraic example`,`average = sum / count`]],
 fig:'cubelattice',cap:`The lattice of cuboids for three dimensions.`}

const EXTRA_ALL={"rag-overview": {"ex": ["A language model only knows what it saw in training. RAG (retrieval-augmented generation) fixes that at question time: search your own documents for the most relevant passages, paste them into the prompt, and ask the model to answer from them, with citations.", "It has two halves. Offline, you parse documents, cut them into chunks, turn each chunk into a vector and store it in an index. Online, you turn the question into a vector, find the nearest chunks, and send them with the question to the model.", "<b>Example:</b> “What is the late-payment fee for enterprise accounts?” The retriever finds the billing policy section, the model answers “2% per month after 30 days [policy §4.2]”. When the policy changes, you re-index the document; no retraining."], "q": [["When is RAG a better choice than fine-tuning?", "When facts change, must be cited, or are private: you update the index, not the model."], ["What are the two halves of a RAG system?", "Offline ingestion (parse, chunk, embed, index) and online query (embed question, retrieve, generate with context)."]]}, "rag-ingestion": {"ex": ["Ingestion is the factory that feeds your index. If it parses a PDF badly, drops a table or leaves half a document indexed, every later step suffers, and no prompt can fix it.", "Good pipelines run as background jobs, keep the original file and a version number, write a new version completely before switching readers to it, and remove old chunks when a document changes or is deleted.", "<b>Example:</b> a 40-page contract is re-uploaded with one changed clause. The job parses it into version 2, indexes all its chunks, then flips the pointer from v1 to v2 and deletes v1. Users never see a mix of old and new clauses."], "q": [["Why swap versions instead of updating chunks in place?", "So readers never see a half-indexed document; the switch is atomic and easy to roll back."], ["What is usually the biggest quality lever in ingestion?", "Parsing quality: keeping headings, tables and reading order intact."]]}, "rag-chunking": {"ex": ["You can’t send whole documents to the model, so you cut them into chunks and retrieve the best few. The chunk is the unit the model sees: too small and it lacks context, too large and it carries noise and wastes tokens.", "Fixed-size chunks with overlap are the simple baseline. Structure-aware chunking splits on headings and keeps tables whole. Parent-child chunking searches small precise pieces but hands the model their larger parent section.", "<b>Example:</b> a policy section of 1,200 tokens is split into four 300-token children for search. A question matches child 3, but the model receives the full section, so it sees the exception written in child 4."], "q": [["What goes wrong with very small chunks?", "They match precisely but lose surrounding context, like a rule without its exceptions."], ["What does parent-child chunking give you?", "Precise matching on small chunks plus full context from the parent section at answer time."]]}, "rag-embeddings": {"ex": ["An embedding model turns text into a list of numbers (a vector) so that texts with similar meaning land close together. Search then means: embed the question and find the nearest stored vectors.", "Comparing against millions of vectors one by one is too slow, so vector databases use approximate nearest-neighbour indexes such as HNSW. They return almost the same results as exact search, much faster.", "<b>Example:</b> “How do I reset my password?” and “forgot login credentials” share no words but get vectors with cosine similarity around 0.8, so the right help article is found."], "q": [["Why must documents and queries use the same embedding model and version?", "Vectors from different models live in different spaces; distances between them are meaningless."], ["What does an ANN index trade away for speed?", "A small amount of recall: it may occasionally miss a true nearest neighbour."]]}, "rag-hybrid": {"ex": ["Vector search understands meaning but is weak on exact strings: error codes, product IDs, names. Keyword search (BM25) is the opposite. Hybrid retrieval runs both and merges the results.", "Reciprocal Rank Fusion merges by rank, not raw score: each document gets 1/(60 + rank) from each list and the sums are compared. It needs no tuning because ranks are comparable even when scores aren’t.", "<b>Example:</b> a document ranked 1st by BM25 and 5th by vectors scores 1/61 + 1/65 ≈ 0.0318. One ranked 3rd in both scores 2/63 ≈ 0.0317. Both float to the top."], "q": [["Why can’t you just add BM25 and cosine scores?", "They are on different scales; you’d need normalisation and tuning. RRF avoids this by using ranks."], ["Give a query where BM25 beats vectors.", "An exact identifier like “BGW-4021” or an invoice number."]]}, "rag-rerank": {"ex": ["First-stage retrieval is fast but rough. A reranker reads the question and each candidate together and scores how well that passage answers it, which is much more accurate.", "The pattern is retrieve wide, rerank narrow: fetch 50 candidates cheaply, rerank them, keep the top 5. Reranker scores also work as a confidence signal: if even the best is low, say you don’t know.", "<b>Example:</b> for “refund window for annual plans”, the top vector hit is about monthly plans. The cross-encoder spots the mismatch and promotes the annual-plan paragraph from rank 9 to rank 1."], "q": [["Why not use a cross-encoder for the first stage?", "It must run once per document per query, which is far too slow for millions of documents."], ["How do you choose a reranker threshold?", "Calibrate on labelled examples: pick the score where precision is acceptable."]]}, "rag-query": {"ex": ["Users ask follow-ups like “and for March?” that make no sense on their own. Before searching, rewrite the message into a standalone question using the conversation history.", "Other tricks: generate a few rephrasings and merge results (multi-query), embed a hypothetical answer instea
