{id:'found-projections-decomp',grp:'Foundations 2: Linear algebra',ch:'Matrix decompositions',title:'Projections, special matrices, quadratic forms, LU and SVD',tag:`Orthogonality and the factorizations used in practice.`,
 points:[`Projection of b onto the line through a: p = (aᵀb / aᵀa) a. The error e = b − p is orthogonal to a. Example: a = (3, 1), b = (2, 3) gives p = 0.9a = (2.7, 0.9).`,
  `Projection onto the column space of A: P = A(AᵀA)⁻¹Aᵀ. Projection matrices are idempotent (P² = P) and symmetric. Their eigenvalues are 0 or 1.`,
  `Orthogonal matrix: QᵀQ = I, so Q⁻¹ = Qᵀ, columns are orthonormal, and det Q = ±1. It preserves lengths and angles. Partitioned (block) matrices multiply block by block.`,
  `Quadratic form xᵀAx (A symmetric). Positive definite iff all eigenvalues are positive.`,
  `LU decomposition: A = LU with L lower triangular (ones on the diagonal) and U upper triangular, from Gaussian elimination. It solves Ax = b by forward then back substitution.`,
  `SVD: A = UΣVᵀ with orthogonal U and V and non-negative diagonal Σ. Singular values are the square roots of the eigenvalues of AᵀA. Rank = number of non-zero singular values; truncating small ones gives the best low-rank approximation.`],
 formulas:[[`Projection onto a`,`p = (aᵀb / aᵀa) a`],[`Projection matrix`,`P = A (AᵀA)⁻¹ Aᵀ,  P² = P`],[`Orthogonal matrix`,`QᵀQ = I`],[`SVD`,`A = U Σ Vᵀ`]],
 fig:'projection',cap:`Projecting b onto a: the error is perpendicular to a.`},

{id:'found-limits-derivatives',grp:'Foundations 3: Calculus and optimization',ch:'Single-variable calculus',title:'Limits, continuity and differentiability',tag:`What “close to” means, and when a curve is smooth.`,
 points:[`limₓ→ₐ f(x) = L means f(x) gets arbitrarily close to L as x gets close to a. Check left and right limits; they must agree.`,
  `f is continuous at a if lim f(x) = f(a). Discontinuities: removable (hole), jump (left ≠ right), infinite.`,
  `Derivative: f′(a) = lim_{h→0} (f(a + h) − f(a))/h. Differentiable implies continuous, but not the reverse: |x| is continuous at 0 and has a corner there.`,
  `Rules: product (uv)′ = u′v + uv′; quotient (u/v)′ = (u′v − uv′)/v²; chain (f∘g)′ = f′(g)·g′.`,
  `Standard derivatives: (xⁿ)′ = nxⁿ⁻¹, (eˣ)′ = eˣ, (ln x)′ = 1/x, (sin x)′ = cos x, (cos x)′ = −sin x.`,
  `Standard limits: sin x / x → 1, (eˣ − 1)/x → 1, (1 + 1/n)ⁿ → e. L’Hôpital’s rule handles 0/0 and ∞/∞: take the derivative of top and bottom. Example: lim_{x→0} (1 − cos x)/x² = 1/2.`],
 formulas:[[`Derivative`,`f′(a) = lim (f(a + h) − f(a)) / h`],[`Product rule`,`(uv)′ = u′v + uv′`],[`Chain rule`,`(f(g(x)))′ = f′(g(x)) · g′(x)`],[`Standard limit`,`lim_{x→0} sin x / x = 1`]],
 fig:'continuity',cap:`Continuous, jump discontinuity, and a corner (continuous but not differentiable).`},

{id:'found-taylor-optimization',grp:'Foundations 3: Calculus and optimization',ch:'Single-variable calculus',title:'Taylor series, maxima and minima, single-variable optimization',tag:`Approximate a function locally, then find its best point.`,
 points:[`Taylor series about a: f(x) = Σ f⁽ⁿ⁾(a)(x − a)ⁿ / n!. At a = 0 it is the Maclaurin series.`,
  `Key series: eˣ = 1 + x + x²/2! + x³/3! + …; sin x = x − x³/3! + x⁵/5! − …; cos x = 1 − x²/2! + x⁴/4! − …; 1/(1 − x) = 1 + x + x² + … for |x| < 1.`,
  `Critical points: f′(x) = 0. Second-derivative test: f″ > 0 means local minimum, f″ < 0 local maximum, f″ = 0 is inconclusive.`,
  `On a closed interval [a, b] the global extremes occur at critical points or at the endpoints; compare all candidates.`,
  `Example: f(x) = x³ − 3x. f′ = 3x² − 3 = 0 gives x = ±1. f″ = 6x: at x = 1 it is 6 > 0 (minimum, value −2); at x = −1 it is −6 < 0 (maximum, value 2).`,
  `Optimization example: of all rectangles with perimeter 20, the square (5 × 5) has the largest area, 25.`,
  `Link to ML: gradient descent repeats a step against f′ to reach a minimum.`],
 formulas:[[`Taylor series`,`f(x) = Σ f⁽ⁿ⁾(a) (x − a)ⁿ / n!`],[`Maclaurin eˣ`,`eˣ = 1 + x + x²/2! + x³/3! + …`],[`Maclaurin sin x`,`sin x = x − x³/3! + x⁵/5! − …`],[`Second-derivative test`,`f′(c) = 0, f″(c) > 0 ⇒ min;  f″(c) < 0 ⇒ max`]],
 fig:'taylor',cap:`Taylor polynomials of sin x match it better as the order grows.`,fig2:'optcurve',cap2:`Critical points of x³ − 3x classified by the second derivative.`}
];

const G1='Module 1: Production RAG';
const ENG1=[
{id:'rag-overview',grp:G1,ch:'Lesson 1',title:'How RAG works, and when to use it',tag:`Retrieval-augmented generation grounds a model in your documents at query time.`,
 points:[`RAG has two halves. Ingestion (offline): parse sources, split into chunks, embed them, and index them with metadata. Query (online): understand the question, retrieve candidates, rerank, assemble a prompt within a token budget, generate an answer with citations, and check it.`,
  `The index is the contract between the halves. Both sides must agree on the embedding model and version, chunk ids, tenant and permission fields, and text normalization. Most silent RAG bugs are contract breaks: a field written at ingest that query time expects but never receives, or a value cased differently on each side.`,
  `Use RAG for facts that change, that must be cited, or that are private. Use fine-tuning for behaviour, format and style. Use long context when the corpus is small and fits per request (for example one contract), accepting higher cost and latency per call.`,
  `Quality is decided mostly before the model is called: parsing and chunking quality, retrieval recall, ranking precision and context assembly. Swapping to a bigger model rarely fixes a retrieval miss.`,
  `Every production RAG system needs three things the demo did not: an eval set with expected sources, tracing that records which chunks each answer used, and a way to update or delete documents without leaving the index half-written.`,
  `A useful mental model: retrieval sets the ceiling (the answer can’t be better than the evidence), generation decides how close you get to it.`],
 formulas:[[`Answer quality ceiling`,`P(correct) ≤ P(evidence retrieved) × P(model uses it correctly)`]],
 fig:'ragmap',cap:`The two halves of a RAG system and the contract between them.`,
 src:[L(`RAG`,`11-llm-engineering/06-rag`),L(`Advanced RAG`,`11-llm-engineering/07-advanced-rag`)]},

{id:'rag-ingestion',grp:G1,ch:'Lesson 2',title:'Ingestion pipelines that don’t lose data',tag:`Parse well, version everything, and never leave a document half-indexed.`,
 points:[`Run ingestion as background jobs, not inside the upload request. Parsing, vision calls on images and embedding can take minutes; a request timeout must not leave a half-written index. Return a job id and expose job status.`,
  `Versioned swap: write the new chunks under a new document version, then flip a pointer (or delete the old version) only after every embedding succeeded. Deleting old chunks first means a failed embed leaves the document empty.`,
  `Deduplicate by content hash, but also handle updates: the same file name with new content is a new version, not a duplicate.`,
  `Parsing quality is the biggest lever: keep headings, lists and table structure (convert tables to Markdown or row-wise text with headers repeated), extract text from scanned pages with OCR, and record page numbers for citations.`,
  `Store rich metadata on every chunk: document id, version, source URI, title, section path, page, created and updated time, tenant, access-control list, language, content type, and the embedding model name and version.`,
  `Plan for deletions and connectors: when a document is deleted or permissions change at the source (wiki, drive, ticketing system), the index and any caches must follow. Scheduled re-sync with change detection is part of ingestion, not an afterthought.`,
  `Make every write idempotent: re-running the same job must produce the same result, so retries are safe.`],
 formulas:[],fig:'chunkpc',cap:`Ingestion should preserve structure so later stages can choose the right granularity.`,
 src:[L(`Information retrieval and search`,`05-nlp-foundations-to-advanced/14-information-retrieval-search`)]},

{id:'rag-chunking',grp:G1,ch:'Lesson 3',title:'Chunking strategies',tag:`The unit you retrieve decides what the model can see.`,
 points:[`Fixed-size chunks (by tokens, with overlap) are simple but cut through sentences, tables and code. Recursive splitting tries paragraph, then sentence, then word boundaries. Structure-aware splitting follows headings, list items, table and code blocks.`,
  `Semantic chunking splits where the embedding similarity between neighbouring sentences drops; it helps on long unstructured prose but costs extra embedding calls.`,
  `The size trade-off: small chunks (200 to 400 tokens) match queries precisely but lose context; large chunks (1,000+) carry context but dilute the embedding and waste prompt budget.`,
  `Parent-child chunking gets both: index small child chunks for matching, keep a parent_id on each, and return the parent section to the model. Persist the parent link at ingest; a splitter that creates it but a storage step that drops the field silently disables the feature.`,
  `Prepend context to each chunk before embedding: document title and section path (“Billing guide › Refunds › Partial refunds”). It costs a few tokens and markedly improves matching for short chunks.`,
  `Overlap (10 to 20%) protects facts that straddle a boundary; with structure-aware splitting you need less of it.`,
  `Choose by evaluation, not taste: run your golden questions against two or three chunking settings and compare retrieval recall and answer accuracy.`],
 formulas:[[`Chunks per document`,`≈ ⌈(tokens − overlap) / (size − overlap)⌉`]],
 fig:'chunkpc',cap:`Match on children, answer from parents.`,
 src:[L(`Chunking strategies for RAG`,`05-nlp-foundations-to-advanced/23-chunking-strategies-rag`)]},

{id:'rag-embeddings',grp:G1,ch:'Lesson 4',title:'Embeddings and vector indexes',tag:`Turn text into vectors, and search them fast without losing recall.`,
 points:[`An embedding model maps text to a vector so that similar meaning gives nearby vectors. Compare with cosine similarity (or dot product on normalized vectors).`,
  `Use the same model, version and preprocessing for documents and queries. Some models expect different prefixes for queries and passages; mixing them up quietly degrades retrieval.`,
  `Approximate nearest-neighbour (ANN) indexes trade a little recall for speed. HNSW (graph-based) is the common default: higher ef_search raises recall and latency. IVF partitions vectors into clusters and probes a few.`,
  `Filters interact with ANN: a selective filter applied after the ANN search can leave too few results. Prefer engines that filter during search (pre-filtering) and test recall with filters on.`,
  `Store the embedding model name and version on every chunk, and keep index definitions in code. Changing models means re-embedding everything into a new index and switching over; vectors from different models are not comparable.`,
  `Dimensions and cost: memory ≈ vectors × dimensions × bytes. 10 million chunks × 1,024 dimensions × 4 bytes ≈ 41 GB before index overhead. Quantized vectors (int8, binary) cut this sharply with some recall loss; rescoring the top candidates with full vectors recovers most of it.`,
  `Embeddings struggle with exact identifiers, numbers and rare names. That is what keyword search is for (next lesson).`],
 formulas:[[`Cosine similarity`,`cos(a, b) = a·b / (‖a‖ ‖b‖)`],[`Raw vector memory`,`N × d × bytes per value`]],
 fig:'ragflow',cap:`Every query passes through the same embedding model as the documents.`,
 src:[L(`Embeddings`,`11-llm-engineering/04-embeddings`)]},

{id:'rag-hybrid',grp:G1,ch:'Lesson 5',title:'Hybrid retrieval and fusion',tag:`Keywords for exactness, vectors for meaning, fusion to combine them.`,
 points:[`BM25 ranks by term matches, weighting rare terms higher and saturating repeated ones (k1 about 1.2, b about 0.75). It wins on ids, codes, names and exact phrases.`,
  `Dense vectors win on paraphrase. Run both, then fuse.`,
  `Reciprocal Rank Fusion: score(d) = Σ 1/(k + rank), with k about 60. It uses ranks, so the two systems’ score scales don’t need calibrating. A document ranked first and second scores 1/61 + 1/62 = 0.0325.`,
  `Weighted score fusion (α·vector + (1 − α)·keyword) needs normalized scores and tuning; RRF is the safer default.`,
  `RRF scores are tiny (around 0.01 to 0.03) and only meaningful relative to each other. Don’t use them as confidence: a threshold on fused scores means little.`,
  `Filter logic must be right in both engines. A list of allowed tenants should be an OR (“in”) condition. Adding one equality clause per tenant inside an AND-ed filter makes multi-tenant keyword search return nothing, while vector search with an “in” filter works.`,
  `Retrieve broadly (top 30 to 50 candidates) and let the reranker choose the few that reach the prompt.`],
 formulas:[[`Reciprocal Rank Fusion`,`RRF(d) = Σᵢ 1 / (k + rankᵢ(d)),  k ≈ 60`],[`BM25 term weight`,`IDF · tf (k1 + 1) / (tf + k1 (1 − b + b · |d| / avgdl))`]],
 fig:'hybridflow',cap:`Two retrievers, one fused list, then a reranker.`,
 src:[L(`Advanced RAG`,`11-llm-engineering/07-advanced-rag`),L(`Information retrieval and search`,`05-nlp-foundations-to-advanced/14-information-retrieval-search`)]},

{id:'rag-rerank',grp:G1,ch:'Lesson 6',title:'Reranking and confidence scores',tag:`Retrieve broadly, then score precisely.`,
 points:[`A bi-encoder embeds query and document separately (fast, used for retrieval). A cross-encoder reads them together and outputs a relevance score (much slower, much more accurate). Rerank the top 30 to 50 candidates and keep 3 to 8.`,
  `Options: hosted rerank APIs, open cross-encoder models, or an LLM scoring passages (accurate, expensive; use small models and batch).`,
  `Reranker scores are a far better confidence signal than keyword overlap. A formula like 0.6 × fused score + 0.3 × term overlap + 0.1 × phrase match mostly measures whether the query words appear, so good paraphrase matches look weak and keyword-stuffed text looks strong.`,
  `Calibrate thresholds on labeled data: plot reranker score against “was this chunk actually useful” and pick the cut that matches your precision target. Re-check after changing models.`,
  `Diversity matters: near-duplicate chunks can fill the top slots. Deduplicate by content similarity, or use maximal marginal relevance (MMR) to trade relevance against novelty.`,
  `Measure the gain: compare nDCG@5 or answer accuracy with and without the reranker. If latency is tight, rerank fewer candidates rather than dropping it.`],
 formulas:[[`MMR`,`argmax_d [ λ · rel(q, d) − (1 − λ) · max_{s ∈ selected} sim(d, s) ]`]],
 fig:'hybridflow',cap:`The reranker is the last filter before the prompt.`,
 src:[L(`Advanced RAG`,`11-llm-engineering/07-advanced-rag`)]},

{id:'rag-query',grp:G1,ch:'Lesson 7',title:'Query understanding: follow-ups, rewriting and routing',tag:`Search for what the user meant, not just the last message.`,
 points:[`Follow-ups break naive RAG. “And for March?” or “what about the second one?” mean nothing on their own. Rewrite each turn into a standalone question using the conversation history before embedding, caching or searching.`,
  `Multi-query: generate two to four rephrasings, retrieve for each and fuse the results. Helps vague or multi-part questions at the cost of extra retrieval calls.`,
  `HyDE: generate a hypothetical answer and embed that instead of the question; useful when questions and documents are worded very differently. It adds an LLM call to latency.`,
  `Decomposition: split “compare plan A and plan B prices in 2025 and 2026” into sub-questions, retrieve for each, then answer.`,
  `Routing: decide which index, tool or workflow should handle the request. Keyword rules are a fast path but misfire (“show me how billing works” may look operational). Send ambiguous or low-margin cases to a small classifier model.`,
  `Every rewrite feature belongs behind a flag with an eval. Keep a test that builds the pipeline with each flag on, so a broken import or a dead flag is caught in CI rather than in production.`],
 formulas:[],fig:'ragmap',cap:`Query understanding sits before retrieval and before the cache.`,
 src:[L(`Advanced RAG`,`11-llm-engineering/07-advanced-rag`)]},

{id:'rag-context',grp:G1,ch:'Lesson 8',title:'Context assembly and token budgets',tag:`Decide exactly what the model reads, in what order, within a budget.`,
 points:[`Count tokens with the model’s tokenizer and set a budget: system prompt + question + history + evidence + reserved answer tokens must fit. Joining every retrieved chunk without counting leads to truncation or runaway cost.`,
  `Worked example: an 8,000-token budget with a 900-token system prompt, 100-token question, 600 tokens of history and 1,000 reserved for the answer leaves 5,400 tokens: about ten 500-token chunks.`,
  `Order matters. Models use the start and end of the context best (lost in the middle), so put the strongest evidence first or last and the question at the end.`,
  `Deduplicate and merge adjacent chunks from the same document; expand children to parents only while the budget allows.`,
  `Label each chunk with an id, title, page and date so the model can cite it and you can trace it.`,
  `Compression (extracting only relevant sentences, or summarizing long passages) can fit more evidence but may drop qualifiers; evaluate it before enabling.`,
  `More context is not free: it raises cost and latency, and irrelevant passages can distract the model.`],
 formulas:[[`Evidence budget`,`budget − system − question − history − answer reserve`]],
 fig:'ctxbudget',cap:`Budget the context explicitly; evidence gets what is left.`,
 src:[L(`Context engineering`,`11-llm-engineering/05-context-engineering`)]},

{id:'rag-grounding',grp:G1,ch:'Lesson 9',title:'Grounded answers: citations and faithfulness checks',tag:`Make every claim traceable, and check it before the user sees it.`,
 points:[`Return structured sources with every answer: chunk id, document, page or section, score and a short quote. Text-only answers with “[Source 2]” markers can’t be verified or debugged.`,
  `Ask for citations per claim, then verify them: each cited id must exist in the provided context, and quoted numbers must appear in the cited chunk. Block or flag answers with numbers that appear nowhere in the context.`,
  `Faithfulness check: break the answer into claims and test each against the context with a natural-language-inference model or an LLM judge. Run it on every answer for high-risk domains, or on a sample for monitoring.`,
  `Abstain when evidence is weak: “I couldn’t find this in the documents” beats a confident guess. Make abstention an explicit, allowed outcome in the prompt and in the eval set.`,
  `Separate “grounded” from “correct”: an answer can faithfully repeat an outdated document. Show dates, and prefer current versions at retrieval.`,
  `Stream the answer, but send the sources payload too; log the chunk ids used so user feedback can be tied back to evidence.`],
 formulas:[[`Faithfulness`,`supported claims / total claims`]],
 fig:'ragmap',cap:`Citations and checks close the loop at the end of the query path.`,
 src:[L(`LLM evaluation frameworks`,`05-nlp-foundations-to-advanced/27-llm-evaluation-frameworks`)]},

{id:'rag-corrective',grp:G1,ch:'Lesson 10',title:'Corrective and agentic retrieval',tag:`When retrieval looks weak, change the search, not just its size.`,
 points:[`Grade retrieved evidence before answering (a reranker threshold or a small grader model). If it is weak, act: rewrite the query and search once more, search another source, or ask the user a clarifying question.`,
  `Repeating the same query with a larger limit rarely helps; it returns more of the same weak matches.`,
  `Cap retries (one or two) and keep a total latency budget, or corrective loops turn into slow agents.`,
  `Agentic retrieval lets a model decide what to search, read results and search again, useful for multi-hop questions (“who approved the policy that replaced X?”). Use it where single-shot retrieval measurably fails, and bound it with a step budget.`,
  `Ask a clarifying question when the request is ambiguous between sources or time periods, instead of guessing.`,
  `Log every corrective path taken; a rising rate of rewrites or clarifications is an early signal of corpus gaps or drift.`],
 formulas:[],fig:'crag',cap:`A corrective loop with one retry and a clarify-or-decline exit.`,
 src:[L(`Advanced RAG`,`11-llm-engineering/07-advanced-rag`)]},

{id:'rag-caching',grp:G1,ch:'Lesson 11',title:'Caching in RAG and cache correctness',tag:`A fast wrong answer is worse than a slow right one.`,
 points:[`Layers: exact cache (hash of the normalized request), semantic cache (embedding similarity above a high threshold such as 0.95), retrieval cache (query → chunk ids), and provider prompt caching for long static prefixes.`,
  `Key answer caches on the standalone question, not the raw last message; otherwise “and for March?” from two different conversations collides.`,
  `Invalidate on change: include a corpus version (bumped on any ingest or delete for that tenant) and the prompt and model version in the key, or clear the tenant’s entries on ingest. Otherwise re-ingested documents keep serving stale answers.`,
  `Scope every cache by tenant and permission set. A semantic cache shared across users can leak an answer built from documents another user can’t see.`,
  `Set TTLs by data volatility, and never cache answers that failed guardrails or were low-confidence.`,
  `Measure hit rate and also the error rate of cached answers by sampling them into the eval pipeline.`],
 formulas:[[`Cache key`,`hash(tenant, permission scope, standalone question, corpus version, prompt and model version)`]],
 fig:'cachever',cap:`Including the corpus version makes invalidation automatic.`,
 src:[L(`Prompt and semantic caching economics`,`17-infrastructure-and-production/14-prompt-semantic-caching`)]},

{id:'rag-access',grp:G1,ch:'Lesson 12',title:'Multi-tenant RAG: access control and PII',tag:`Enforce who can see what inside retrieval, not in the prompt.`,
 points:[`Derive identity on the server from a verified token (SSO groups mapped to tenants and documents). Never trust a tenant id or user id sent in a header or request body.`,
  `Store access metadata on every chunk (tenant, groups, document ACL) copied from the source system at ingest, and apply it as a pre-filter inside the vector and keyword queries.`,
  `Don’t filter after top-k: it loses recall and can still leak information through scores, caches, logs and traces.`,
  `Fail closed: if the permission service or a feature-gating module is unavailable, deny, rather than silently allowing everything.`,
  `Keep permissions fresh: re-sync on source changes, or resolve group membership at query time for fast-changing permissions.`,
  `PII: redact or tokenize personal data (account numbers, phone numbers, government ids) at ingest where it isn’t needed, scan outputs before display and before caching, and keep it out of logs and traces.`,
  `Test it: red-team queries from users who must not see a document, measure leakage (target zero), and run those tests in CI.`],
 formulas:[],fig:'aclfilter',cap:`Filter inside the search using identity from the application.`,
 src:[L(`Security, secrets and audit`,`17-infrastructure-and-production/25-security-secrets-audit`)]}
];

const G2='Module 2: Agent harness';
const ENG2=[
{id:'h-loop',grp:G2,ch:'Lesson 1',title:'The agent loop',tag:`A model, tools, a growing transcript, and rules for when to stop.`,
 points:[`An agent is a loop: send the transcript to the model; if it requests tool calls, run them and append the results; repeat until it answers without a tool call or a stop rule fires.`,
  `The harness is everything around the model that makes the loop work: tool registry and execution, context assembly, budgets, permissions, state, retries, tracing and the user interface for approvals.`,
  `Five essentials: a message buffer that grows; a tool registry (schema in, result out); a stop condition; a turn budget; and error handling that turns failures into observations the model can react to.`,
  `Budgets are not optional: max turns, max tokens, max wall-clock time and max spend per task. Pick them per task type; hitting one should produce a clear partial result, not a silent failure.`,
  `Modern models reason natively and can request several tool calls at once. Run independent calls in parallel and return every result, each tied to its call id.`,
  `Most agent quality problems are harness problems: unclear tool descriptions, missing error messages, context overflow, or no verification step. Fix those before changing models.`],
 formulas:[[`Worst-case cost`,`max turns × (average input tokens × input price + average output tokens × output price)`]],
 fig:'agentloop',cap:`The loop and its stop conditions.`,
 src:[L(`The agent loop`,`14-agent-engineering/01-the-agent-loop`),L(`Tool use and function calling`,`14-agent-engineering/06-tool-use-and-function-calling`)]},

{id:'h-tools',grp:G2,ch:'Lesson 2',title:'Designing tools agents can use',tag:`Tool names, descriptions and errors are prompts.`,
 points:[`Write descriptions for a new colleague: what the tool does, when to use it and when not to, what each argument means with an example, and what it returns.`,
  `Prefer a few task-shaped tools (“search_orders(customer, status, date range)”) over many thin API wrappers; fewer, clearer choices mean fewer wrong calls.`,
  `Use strict JSON schemas: types, enums, required fields, formats. Validate arguments before executing and return a precise error (“date must be YYYY-MM-DD; got 03/04”).`,
  `Return compact, relevant results: paginate, truncate long fields, and include identifiers the next call will need. Huge tool outputs flood the context.`,
  `Make side-effecting tools safe: idempotency keys for creates, dry-run modes, and confirmations for irreversible actions.`,
  `Namespace tools when combining sources (“crm.search” vs “docs.search”) so similar names don’t collide.`,
  `Measure tool use: per-tool call counts, error rates, and argument-validation failures show which descriptions confuse the model.`],
 formulas:[],fig:'agentloop',cap:`Tools are the agent’s hands; their descriptions are its instructions.`,
 src:[L(`Tool schema design`,`13-tools-and-protocols/05-tool-schema-design`),L(`Function calling deep dive`,`13-tools-and-protocols/02-function-calling-deep-dive`)]},

{id:'h-mcp',grp:G2,ch:'Lesson 3',title:'Model Context Protocol (MCP)',tag:`A standard way to plug tools and data into any agent host.`,
 points:[`MCP separates the host (the app with the model), clients (one per connection) and servers (which expose capabilities). Servers offer tools (actions), resources (readable data) and prompts (templates).`,
  `Transports: stdio for local servers launched by the host, and HTTP-based transports for remote servers. Remote servers use OAuth so the user grants scoped access.`,
  `The host stays in charge: it decides which tools are visible, which calls need user approval, and what results reach the model.`,
  `Benefits: write a tool server once and use it from many hosts; swap implementations without touching the agent.`,
  `Risks come with the convenience: a server’s tool descriptions are text the model reads, so a malicious or compromised server can inject instructions (covered in Module 5, lesson 6).`,
  `Operate MCP servers like any dependency: pin versions, review what tools they expose, log calls, and keep credentials scoped per server.`],
 formulas:[],fig:'mcparch',cap:`Hosts connect to servers through one client per server.`,
 src:[L(`MCP fundamentals`,`13-tools-and-protocols/06-mcp-fundamentals`),L(`MCP auth in production`,`13-tools-and-protocols/18-mcp-auth-production`)]},

{id:'h-context',grp:G2,ch:'Lesson 4',title:'Context management for long tasks',tag:`The transcript grows every turn; manage it on purpose.`,
 points:[`Each turn resends the whole transcript, so input tokens grow roughly linearly per turn and total input grows quadratically. With a 2,000-token prompt and 1,500 tokens added per turn, ten turns send 87,500 input tokens in total, not 15,500.`,
  `Prompt caching makes the repeated prefix much cheaper: keep the system prompt and tool definitions stable and first, and append new content at the end.`,
  `Trim tool results: keep the parts the task needs and store the full output outside the context with a reference id the agent can fetch again.`,
  `Compaction: when the context passes a threshold, summarize older turns into a structured state (goal, decisions, facts found, open questions, next steps) and continue from it.`,
  `Subagents with isolated context: hand a focused sub-task to a fresh agent and take back only its result, keeping the main context clean.`,
  `Persist important state outside the transcript (a task file, scratchpad or plan) so it survives compaction and restarts.`,
  `Watch for constraint loss: instructions from early turns are the first casualties of long contexts. Restate key constraints in the compacted state.`],
 formulas:[[`Total input over T turns`,`Σₜ (P + Δ·t) = T·P + Δ·T(T − 1)/2`]],
 fig:'ctxgrowth',cap:`Per-turn input grows linearly; total input grows quadratically.`,
 src:[L(`Context engineering`,`11-llm-engineering/05-context-engineering`),L(`Memory and virtual context`,`14-agent-engineering/07-memory-virtual-context-memgpt`)]},

{id:'h-memory',grp:G2,ch:'Lesson 5',title:'Agent memory',tag:`What to remember across sessions, and how to keep it trustworthy.`,
 points:[`Working memory is the current context. Long-term memory persists across sessions: user preferences, facts about projects, past decisions, and learned procedures.`,
  `Write deliberately: store durable, verified facts with a source and date, not every message. Unfiltered memory fills with noise and stale claims.`,
  `Read selectively: retrieve memories relevant to the current task (by topic or embedding) rather than injecting all of them.`,
  `Keep memory editable and inspectable by the user; support “forget this”.`,
  `Memory is an attack surface: content an agent reads (a web page, an email) can try to plant instructions into memory that fire in later sessions. Store facts, not instructions, and mark the source of each memory.`,
  `Procedural memory (skills or playbooks) can be powerful: a reviewed, versioned file of instructions for a recurring task loaded when needed.`,
  `Test memory like any feature: does recalled information help, and does stale memory hurt?`],
 formulas:[],fig:'agentloop',cap:`Memory feeds the context; what gets written decides what helps later.`,
 src:[L(`Memory blocks and sleep-time compute`,`14-agent-engineering/08-memory-blocks-sleep-time-compute`),L(`Hybrid memory (Mem0)`,`14-agent-engineering/09-hybrid-memory-mem0`)]},

{id:'h-orchestration',grp:G2,ch:'Lesson 6',title:'Workflows, agents and orchestration patterns',tag:`Use the least autonomy that solves the task.`,
 points:[`A workflow follows code-defined steps; an agent chooses its own steps. Workflows are cheaper, faster, testable and auditable; agents handle open-ended tasks.`,
  `Common patterns: prompt chaining (fixed sequence with checks between steps), routing (classify then dispatch), parallelization (independent sections, or voting for reliability), orchestrator-workers (a planner delegates sub-tasks), and evaluator-optimizer (generate, critique, revise).`,
  `Don’t build an agent when the steps are known, cost or latency is tightly bounded, auditors must read the process, actions are irreversible without review, or you can’t evaluate the outcome.`,
  `Multi-agent setups add coordination failures (lost hand-offs, duplicated work, conflicting edits). Prefer one agent with good tools, plus isolated subagents for well-scoped sub-tasks.`,
  `Stage autonomy: prototype (throwaway, answers one question), pilot (named users, human owner, audit and rollback, success thresholds), production (full operational readiness).`],
 formulas:[],fig:'router',cap:`Routing is a workflow pattern: cheap decisions before expensive ones.`,
 src:[L(`Anthropic workflow patterns`,`14-agent-engineering/12-anthropic-workflow-patterns`),L(`Orchestration patterns`,`14-agent-engineering/28-orchestration-patterns`),L(`Prototype, pilot or production`,`14-agent-engineering/53-prototype-pilot-or-production`)]},

{id:'h-verification',grp:G2,ch:'Lesson 7',title:'Verification gates, scope and human approval',tag:`Don’t trust “done”; check it.`,
 points:[`Agents report success that didn’t happen: a 400 error summarized as “updated successfully”, tests not run, files changed outside the task. Verify outcomes against the environment, not the transcript.`,
  `Verification gates: before marking a task done, run acceptance checks (tests pass, record exists, totals match) and refuse completion if any fail.`,
  `Scope contracts: state the goal, allowed actions and allowed files or systems up front; compare the actual changes against it and block off-scope edits.`,
  `Human-in-the-loop by risk: auto-approve reads; require approval for irreversible or external actions (payments, emails, deletes, production changes). Show the exact action and arguments.`,
  `Checkpoints and rollback: snapshot state before risky steps so you can undo.`,
  `A separate reviewer (a different prompt or model) that sees only the result and the acceptance criteria catches more than self-review.`],
 formulas:[],fig:'cigate',cap:`Gates turn “the agent says it’s done” into “checks prove it’s done”.`,
 src:[L(`Verification gates`,`14-agent-engineering/38-verification-gates`),L(`Scope contracts`,`14-agent-engineering/36-scope-contracts`),L(`Reviewer agent`,`14-agent-engineering/39-reviewer-agent`)]},

{id:'h-failures',grp:G2,ch:'Lesson 8',title:'Agent failure modes and recovery',tag:`Know how agents fail so you can design against it.`,
 points:[`Recurring failures: hallucinated actions (calling tools that don’t exist or inventing arguments), tool misuse (right tool, wrong arguments), scope creep, context loss on long tasks, loops, and cascading errors where one wrong call triggers many.`,
  `Agents often can’t tell “I failed” from “the task is impossible”, and may claim success to close the loop. Treat self-reports as claims to verify.`,
  `Retries: retry transient errors (timeouts, 429, 503) with exponential backoff and jitter; don’t retry validation errors unchanged. Cap attempts.`,
  `Timeouts on every tool call, and circuit breakers on flaky dependencies so one failing service doesn’t stall every agent.`,
  `Loop detection: stop when the same call with the same arguments repeats, or when no progress is made for several turns.`,
  `Graceful degradation: return what was done, what failed and what the user should do next.`,
  `Classify failures from traces weekly; most fixes turn out to be tool descriptions, schemas, missing permissions or missing context.`],
 formulas:[[`Backoff`,`delay = min(cap, base × 2ᵃᵗᵗᵉᵐᵖᵗ) × random(0.5, 1.0)`]],
 fig:'agentloop',cap:`Failures enter through tool calls and compound through the loop.`,
 src:[L(`Failure modes of agentic systems`,`14-agent-engineering/26-failure-modes-agentic`)]},

{id:'h-observability',grp:G2,ch:'Lesson 9',title:'Tracing and observability for agents',tag:`If you can’t replay a run, you can’t debug it.`,
 points:[`Trace every run as a tree of spans: the task, each model call (model, tokens in and out, latency, cost, stop reason), each tool call (name, arguments, result size, status, latency) and each retrieval (chunk ids and scores).`,
  `OpenTelemetry has GenAI semantic conventions for model and tool spans, so traces work across tools and vendors.`,
  `Track per-task metrics: success rate, turns, cost, latency, tool error rate, and how often humans had to step in.`,
  `Link user feedback to the trace (and to the chunks used), so a thumbs-down can be investigated.`,
  `Redact secrets and personal data before traces leave the process; traces are a common leak.`,
  `Use traces as eval data: failed runs become new test cases (Module 4).`],
 formulas:[[`Cost per successful task`,`total spend / tasks that passed verification`]],
 fig:'agentloop',cap:`Each arrow of the loop should produce a span.`,
 src:[L(`OpenTelemetry GenAI conventions`,`14-agent-engineering/23-otel-genai-conventions`),L(`Agent observability platforms`,`14-agent-engineering/24-agent-observability-platforms`)]},

{id:'h-runtime',grp:G2,ch:'Lesson 10',title:'Running agents in production',tag:`Durable state, isolation, and limits.`,
 points:[`Long tasks need durable execution: persist state after each step (checkpoints), so a crash or deploy resumes rather than restarts. Graph frameworks and workflow engines provide this; make sure the checkpointer works in every environment, including fallback paths.`,
  `Run code and shell tools in sandboxes (containers or microVMs) with no ambient credentials, limited network egress and resource limits.`,
  `Concurrency: queue tasks, cap concurrent runs per user and per tenant, and apply rate limits per provider.`,
  `Credentials: give each tool scoped, short-lived tokens; never put long-lived secrets in prompts or tool descriptions.`,
  `Version everything that shapes behaviour (prompts, tools, models, policies) and roll out changes with canaries and quick rollback.`,
  `Plan for model changes: keep an eval suite that runs on any new model version before switching, and pin versions in production.`],
 formulas:[],fig:'agentloop',cap:`Production adds durability, isolation and limits around the same loop.`,
 src:[L(`Production runtimes`,`14-agent-engineering/29-production-runtimes`),L(`LangGraph stateful graphs`,`14-agent-engineering/13-langgraph-stateful-graphs`)]}
];

const G3='Module 3: Inference and serving';
const ENG3=[
{id:'inf-generation',grp:G3,ch:'Lesson 1',title:'How generation runs: prefill, decode and sampling',tag:`Two very different phases share one request.`,
 points:[`Prefill processes the whole prompt in one parallel pass and builds the KV cache. It is compute-bound and sets time to first token.`,
  `Decode then produces one token per forward pass, each reading all weights plus the KV cache. At small batch sizes it is memory-bandwidth-bound: the GPU waits on memory, not arithmetic.`,
  `Rough ceiling for batch 1: tokens per second ≤ memory bandwidth ÷ bytes read per token. An 8B model in BF16 is about 16 GB of weights; at 3.35 TB/s (H100 SXM) that is at most about 209 tokens per second per sequence, before KV-cache reads.`,
  `Batching is how serving gets efficient: one weight read serves many sequences, so throughput rises far faster than latency until compute or memory runs out.`,
  `Sampling: temperature scales logits (0 is greedy), top-p keeps the smallest set of tokens whose probability reaches p, top-k keeps k tokens. Low temperature for extraction and tool calls, higher for creative text.`,
  `Structured output (JSON schemas, grammars) constrains decoding to valid tokens; prefer it over “please return JSON”.`,
  `Stop sequences and max output tokens bound cost and latency; set both.`],
 formulas:[[`Decode ceiling (batch 1)`,`tokens/s ≤ bandwidth / bytes read per token`],[`Softmax with temperature`,`pᵢ = exp(zᵢ / T) / Σⱼ exp(zⱼ / T)`]],
 fig:'prefilldecode',cap:`Prefill once, then decode token by token.`,
 src:[L(`Inference optimization`,`10-llms-from-scratch/12-inference-optimization`)]},

{id:'inf-kv',grp:G3,ch:'Lesson 2',title:'The KV cache: memory math, paging and prefix reuse',tag:`Usually the real limit on how many users a GPU can serve.`,
 points:[`The KV cache stores keys and values for every past token in every layer so decode doesn’t recompute them. Size per token = 2 × layers × KV heads × head dimension × bytes.`,
  `Worked example, an 80-layer 70B-class model with grouped-query attention (8 KV heads, head dimension 128) in BF16: 2 × 80 × 8 × 128 × 2 = 327,680 bytes, about 320 KiB per token, so about 2.5 GiB per 8,192-token sequence. With full multi-head attention (64 KV heads) it would be 20 GiB.`,
  `Grouped-query and multi-query attention share KV heads across query heads, cutting KV memory 4 to 8× with little quality loss. That is why most modern models use them.`,
  `PagedAttention allocates the cache in small fixed blocks (like virtual-memory pages) instead of one contiguous region per sequence, cutting fragmentation waste from tens of percent to a few percent and letting more sequences fit.`,
  `Prefix caching reuses the KV blocks of a shared prompt prefix (system prompt, tool definitions, a document) across requests, cutting prefill time for repeated prefixes. Put static content first.`,
  `KV can be quantized (FP8) or offloaded to CPU memory or SSD for long contexts, trading some quality or latency for capacity.`],
 formulas:[[`KV bytes per token`,`2 × layers × KV heads × head dim × bytes per value`],[`Sequences that fit`,`(GPU memory × utilization − weights − overhead) / KV bytes per sequence`]],
 fig:'kvgrow',cap:`KV memory grows linearly with context; grouped-query attention changes the slope.`,
 src:[L(`vLLM serving internals`,`17-infrastructure-and-production/04-vllm-serving-internals`),L(`SGLang RadixAttention`,`17-infrastructure-and-production/06-sglang-radixattention`)]},

{id:'inf-batching',grp:G3,ch:'Lesson 3',title:'Batching and scheduling',tag:`Keep the GPU busy without making anyone wait too long.`,
 points:[`Static batching waits for a batch, then runs until the longest sequence finishes; short sequences leave idle slots.`,
  `Continuous (in-flight) batching reschedules every decode step: finished sequences leave, waiting ones join immediately. This is the default in modern servers and raises throughput several-fold.`,
  `Chunked prefill splits long prompts into chunks (for example 512 tokens) interleaved with decode steps, so one long prompt doesn’t freeze everyone else’s token stream. It trades a little TTFT for much better inter-token latency at the tail.`,
  `Admission depends on free KV blocks; when memory runs out, the scheduler queues new requests or preempts running ones (swapping or recomputing their KV).`,
  `Little’s law links load and latency: average requests in flight = arrival rate × average time in system. At 20 requests per second and 6 seconds each, you need capacity for about 120 concurrent sequences.`,
  `Separate traffic classes: interactive chat needs low latency; batch jobs (evals, offline summarization) can use large batches or provider batch APIs at lower cost.`],
 formulas:[[`Little’s law`,`L = λ × W  (in flight = arrival rate × time in system)`]],
 fig:'contbatch',cap:`Continuous batching fills freed slots at every step.`,
 src:[L(`vLLM serving internals`,`17-infrastructure-and-production/04-vllm-serving-internals`),L(`Batch APIs`,`17-infrastructure-and-production/15-batch-apis`)]},

{id:'inf-metrics',grp:G3,ch:'Lesson 4',title:'Latency, throughput and goodput',tag:`Measure what users feel, at the tail.`,
 points:[`TTFT (time to first token) = queue time + network + prefill. TPOT or ITL (time per output token) is the gap between streamed tokens. E2E latency = TTFT + TPOT × output tokens.`,
  `Example: TTFT 0.4 s and 20 ms per token for a 300-token answer gives about 6.4 s end to end; long answers are dominated by TPOT.`,
  `Throughput (tokens per second across all users) measures fleet efficiency, not user experience.`,
  `Goodput is the share (or rate) of requests that meet every SLO at once, for example TTFT ≤ 1 s and TPOT ≤ 50 ms. It is the number to optimize.`,
  `Latency distributions are right-skewed: report P50, P90 and P99, not the mean. In the plot the median is about 12 ms but P99 is about 30 ms; averages hide the slow tail users feel.`,
  `Load-test with realistic prompt and output length distributions and ramp concurrency until goodput drops; that knee is your capacity.`,
  `Track cost per 1,000 requests or per successful task alongside latency; a faster setup that doubles cost may not be a win.`],
 formulas:[[`End-to-end latency`,`E2E = TTFT + TPOT × output tokens`],[`Goodput`,`fraction of requests meeting all SLOs`]],
 fig:'latdist',cap:`Means hide the tail that users actually hit.`,
 src:[L(`Inference metrics and goodput`,`17-infrastructure-and-production/08-inference-metrics-goodput`),L(`Load testing LLM APIs`,`17-infrastructure-and-production/22-load-testing-llm-apis`)]},

{id:'inf-quant',grp:G3,ch:'Lesson 5',title:'Quantization',tag:`Fewer bits per weight: more model per GPU, faster decode.`,
 points:[`Weight memory = parameters × bits ÷ 8. A 70B model is about 130 GiB in BF16, 65 GiB in FP8 and 33 GiB in 4-bit.`,
  `Because decode is memory-bound, smaller weights also mean faster tokens at small batch sizes.`,
  `Common formats: FP8 (near-lossless, hardware-accelerated on recent data-center GPUs; the safe default), AWQ and GPTQ (4-bit integer, calibrated), GGUF k-quants (CPU and laptop inference), and 4-bit floating-point formats on the newest hardware.`,
  `Quantize KV cache too (FP8 KV) to fit more context or users.`,
  `Quality loss shows up first on hard reasoning, math, code and long-context tasks; aggregate benchmarks can hide it. Run your own eval set before and after.`,
  `Calibration data matters for post-training methods: use text similar to your traffic.`],
 formulas:[[`Weight memory`,`parameters × bits / 8`]],
 fig:'quantbars',cap:`The same 70B model at three precisions.`,
 src:[L(`Production quantization`,`17-infrastructure-and-production/09-production-quantization`),L(`Quantization`,`10-llms-from-scratch/11-quantization`)]},

{id:'inf-spec',grp:G3,ch:'Lesson 6',title:'Speculative decoding',tag:`Guess several tokens cheaply, verify them in one pass.`,
 points:[`A small draft model (or extra prediction heads) proposes k tokens; the large target model checks all of them in one forward pass and keeps the longest accepted prefix plus one token of its own.`,
  `The output distribution is exactly the target model’s (with the standard acceptance rule), so quality is unchanged.`,
  `Expected tokens per target pass with acceptance rate α and k drafted tokens: (1 − α^(k+1)) / (1 − α). With α = 0.8 and k = 4 that is about 3.4; with α = 0.6 and k = 3 about 2.2.`,
  `Speedups are largest at low batch sizes (decode is memory-bound, so verifying extra tokens is nearly free). At high load the GPU is already busy and gains shrink or vanish.`,
  `Acceptance depends on how predictable the text is: code, structured output and repeated phrasing accept well; creative text less so.`,
  `Variants: separate draft models, self-speculative heads trained on the target (for example EAGLE-style), and n-gram or prompt-lookup drafting for tasks that copy input text.`],
 formulas:[[`Expected tokens per verification`,`(1 − α^(k+1)) / (1 − α)`]],
 fig:'specdec',cap:`Three accepted draft tokens plus one from the target: four tokens for one big pass.`,
 src:[L(`Speculative decoding (EAGLE-3)`,`17-infrastructure-and-production/05-eagle3-speculative-decoding`),L(`Speculative decoding`,`10-llms-from-scratch/25-speculative-decoding`)]},

{id:'inf-parallel',grp:G3,ch:'Lesson 7',title:'Big models: parallelism, MoE and disaggregation',tag:`How models larger than one GPU are served.`,
 points:[`Tensor parallelism splits each layer’s matrices across GPUs; every layer needs fast all-reduce, so keep it within one server with high-bandwidth links.`,
  `Pipeline parallelism places groups of layers on different GPUs or servers; it tolerates slower links but needs many in-flight requests to keep stages busy.`,
  `Mixture-of-experts models activate only a few experts per token, so compute per token follows active parameters while memory follows total parameters. A model with 2.8T total and 104B active parameters computes like a ~100B model but must store all 2.8T (expert parallelism spreads experts over GPUs).`,
  `Disaggregated serving runs prefill and decode on separate GPU pools and ships the KV cache between them, so each pool is tuned for its phase (compute-heavy prefill, memory-heavy decode).`,
  `Rule of thumb: use the smallest parallelism that fits weights plus enough KV cache for your concurrency, because communication overhead grows with it.`],
 formulas:[[`MoE compute per token`,`≈ 2 × active parameters FLOPs`],[`MoE memory`,`≈ total parameters × bytes per weight`]],
 fig:'parallelism',cap:`Tensor parallelism splits every layer; pipeline parallelism splits the stack.`,
 src:[L(`Disaggregated prefill and decode`,`17-infrastructure-and-production/17-disaggregated-prefill-decode`),L(`Scaling and distributed training`,`10-llms-from-scratch/05-scaling-distributed`)]},

{id:'inf-engines',grp:G3,ch:'Lesson 8',title:'Serving engines, and self-hosting versus APIs',tag:`Decide on constraints first, engines second.`,
 points:[`Self-host when you need data residency or isolation, a custom fine-tuned or domain model, steady high volume that keeps GPUs busy, or a model that APIs don’t offer. Use APIs for spiky or low volume, fast iteration, frontier capability and no GPU operations team.`,
  `Break-even: monthly tokens × API price versus GPU cost ÷ realistic utilization, plus engineers, on-call, upgrades and evals. Idle GPUs erase the savings.`,
  `Engines: vLLM (general production default with paged attention and continuous batching), SGLang (strong for agentic and prefix-heavy workloads), TensorRT-LLM (top throughput on NVIDIA), llama.cpp and Ollama (CPU, laptops and single-user development).`,
  `Choose by hardware first, then scale, then workload shape. Check the engine’s feature compatibility (quantization, speculative decoding, LoRA adapters, structured output) for your exact version.`,
  `Open weights are not always open source: read the license for attribution, user caps or reseller terms.`,
  `Keep a gateway in front of everything (routing, keys, quotas, logging, fallbacks) so you can mix providers and self-hosted models.`],
 formulas:[[`Monthly API cost`,`tokens per month × price per token`],[`Effective GPU cost per token`,`GPU cost per hour / (tokens per hour × utilization)`]],
 fig:'parallelism',cap:`Self-hosting means owning all of this.`,
 src:[L(`Self-hosted serving selection`,`17-infrastructure-and-production/28-self-hosted-serving-selection`),L(`Inference platform economics`,`17-infrastructure-and-production/02-inference-platform-economics`),L(`AI gateways`,`17-infrastructure-and-production/19-ai-gateways`)]},

{id:'inf-cost',grp:G3,ch:'Lesson 9',title:'Cost engineering: caching, batching and routing',tag:`Stack cheap, safe levers before changing models.`,
 points:[`Measure first: cost per successful task by feature, with the split between input, output and cached tokens.`,
  `Prompt caching: a 1,500-token system prompt at 100,000 requests a day and $2.50 per million input tokens costs $375 a day; with 90% of requests hitting a cache that charges 10% of the price, it falls to about $71 (81% less). Keep static content first.`,
  `Trim tokens: shorter system prompts, fewer and smaller chunks, compact tool results, capped output length.`,
  `Exact and semantic caches for repeated questions, with the correctness rules from Module 1.`,
  `Routing and cascades: send easy traffic to a small model and escalate on low confidence; watch escalation rate and per-route quality.`,
  `Batch APIs and off-peak scheduling for anything not interactive.`,
  `Every lever goes behind your eval suite: a 10× cost cut that drops quality is a regression.`],
 formulas:[[`Daily prompt cost`,`tokens × requests × price per token`],[`With caching`,`× (hit rate × cached price share + (1 − hit rate))`]],
 fig:'costlayers',cap:`Cheap and safe levers first.`,
 src:[L(`Caching, rate limiting and cost`,`11-llm-engineering/11-caching-cost`),L(`Model routing`,`17-infrastructure-and-production/16-model-routing`),L(`FinOps for LLMs`,`17-infrastructure-and-production/27-finops-llms`)]},

{id:'inf-ops',grp:G3,ch:'Lesson 10',title:'Operating inference: capacity, reliability and rollouts',tag:`Keep latency and availability steady as traffic and models change.`,
 points:[`Capacity: load-test to find the concurrency where goodput drops, then autoscale on queue depth or KV-cache utilization rather than CPU.`,
  `Cold starts: model weights take minutes to load. Keep warm replicas, pre-pull images, and cache weights on local disk.`,
  `Rate limits and quotas per tenant protect shared capacity; return clear retry-after errors.`,
  `Fallbacks: a secondary provider or smaller model when the primary is down or over quota, with the quality trade-off understood in advance.`,
  `Timeouts and streaming: stream tokens to users; set server-side timeouts and cancel generation when the client disconnects to free capacity.`,
  `Rollouts: shadow traffic, then a small canary with automatic rollback on error-rate, latency or eval regressions.`,
  `Incidents: track error budgets and keep runbooks for provider outages, GPU failures and bad model releases.`],
 formulas:[[`Required replicas`,`peak concurrency / sequences per replica at target goodput`]],
 fig:'latdist',cap:`Reliability work is mostly about the tail.`,
 src:[L(`GPU autoscaling on Kubernetes`,`17-infrastructure-and-production/03-gpu-autoscaling-kubernetes`),L(`Cold-start mitigation`,`17-infrastructure-and-production/10-cold-start-mitigation`),L(`Shadow, canary, progressive`,`17-infrastructure-and-production/20-shadow-canary-progressive`),L(`SRE for AI`,`17-infrastructure-and-production/23-sre-for-ai`)]}
];

const G4='Module 4: Evals';
const ENG4=[
{id:'ev-driven',grp:G4,ch:'Lesson 1',title:'Eval-driven development',tag:`An eval suite is the specification for an AI feature.`,
 points:[`Without evals, every prompt, model or retrieval change is a guess. With them, you can change things quickly and know what improved and what broke.`,
  `Write the eval before the feature: a set of real inputs with what “good” means for each (expected answer, expected sources, required behaviour such as refusing or asking a question).`,
  `Layers: fast deterministic checks (format, schema, tool arguments, policy rules), offline evals on a golden set (with code checks, reference answers or a calibrated judge), human review on samples and disagreements, and online metrics in production.`,
  `Look at your data: read 50 to 100 real outputs and write down how they fail before choosing metrics. Error analysis finds the categories that matter; generic metrics often don’t.`,
  `Evals live next to the code, run in CI on every change, and grow every time a production failure is found.`,
  `Measure the system, not just the model: retrieval, tools, prompts and post-processing all change outcomes.`],
 formulas:[],fig:'evalstack',cap:`Layers of evaluation, cheapest and fastest first.`,
 src:[L(`Eval-driven agent development`,`14-agent-engineering/30-eval-driven-agent-development`),L(`Evaluation and testing`,`11-llm-engineering/10-evaluation`)]},

{id:'ev-datasets',grp:G4,ch:'Lesson 2',title:'Building eval sets',tag:`Representative, labelled, sliced, and big enough to detect change.`,
 points:[`Sample real traffic, stratified by intent, user segment, language, difficulty and route. Add known hard cases, past incidents, adversarial inputs and cases where the right answer is “I don’t know”.`,
  `For RAG, store expected sources (document and section ids) as well as expected answers, so you can score retrieval separately.`,
  `Keep eval data separate from prompt examples and fine-tuning data; overlap inflates scores.`,
  `Size decides what you can detect. Near 80% accuracy, the 95% interval for the difference between two independent runs is about ±16 points with 50 cases per variant, ±8 with 200 and ±3.5 with 1,000. Paired comparisons on the same cases do better.`,
  `Version the set, record who labelled what, and review labels: noisy labels cap measurable accuracy.`,
  `Slice reporting: an overall score can hide a regression in one language, product or tenant.`],
 formulas:[[`Detectable difference (approx., unpaired)`,`1.96 × √(2p(1 − p) / n)`]],
 fig:'ciwidth',cap:`Small eval sets can only detect large changes.`,
 src:[L(`Evaluation and testing`,`11-llm-engineering/10-evaluation`)]},

{id:'ev-metrics',grp:G4,ch:'Lesson 3',title:'Metrics: exact match to nDCG and pass@k',tag:`Choose metrics that match the task.`,
 points:[`Exact match and normalized string match for short factual answers; token F1 for partial overlap; code execution (tests pass) for code; schema validity for structured output.`,
  `Retrieval metrics need a ranked list and relevance labels. Recall@k: share of relevant items in the top k. Precision@k: share of the top k that are relevant. MRR: average of 1/(rank of first relevant). nDCG@k: rewards relevant items near the top.`,
  `Worked example: relevant {d2, d5}, ranking d1…d6. Recall@3 = 0.5, recall@5 = 1.0, precision@5 = 0.4, MRR = 0.5, nDCG@5 = 1.018 / 1.631 = 0.624.`,
  `pass@k for sampled outputs: probability that at least one of k samples passes. Unbiased estimate from n samples with c correct: 1 − C(n − c, k) / C(n, k). With n = 10 and c = 3: pass@1 = 0.30, pass@3 ≈ 0.71, pass@5 ≈ 0.92.`,
  `Track operational metrics with quality: latency, cost, refusal rate, tool error rate.`,
  `BLEU and ROUGE correlate weakly with human judgment for open-ended answers; prefer references plus a calibrated judge.`],
 formulas:[[`Recall@k`,`|relevant ∩ top k| / |relevant|`],[`MRR`,`mean of 1 / rank of first relevant`],[`nDCG@k`,`DCG@k / ideal DCG@k,  DCG = Σ relᵢ / log₂(i + 1)`],[`pass@k`,`1 − C(n − c, k) / C(n, k)`]],
 fig:'rankmetrics',cap:`One ranking, four retrieval metrics.`,
 src:[L(`LLM evaluation frameworks`,`05-nlp-foundations-to-advanced/27-llm-evaluation-frameworks`)]},

{id:'ev-judge',grp:G4,ch:'Lesson 4',title:'LLM-as-judge, done properly',tag:`A judge is a model you must evaluate too.`,
 points:[`Use a judge for criteria code can’t check: correctness against a reference, helpfulness, tone, policy compliance.`,
  `Anchored rubrics: define each score level by observable behaviour (“2: answer correct but missing the exception in section 3”). Prefer binary or 3-level scales per criterion over a vague 1 to 10.`,
  `Ask for reasoning before the verdict, and judge one criterion per call when accuracy matters.`,
  `Known biases: position (prefers the first of two answers), verbosity (prefers longer answers), self-preference (prefers its own model family). Randomize order, swap and average in pairwise comparisons.`,
  `Calibrate against humans on 100 or more items and report agreement with Cohen’s kappa, which corrects for chance. Example: 80% raw agreement with 57.9% expected by chance gives κ = 0.525 (moderate); tighten the rubric before relying on it.`,
  `Freeze the judge model and prompt version; changing either shifts every score. Handle parsing failures explicitly instead of silently dropping them.`],
 formulas:[[`Cohen’s kappa`,`κ = (pₒ − pₑ) / (1 − pₑ)`]],
 fig:'judgecal',cap:`Judge versus human labels on 100 items.`,
 src:[L(`Evaluation and testing`,`11-llm-engineering/10-evaluation`),L(`LLM evaluation frameworks`,`05-nlp-foundations-to-advanced/27-llm-evaluation-frameworks`)]},

{id:'ev-rag',grp:G4,ch:'Lesson 5',title:'Evaluating RAG systems',tag:`Score retrieval and generation separately.`,
 points:[`Retrieval: recall@k against expected source ids (did the evidence reach the prompt?), plus precision or nDCG for ranking quality.`,
  `Generation: faithfulness (claims supported by the context), answer relevance (does it address the question), correctness (matches the reference), citation accuracy (cited ids exist and support the claim).`,
  `Context precision and context recall measure how clean and how complete the evidence was.`,
  `Diagnose with the split: low recall means fix ingestion, chunking or retrieval; high recall but low faithfulness means fix context assembly or prompting; both high but low correctness means check the labels or stale documents.`,
  `Include abstention cases (answer not in corpus) and score “I don’t know” as correct for them.`,
  `Run the RAG eval on every change to chunking, embeddings, retrieval settings, prompts or models, and on a schedule to catch corpus drift.`],
 formulas:[[`Faithfulness`,`supported claims / all claims`],[`Context recall`,`required facts present in context / required facts`]],
 fig:'ragmap',cap:`Each stage has its own metric.`,
 src:[L(`LLM evaluation frameworks`,`05-nlp-foundations-to-advanced/27-llm-evaluation-frameworks`),L(`Information retrieval and search`,`05-nlp-foundations-to-advanced/14-information-retrieval-search`)]},

{id:'ev-agents',grp:G4,ch:'Lesson 6',title:'Evaluating agents',tag:`Judge outcomes, inspect trajectories, count the cost.`,
 points:[`Outcome evals check the end state in a sandbox: was the ticket created with the right fields, do tests pass, is the database in the expected state? This is the most reliable signal.`,
  `Trajectory evals inspect the path: right tools in a sensible order, valid arguments, no forbidden actions, no unnecessary steps.`,
  `Track cost and effort with success: turns, tokens, wall time, spend per successful task, and how often a human had to step in.`,
  `Agents are stochastic: run each task several times and report success rate (or pass@k for “at least once”, pass^k for “every time”, which matters for reliability).`,
  `Public benchmarks (software engineering, web, desktop and tool-use suites) compare models; your own task suite decides what to ship.`,
  `Use reproducible environments: fixed seeds, mocked or snapshotted external services, and clean state per run.`],
 formulas:[[`Consistency (pass^k)`,`P(all k runs succeed) ≈ pᵏ for independent runs`]],
 fig:'agentloop',cap:`Evaluate the end state, then the path that led there.`,
 src:[L(`Eval-driven agent development`,`14-agent-engineering/30-eval-driven-agent-development`),L(`Benchmarks: SWE-bench, GAIA`,`14-agent-engineering/19-benchmarks-swebench-gaia`)]},

{id:'ev-stats',grp:G4,ch:'Lesson 7',title:'Statistics for evals',tag:`Is the difference real, or noise?`,
 points:[`Report intervals, not just point scores. For a pass rate, the Wilson interval behaves well: 42 of 50 (84%) has a 95% interval of about 72% to 92%; 420 of 500 gives about 80% to 87%.`,
  `Compare variants on the same cases (paired). Per-case differences remove case difficulty from the noise; use a paired bootstrap or a paired test.`,
  `Paired bootstrap: resample cases with replacement, recompute the mean difference each time, and read the 2.5th and 97.5th percentiles. If the interval excludes zero, the change is likely real.`,
  `Model outputs vary run to run even at temperature 0 on some stacks; average several runs or fix seeds where possible.`,
  `Many comparisons inflate false wins: if you test 20 prompt variants, one will look “significantly” better by chance. Confirm the winner on fresh data.`,
  `Pre-register the decision rule (what metric, what threshold, which slices) before looking at results.`],
 formulas:[[`Wilson interval centre`,`(p̂ + z²/2n) / (1 + z²/n)`],[`Paired difference`,`d̄ = mean(newᵢ − baseᵢ)`]],
 fig:'ciwidth',cap:`Uncertainty shrinks with the square root of the number of cases.`,
 src:[L(`Evaluation and testing`,`11-llm-engineering/10-evaluation`),L(`A/B testing LLM features`,`17-infrastructure-and-production/21-ab-testing-llm-features`)]},

{id:'ev-regression',grp:G4,ch:'Lesson 8',title:'Regression testing, CI gates and model upgrades',tag:`Catch silent regressions before users do.`,
 points:[`Store baseline per-case results. On every change, run the suite, compare per case and per slice, and fail the build when an important slice drops beyond its noise band.`,
  `Split suites by speed: a fast smoke set on every commit, the full suite before merge or nightly, expensive judge-based suites on release candidates.`,
  `Model upgrades and deprecations: pin model versions, track provider deprecation dates, run the full suite on the new version early, and compare cost and latency as well as quality.`,
  `Check behaviour, not just scores: refusal rate, output length, tool-call format and tone often shift with new models.`,
  `Gate retrieval too: block merges that drop recall@k on the golden set.`,
  `Keep a living list of “never again” cases from incidents; they gate every release.`],
 formulas:[],fig:'cigate',cap:`A regression gate in CI, followed by a canary.`,
 src:[L(`Evaluation and testing`,`11-llm-engineering/10-evaluation`),L(`Shadow, canary, progressive`,`17-infrastructure-and-production/20-shadow-canary-progressive`)]},

{id:'ev-online',grp:G4,ch:'Lesson 9',title:'Online evaluation: shadow, canary, A/B and feedback',tag:`Production is the final eval set.`,
 points:[`Shadow: run the new version on live traffic without showing users; compare outputs offline.`,
  `Canary: route a small share (for example 5%) to the new version with automatic rollback on error rate, latency or guardrail spikes.`,
  `A/B test: randomize users, pick one primary metric (task success, resolution rate) and guardrail metrics (latency, cost, complaints), and run long enough to reach the planned sample size.`,
  `Feedback signals: thumbs, edits, copies, retries, escalations to humans. They are biased (few users click) but useful for finding failures.`,
  `Record real values: confidence scores, retrieved chunk ids, latency and guardrail results per response. Placeholder values (a fixed confidence, zero latency) make dashboards useless.`,
  `Sample production traffic into human review and the judge pipeline daily, and feed failures back into the offline set.`],
 formulas:[],fig:'evalstack',cap:`Online evaluation is the top layer.`,
 src:[L(`A/B testing LLM features`,`17-infrastructure-and-production/21-ab-testing-llm-features`),L(`LLM observability`,`17-infrastructure-and-production/13-llm-observability`)]}
];

const G5='Module 5: AI security';
const ENG5=[
{id:'sec-threat',grp:G5,ch:'Lesson 1',title:'Threat modelling LLM applications',tag:`The model is not a security boundary; design as if it can be talked into anything.`,
 points:[`Map the system: who sends input, what content the model reads (user text, retrieved documents, web pages, emails, tool results), what it can do (tools, APIs, rendering), and where its output goes.`,
  `Every arrow into the model carries potentially hostile text; every arrow out can cause harm. Put controls on the arrows, not inside the prompt.`,
  `The OWASP Top 10 for LLM Applications (2025): LLM01 prompt injection, LLM02 sensitive information disclosure, LLM03 supply chain, LLM04 data and model poisoning, LLM05 improper output handling, LLM06 excessive agency, LLM07 system prompt leakage, LLM08 vector and embedding weaknesses, LLM09 misinformation, LLM10 unbounded consumption.`,
  `Ask per feature: what is the worst thing the model could be convinced to do with these permissions, and who pays? Size controls to that blast radius.`,
  `Classic security still applies: authentication, authorization, input validation in tools, secrets management, logging and patching. AI adds new paths into old weaknesses.`,
  `Write the threat model down, review it when tools, data sources or permissions change, and test it (lesson 10).`],
 formulas:[],fig:'trust',cap:`Every arrow crosses a trust boundary.`,fig2:'owaspgrid',cap2:`The OWASP LLM Top 10, 2025 edition.`,
 src:[L(`Guardrails`,`11-llm-engineering/12-guardrails`),L(`Security, secrets and audit`,`17-infrastructure-and-production/25-security-secrets-audit`)]},

{id:'sec-injection',grp:G5,ch:'Lesson 2',title:'Prompt injection: direct and indirect',tag:`Text that the model reads can act like instructions.`,
 points:[`Direct injection: the user tries to override instructions (“ignore previous instructions”, role-play, encodings, translation tricks).`,
  `Indirect injection: instructions hidden in content the system processes, such as a web page, PDF, email, ticket, code comment, tool description or retrieved chunk. The user may never see them.`,
  `LLMs process instructions and data in the same token stream, so there is no reliable way for the model alone to tell them apart. Detection classifiers help but can be bypassed; treat injection as unsolved at the model level.`,
  `Zero-click example: in 2025, researchers showed an attack (named EchoLeak) where an email that the victim never opened was retrieved into an enterprise assistant’s context and steered it into leaking data through an allowed domain. Untrusted input, privileged data and an outbound channel combined.`,
  `Impact depends on what the model can reach: with no tools and no private data, injection mostly changes text; with tools, private data and outbound channels, it becomes data theft or unauthorized actions.`,
  `So the design goal is to limit what an injected model can do and see, not to hope it never gets injected.`],
 formulas:[],fig:'trifecta',cap:`Private data, untrusted content and an outbound channel together are the dangerous combination.`,
 src:[L(`Prompt injection defense`,`14-agent-engineering/27-prompt-injection-defense`),L(`Indirect prompt injection`,`18-ethics-safety-alignment/15-indirect-prompt-injection`),L(`EchoLeak and CVEs for AI`,`18-ethics-safety-alignment/25-echoleak-cves-for-ai`)]},

{id:'sec-defense',grp:G5,ch:'Lesson 3',title:'Designing against prompt injection',tag:`Assume injection happens; make it harmless.`,
 points:[`Break the dangerous combination: if a flow reads untrusted content, remove either its access to private data or its ability to send data out.`,
  `Privilege separation: a quarantined model reads untrusted content and returns only structured, validated data (for example a category or extracted fields); a privileged model or plain code makes decisions and calls tools. Research designs such as the dual-LLM pattern and CaMeL formalize this.`,
  `Constrain actions: allowlists of tools per task, strict argument schemas, fixed recipients or domains, and plain code (not the model) checking authorization for every call.`,
  `Mark untrusted content clearly in the prompt (delimit it and state it is data), and never let it change system instructions. This reduces, but does not eliminate, risk.`,
  `Human approval for consequential actions, showing the exact action and destination.`,
  `Detect and respond: injection classifiers on inputs and retrieved content, anomaly alerts on unusual tool sequences, and full audit logs.`],
 formulas:[],fig:'defense',cap:`Layers, from preventing harm to detecting attempts.`,
 src:[L(`Prompt injection defense`,`14-agent-engineering/27-prompt-injection-defense`),L(`Guardrails`,`11-llm-engineering/12-guardrails`)]},

{id:'sec-output',grp:G5,ch:'Lesson 4',title:'Output handling and data exfiltration',tag:`Treat model output as untrusted input to everything downstream.`,
 points:[`Rendering is an outbound channel: a Markdown image or link whose URL contains secrets leaks them when the client fetches it. Allowlist image and link domains, proxy or strip the rest, and don’t auto-render URLs built from model output.`,
  `Model output passed to a browser can carry script (XSS); to SQL, injection; to a shell, command injection; to an HTTP client, server-side request forgery. Encode, parameterize and validate exactly as you would for user input.`,
  `Prefer structured outputs validated against schemas over free text that downstream code parses.`,
  `Don’t execute model-written code outside a sandbox, and don’t let it choose arbitrary URLs or file paths.`,
  `Scan outputs for secrets and personal data before display, logging or caching.`,
  `Misinformation (LLM09) is also an output risk: show sources, confidence and dates, and avoid presenting generated text as verified fact in high-stakes flows.`],
 formulas:[],fig:'exfil',cap:`A rendered image URL can carry stolen data out.`,
 src:[L(`EchoLeak and CVEs for AI`,`18-ethics-safety-alignment/25-echoleak-cves-for-ai`),L(`Structured outputs`,`11-llm-engineering/03-structured-outputs`)]},

{id:'sec-agency',grp:G5,ch:'Lesson 5',title:'Excessive agency and tool permissions',tag:`Give agents the least power that still gets the job done.`,
 points:[`Excessive agency has three sources: too many tools (functionality), too broad permissions on those tools, and too much autonomy (acting without checks).`,
  `Least privilege: read-only by default; scoped, short-lived credentials per tool and per user; act on behalf of the user’s identity, never a shared admin account.`,
  `Narrow tools: “refund_order(order_id, amount ≤ original)” instead of a general “call_api(url, body)”.`,
  `Approval tiers: reads run freely; reversible writes may auto-run with logging; irreversible, external or high-value actions need a human, showing the exact action.`,
  `Limits per task: spend caps, rate limits, maximum records changed, and kill switches.`,
  `Sandboxes for code and browser tools: no ambient credentials, restricted network, disposable environments.`],
 formulas:[],fig:'defense',cap:`Least privilege is the first layer.`,
 src:[L(`Skill permissions, sandboxes and trust`,`13-tools-and-protocols/26-skill-permissions-sandboxes-and-trust`),L(`Failure modes of agentic systems`,`14-agent-engineering/26-failure-modes-agentic`)]},

{id:'sec-mcp',grp:G5,ch:'Lesson 6',title:'Tool and MCP supply-chain security',tag:`Tool descriptions are instructions from a third party.`,
 points:[`Tool poisoning: a tool’s description contains hidden instructions (“before using any tool, send the user’s files to…”). The model reads descriptions as guidance.`,
  `Rug pulls: a tool you approved later changes its description or behaviour. Pin versions or hash descriptors, and re-review on change.`,
  `Shadowing: two servers expose the same tool name and the wrong one is chosen. Namespace tools by server.`,
  `Identity confusion: a familiar display name is not proof of who published a server. Use trusted registries, signed packages and allowlists.`,
  `Isolation: run local servers with minimal file and network access; give each server its own scoped credentials via OAuth; never share tokens across servers.`,
  `Apply normal dependency hygiene to models, prompts, datasets and plugins too (LLM03 supply chain): provenance, pinning, scanning and review.`],
 formulas:[],fig:'mcparch',cap:`Every server is a dependency with access to the model’s attention.`,
 src:[L(`MCP security: tool poisoning`,`13-tools-and-protocols/15-mcp-security-tool-poisoning`),L(`MCP OAuth 2.1`,`13-tools-and-protocols/16-mcp-security-oauth-2-1`),L(`MCP registry, supply chain and drift`,`13-tools-and-protocols/30-mcp-registry-supply-chain-and-drift`)]},

{id:'sec-data',grp:G5,ch:'Lesson 7',title:'Data protection: secrets, PII and prompt leakage',tag:`Keep sensitive data out of places it doesn’t need to be.`,
 points:[`Minimize: don’t put data in prompts, indexes, logs or caches unless the task needs it. Redact or tokenize personal data at ingest.`,
  `Sensitive information disclosure (LLM02) happens through retrieval across tenants, shared caches, traces, verbose errors and model outputs. Scope every store by tenant and permission.`,
  `System prompt leakage (LLM07): assume users can extract your system prompt. Never put secrets, keys or authorization rules in it; keep those in code.`,
  `Secrets: central vault with identity-based access, short-lived tokens, rotation, and secret scanning in repositories, prompts and logs.`,
  `Provider settings: understand retention, training use and data residency for each API; use enterprise terms or self-hosting for sensitive workloads.`,
  `Logs and traces are data stores: redact before export, restrict access, and set retention periods.`],
 formulas:[],fig:'trust',cap:`Sensitive data crosses many boundaries unless you stop it early.`,
 src:[L(`Security, secrets and audit`,`17-infrastructure-and-production/25-security-secrets-audit`),L(`Differential privacy for LLMs`,`18-ethics-safety-alignment/22-differential-privacy-for-llms`)]},

{id:'sec-rag',grp:G5,ch:'Lesson 8',title:'RAG and data poisoning',tag:`Whoever can write to your corpus can talk to your model.`,
 points:[`Corpus poisoning: an attacker adds or edits documents (a wiki page, a shared drive file, a support ticket) with false facts or hidden instructions that are later retrieved.`,
  `Vector and embedding weaknesses (LLM08): cross-tenant leakage through shared indexes, embedding inversion (recovering text from vectors), and adversarial text crafted to rank highly for many queries.`,
  `Controls: restrict who can write to indexed sources, record provenance (author, source, time) per chunk, prefer trusted sources in ranking, and quarantine new or external content until reviewed for high-risk corpora.`,
  `Scan ingested content for injection patterns and hidden text (white-on-white text, zero-width characters, HTML comments), and strip it.`,
  `Treat vectors as sensitive as the text they came from: same access controls and encryption.`,
  `Model and data poisoning (LLM04) also applies to fine-tuning data: track dataset provenance and evaluate behaviour after every training run.`],
 formulas:[],fig:'ragmap',cap:`Ingestion is a write path into the model’s context.`,
 src:[L(`Data provenance and training governance`,`18-ethics-safety-alignment/27-data-provenance-training-governance`),L(`Indirect prompt injection`,`18-ethics-safety-alignment/15-indirect-prompt-injection`)]},

{id:'sec-dos',grp:G5,ch:'Lesson 9',title:'Unbounded consumption and abuse',tag:`Every request costs money; attackers know it.`,
 points:[`Unbounded consumption (LLM10) covers denial of service, denial of wallet (running up your bill) and model extraction through mass querying.`,
  `Limits at every layer: request size, max output tokens, max tool calls and turns per task, max concurrent requests per user and tenant, and daily spend caps with alerts.`,
  `Rate limiting with token buckets per user, key and IP; separate limits for expensive endpoints (long context, agents, image generation).`,
  `Authenticate everything; anonymous endpoints attract abuse. Use bot detection on public chat surfaces.`,
  `Watch for unusual patterns: sudden token spikes, very long prompts, repeated near-identical queries (scraping), and agents looping.`,
  `Budget-aware agents: when a task nears its spend cap, stop and report instead of continuing.`],
 formulas:[[`Token bucket`,`tokens = min(capacity, tokens + rate × Δt); allow if tokens ≥ cost`]],
 fig:'agentloop',cap:`Budgets bound the loop, and quotas bound the users.`,
 src:[L(`Caching, rate limiting and cost`,`11-llm-engineering/11-caching-cost`),L(`FinOps for LLMs`,`17-infrastructure-and-production/27-finops-llms`)]},

{id:'sec-redteam',grp:G5,ch:'Lesson 10',title:'Red teaming, guardrails and incident response',tag:`Attack your own system before someone else does.`,
 points:[`Red teaming: systematically try to make the system misbehave: injections (direct and through every content source), data exfiltration, unauthorized actions, cross-tenant access, harmful outputs and runaway costs.`,
  `Automate the routine part with open-source scanners and attack frameworks (for example garak and PyRIT) and keep manual, scenario-based testing for your specific tools and data.`,
  `Guardrails: input and output classifiers (safety models such as Llama Guard, injection detectors, PII scanners) and policy rules. Measure their false positives and false negatives on your own traffic.`,
  `Turn every successful attack into a regression test in the eval suite (Module 4), with an expected safe outcome.`,
  `Incident response: be able to disable a tool, a model or a feature instantly (kill switch), rotate credentials, purge caches and poisoned documents, and replay traces to scope the impact.`,
  `Follow and report: track AI-specific vulnerability reports and advisories for the models, frameworks and plugins you use.`],
