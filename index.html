const TOPICS=[
{id:'why-dl',grp:'DL 1: Introduction',ch:'Lesson 1',title:'What deep learning is, and why now',tag:`Machine learning that learns its own features, layer by layer.`,
 points:[`Deep learning (DL) sits inside machine learning (ML), which sits inside AI. DL means neural networks with many layers.`,
  `Classical ML needs hand-crafted features (feature engineering). DL takes raw input and learns features itself: edges, then parts, then whole objects.`,
  `DL shines on large, unstructured data (images, text, audio) but needs lots of data and compute. On small tabular data, classical ML is often simpler and easier to explain.`,
  `Why it took off in the 2010s: huge datasets, GPUs, better techniques (ReLU, dropout, better initialization) and open-source frameworks.`,
  `Families covered in the book: ANN/MLP, CNN, RNN/LSTM/GRU, then attention and transformers.`],
 formulas:[],fig:'dl',cap:`Nested view of AI, ML and DL, and what a vision network learns at each depth.`},

{id:'perceptron',grp:'DL 2: Perceptrons',ch:'Lesson 1',title:'The perceptron and the perceptron trick',tag:`One weighted sum, one threshold, one line.`,
 points:[`A perceptron computes z = Σ wᵢxᵢ + b and outputs 1 if z ≥ 0, else 0 (a step function).`,
  `Geometry: w·x + b = 0 is the decision boundary (a line in 2D, a plane in 3D). One side is class 1, the other class 0.`,
  `Perceptron trick: pick a point. If it is misclassified, nudge the line toward it. Positive point in the negative region: w ← w + ηx. Negative point in the positive region: w ← w − ηx.`,
  `Both cases in one rule: w ← w + η(y − ŷ)x, with y and ŷ in {0, 1}. Correct points give y − ŷ = 0, so nothing changes.`,
  `It converges only if the data is linearly separable.`,
  `Perceptron vs neuron: a neuron swaps the step for a smooth activation such as sigmoid, which makes gradient-based training possible.`],
 formulas:[[`Prediction`,`ŷ = step(w·x + b)`],[`Update rule`,`w ← w + η (y − ŷ) x`]],fig:'perceptron',cap:`Inputs, weights, a weighted sum plus bias, then a step function.`},

{id:'perceptron-limits',grp:'DL 2: Perceptrons',ch:'Lesson 2',title:'Perceptron loss and its limits',tag:`Why we move to smooth activations, proper losses and hidden layers.`,
 points:[`The step function has no useful gradient, so gradient descent cannot train it directly. We need a loss function and a smooth activation.`,
  `Loss choices from the book: hinge loss (perceptron-style), or sigmoid with binary cross-entropy (this is logistic regression). Softmax with categorical cross-entropy extends this to many classes.`,
  `A single perceptron only draws linear boundaries. On non-linear data (like XOR) it fails.`,
  `The fix: stack neurons into hidden layers with non-linear activations, giving the multi-layer perceptron.`],
 formulas:[[`Sigmoid`,`σ(z) = 1 / (1 + e⁻ᶻ)`],[`Binary cross-entropy`,`L = −[y log ŷ + (1 − y) log(1 − ŷ)]`]],fig:'xor',cap:`The XOR problem: no straight line separates the two classes.`},

{id:'mlp',grp:'DL 3: Multi-layer perceptrons',ch:'Lesson 1',title:'MLP notation and forward propagation',tag:`Stack layers, keep the notation straight, push inputs forward.`,
 points:[`Layers: input, one or more hidden layers, output. Fully connected (“dense”): every node feeds every node of the next layer.`,
  `Notation (Ch 8): wˡᵢⱼ is the weight from node i in layer l−1 to node j in layer l. bˡⱼ is the bias of node j in layer l. oˡⱼ is its output.`,
  `Forward propagation runs layer by layer. In matrix form: aˡ = σ(Wˡ aˡ⁻¹ + bˡ).`,
  `Non-linear activations are essential. Without them, any stack of layers collapses into a single linear map.`,
  `Counting parameters: each layer has (inputs × units) weights plus (units) biases. A 3-4-4-2 network has 12 + 16 + 8 = 36 weights and 4 + 4 + 2 = 10 biases, so 46 in total.`],
 formulas:[[`Layer output`,`aˡ = σ(Wˡ aˡ⁻¹ + bˡ)`],[`Parameters in a dense layer`,`nₗ₋₁ × nₗ + nₗ`]],fig:'mlp',cap:`A 3-4-4-2 network. Every line is one weight.`},

{id:'ann-keras',grp:'DL 4: Practical ANN',ch:'Lesson 1',title:'Building ANNs in Keras: MNIST, churn, admission',tag:`Same recipe each time: shape the input, pick the head, pick the loss.`,
 points:[`MNIST (Ch 12): 28×28 image, Flatten to 784, Dense(128, ReLU), Dense(32, ReLU), Dense(10, softmax). Scale pixels to 0–1 first.`,
  `Parameters from the book: 784×128+128 = 100,480, then 128×32+32 = 4,128, then 32×10+10 = 330. Total 104,938.`,
  `Binary classification (customer churn, Ch 11): one output unit with sigmoid and binary cross-entropy.`,
  `Multiclass: softmax output with categorical (or sparse categorical) cross-entropy.`,
  `Regression (graduate admission, Ch 13): one output unit, MSE loss, scaled input features.`],
 formulas:[[`Dense(128) on 784 inputs`,`784 × 128 + 128 = 100,480`]],fig:'ann',cap:`The MNIST model from the book with its parameter counts.`},

{id:'loss',grp:'DL 5: Training neural networks',ch:'Lesson 1',title:'Loss functions',tag:`Pick the loss that matches the task.`,
 points:[`A loss measures the error on one example. The cost is the average over the data.`,
  `Regression: MSE squares the error (punishes big mistakes, smooth, sensitive to outliers). MAE uses |error| (robust to outliers, not smooth at 0). Huber behaves like MSE near zero and like MAE far away.`,
  `Classification: binary cross-entropy (two classes, sigmoid), categorical cross-entropy (one-hot labels, softmax), sparse categorical cross-entropy (integer labels), hinge (margin-based).`],
 formulas:[[`MSE`,`L = (1/n) Σ (y − ŷ)²`],[`MAE`,`L = (1/n) Σ |y − ŷ|`],[`Binary cross-entropy`,`−[y log ŷ + (1 − y) log(1 − ŷ)]`],[`Categorical cross-entropy`,`−Σₖ yₖ log ŷₖ`]],fig:'loss',cap:`MSE grows fastest for large errors; MAE grows linearly; Huber blends both.`},

{id:'backprop',grp:'DL 5: Training neural networks',ch:'Lesson 2',title:'Backpropagation and memoization',tag:`Chain rule, applied right to left, with reuse.`,
 points:[`Goal: the gradient ∂L/∂w for every weight, so gradient descent can update it: w ← w − η ∂L/∂w.`,
  `The forward pass computes and stores every intermediate value. The backward pass then applies the chain rule from the loss toward the input.`,
  `A weight can influence the loss along several paths; add up the contribution of each path.`,
  `Memoization (Ch 18): derivative terms near the output are shared by many weights behind them. Compute each once and reuse it, so backprop costs about the same as a forward pass.`],
 formulas:[[`Chain rule`,`∂L/∂w = ∂L/∂ŷ · ∂ŷ/∂z · ∂z/∂w`],[`Update`,`w ← w − η ∂L/∂w`]],fig:'backprop',cap:`Forward pass stores values; backward pass multiplies local derivatives.`},

{id:'gradient-descent',grp:'DL 6: Gradient problems',ch:'Lesson 1',title:'Gradient descent: batch, stochastic, mini-batch',tag:`How much data per update, and how big a step.`,
 points:[`Batch GD: one update per epoch using all data. Stable, but slow and memory-heavy.`,
  `Stochastic GD (SGD): one update per sample. Fast, noisy, can jump out of shallow minima.`,
  `Mini-batch GD: one update per small batch (32, 64, 128…). The practical default: vectorized and reasonably stable.`,
  `Updates per epoch = number of samples ÷ batch size.`,
  `Learning rate η: too small means slow, too large means overshoot or diverge.`],
 formulas:[[`Update`,`w ← w − η ∂L/∂w`],[`Updates per epoch`,`N / batch size`]],fig:'gd',cap:`Three behaviors of the same descent with different learning rates.`},

{id:'gradient-problems',grp:'DL 6: Gradient problems',ch:'Lesson 2',title:'Vanishing and exploding gradients',tag:`Products of many factors either die or blow up.`,
 points:[`Vanishing: going backward, gradients are multiplied by many small factors (sigmoid’s derivative is at most 0.25). Early layers barely update: w_new ≈ w_old, as in the book’s example 1 − 0.5 × 0.000001.`,
  `Exploding: factors above 1 or large weights multiply into huge gradients: 1 − 0.1 × 100 = −9, and the loss may become NaN.`,
  `Fixes: ReLU-family activations, Xavier/He initialization, batch normalization, residual connections, gradient clipping, and LSTM/GRU for sequences.`,
  `Signs: vanishing shows as loss that barely moves and early layers that stay unchanged; exploding shows as wild oscillation or NaN.`],
 formulas:[[`Sigmoid derivative`,`σ′(z) = σ(z)(1 − σ(z)) ≤ 0.25`],[`Deep chain`,`∂L/∂w₁ ∝ ∏ σ′(zₖ) · wₖ`]],fig:'gradprob',cap:`Gradient size shrinks layer after layer toward the input.`},

{id:'regularization',grp:'DL 7: Improving performance',ch:'Lesson 1',title:'Overfitting: early stopping, scaling, dropout, L1/L2',tag:`Stop the model from memorizing the training set.`,
 points:[`Overfitting: training loss keeps falling while validation loss starts to rise.`,
  `Ways to improve (Ch 21): more data, scale features, early stopping, dropout, L1/L2 regularization, a better architecture.`,
  `Early stopping (Ch 22): stop when validation loss hasn’t improved for “patience” epochs, and restore the best weights.`,
  `Feature scaling (Ch 23): standardization or min-max scaling speeds up and steadies gradient descent.`,
  `Dropout (Ch 24–25): during training, randomly turn off neurons with probability p. At inference, all neurons are used.`,
  `L2 adds λΣw² (keeps weights small). L1 adds λΣ|w| (pushes many weights to exactly zero).`],
 formulas:[[`L2 regularization`,`L = L₀ + λ Σ w²`],[`L1 regularization`,`L = L₀ + λ Σ |w|`],[`Standardization`,`x′ = (x − μ) / σ`]],fig:'reg',cap:`Validation loss bottoms out, then rises while training loss keeps falling.`},

{id:'activations',grp:'DL 7: Improving performance',ch:'Lesson 2',title:'Activation functions',tag:`The non-linearity, and which one to use where.`,
 points:[`Sigmoid: output 0–1, saturates at both ends, not zero-centered, causes vanishing gradients. Good for binary outputs.`,
  `Tanh: output −1 to 1, zero-centered, still saturates.`,
  `ReLU: max(0, z). Cheap, no saturation for z > 0, the default for hidden layers. Risk: “dying ReLU”, where a neuron stays at zero forever.`,
  `Variants (Ch 28): Leaky ReLU (small slope for z < 0), Parametric ReLU (slope is learned), ELU, SELU (self-normalizing).`,
  `Output layer: sigmoid for binary, softmax for multiclass, linear for regression.`],
 formulas:[[`Sigmoid`,`σ(z) = 1 / (1 + e⁻ᶻ)`],[`Tanh`,`tanh(z) = (eᶻ − e⁻ᶻ) / (eᶻ + e⁻ᶻ)`],[`ReLU`,`max(0, z)`],[`Leaky ReLU`,`z if z > 0, else αz`]],fig:'act',cap:`Sigmoid and tanh saturate; ReLU keeps growing; Leaky ReLU keeps a small negative slope.`},

{id:'init-bn',grp:'DL 7: Improving performance',ch:'Lesson 3',title:'Weight initialization and batch normalization',tag:`Start well, and keep each layer’s inputs well-behaved.`,
 points:[`Don’t initialize all weights to zero or to one constant: every neuron in a layer then computes and learns the same thing (symmetry), and ReLU units may get zero gradients.`,
  `Random values that are too small cause vanishing signals; too large cause exploding or saturated ones.`,
  `Xavier/Glorot initialization suits tanh and sigmoid. He initialization suits ReLU.`,
  `Batch normalization (Ch 31): normalize each layer’s pre-activations over the mini-batch, then apply a learned scale γ and shift β.`,
  `Benefits: faster training, tolerates larger learning rates, mild regularization. At inference it uses running averages of mean and variance.`],
 formulas:[[`Xavier`,`Var(w) = 2 / (nᵢₙ + nₒᵤₜ)`],[`He`,`Var(w) = 2 / nᵢₙ`],[`Batch norm`,`x̂ = (x − μ_B) / √(σ²_B + ε),  y = γx̂ + β`]],fig:null,cap:''},

{id:'optimizers',grp:'DL 8: Optimizers',ch:'Lesson 1',title:'Optimizers: SGD to Adam',tag:`A family tree built from two ideas: momentum and adaptive step sizes.`,
 points:[`Plain mini-batch SGD uses one learning rate for every weight and zig-zags in narrow valleys.`,
  `EWMA (Ch 33): an exponentially weighted moving average smooths a noisy sequence. β controls how long its memory is.`,
  `Momentum: keep a velocity that accumulates past gradients. It speeds up along consistent directions and damps oscillation.`,
  `NAG: compute the gradient at the look-ahead position, which reduces overshoot.`,
  `AdaGrad: per-weight step sizes from the running sum of squared gradients. Great for sparse data, but η keeps shrinking.`,
  `RMSProp: replaces that sum with an EWMA of squared gradients, so η stops decaying too much.`,
  `Adam: momentum (first moment) plus RMSProp (second moment), with bias correction. Defaults: β₁ = 0.9, β₂ = 0.999, ε = 10⁻⁸, η = 0.001.`],
 formulas:[[`Momentum`,`v ← βv + g;   w ← w − ηv`],[`AdaGrad`,`G ← G + g²;   w ← w − η g / √(G + ε)`],[`RMSProp`,`s ← βs + (1−β)g²;   w ← w − η g / √(s + ε)`],[`Adam`,`m ← β₁m + (1−β₁)g;  v ← β₂v + (1−β₂)g²;  w ← w − η m̂ / (√v̂ + ε)`]],fig:'opt',cap:`Adam merges the momentum branch and the adaptive-rate branch.`},

{id:'tuning',grp:'DL 9: Hyperparameter tuning',ch:'Lesson 1',title:'Hyperparameter tuning with Keras Tuner',tag:`Searching the settings you choose before training.`,
 points:[`Parameters (weights, biases) are learned. Hyperparameters are set beforehand: learning rate, batch size, layers and units, activation, optimizer, dropout rate, λ, epochs.`,
  `Keras Tuner: write a model-building function where each choice comes from a search space, then let a tuner try many trials.`,
  `Strategies: RandomSearch, Hyperband (stops weak trials early), BayesianOptimization (uses past results to pick the next trial).`,
  `Always judge trials on validation data, not training data.`,
  `Random search often beats a full grid when only a few hyperparameters really matter.`],
 formulas:[],fig:null,cap:''},

{id:'cnn-conv',grp:'DL 10: Convolutional networks',ch:'Lesson 1',title:'Convolution, padding and strides',tag:`Slide a small shared filter across the image.`,
 points:[`Why not an ANN for images (Ch 40)? Flattening loses spatial structure, the parameter count explodes, and there is no translation invariance.`,
  `CNN idea: local receptive fields and shared weights. The idea was inspired by the Hubel and Wiesel cat experiment (Ch 41).`,
  `Convolution (Ch 42): slide a kernel over the image, multiply and sum at each position to get a feature map. Edge detectors are classic kernels.`,
  `Many filters give many feature maps (channels), each looking for a different pattern.`,
  `Padding: “valid” adds none (output shrinks); “same” keeps the size. Stride: step size; larger stride gives a smaller output.`],
 formulas:[[`Output size`,`⌊(n + 2p − f) / s⌋ + 1`],[`Conv layer parameters`,`(f × f × c_in + 1) × c_out`]],fig:'conv',cap:`A 3×3 kernel over a 5×5 image with stride 1 and no padding gives a 3×3 feature map.`},

{id:'cnn-arch',grp:'DL 10: Convolutional networks',ch:'Lesson 2',title:'Pooling, LeNet-5, and CNN vs ANN',tag:`Downsample, stack, then classify.`,
 points:[`Pooling shrinks feature maps. Max pooling keeps the strongest activation in each window; average pooling keeps the mean. It has no learnable weights and adds a little translation invariance.`,
  `Downside: pooling throws away exact spatial detail.`,
  `Typical pattern: [Conv → ReLU → Pool] repeated, then Flatten, Dense, and a softmax output.`,
  `LeNet-5 (1998, LeCun): 32×32 input, C1 6@28×28, S2 6@14×14, C3 16@10×10, S4 16@5×5, then 120, 84, and 10 outputs.`,
  `CNN vs ANN (Ch 46): CNNs use far fewer parameters and exploit spatial structure. ANNs suit tabular data.`],
 formulas:[[`C1 parameters`,`(5×5 + 1) × 6 = 156`]],fig:'lenet',cap:`LeNet-5, layer by layer.`},

{id:'transfer',grp:'DL 10: Convolutional networks',ch:'Lesson 3',title:'CNN backprop, augmentation, transfer learning',tag:`Train less, reuse more.`,
 points:[`Backprop in a CNN (Ch 47–48): gradients for conv layers are themselves convolutions. Max pooling passes the gradient only to the position that won.`,
  `Data augmentation (Ch 50): random flips, rotations, zooms and shifts create varied samples and reduce overfitting.`,
  `Pretrained models (Ch 51): networks like VGG16 trained on ImageNet can be reused. Filter and feature-map visualization (Ch 52) shows what they learned.`,
  `Transfer learning (Ch 53): freeze the pretrained conv base and train a new head (feature extraction). Fine-tuning then unfreezes the top layers with a small learning rate.`,
  `Keras Functional API (Ch 54): build non-sequential models such as multi-input, multi-output, or skip connections.`],
 formulas:[],fig:'transfer',cap:`Feature extraction: only the new head is trained.`},

{id:'rnn',grp:'DL 11: Recurrent networks',ch:'Lesson 1',title:'RNNs: forward pass, types, BPTT, problems',tag:`A hidden state carries the past forward.`,
 points:[`Why RNNs (Ch 55): sequences (text, time series, speech) have variable length and meaningful order. ANNs need a fixed input and ignore order.`,
  `An RNN keeps a hidden state hₜ summarizing what it has seen, and reuses the same weights at every step.`,
  `Types (Ch 58): one-to-many (image captioning), many-to-one (sentiment), many-to-many (translation, tagging).`,
  `Backpropagation through time (Ch 59): unroll over the steps, then backprop through all of them.`,
  `Problems (Ch 60): vanishing and exploding gradients over long sequences, so long-term dependencies are lost. Also slow, since steps are sequential.`],
 formulas:[[`Hidden state`,`hₜ = tanh(Wₓ xₜ + Wₕ hₜ₋₁ + b)`],[`Output`,`ŷₜ = softmax(W_y hₜ + c)`]],fig:'rnn',cap:`An RNN unrolled over three steps. Weights are shared across steps.`},

{id:'lstm-gru',grp:'DL 11: Recurrent networks',ch:'Lesson 2',title:'LSTM, GRU, stacked and bidirectional RNNs',tag:`Gates decide what to keep, write, and show.`,
 points:[`LSTM adds a cell state Cₜ, a long-term memory highway, next to the hidden state hₜ.`,
  `Three sigmoid gates (values 0–1): forget fₜ erases parts of Cₜ₋₁, input iₜ writes new candidate content C̃ₜ (from tanh), output oₜ decides what to show as hₜ.`,
  `Because Cₜ is updated additively, gradients can flow across many steps. That is how LSTMs ease vanishing gradients.`,
  `GRU (Ch 65): two gates (update, reset), no separate cell state. Fewer parameters, often similar accuracy.`,
  `Stacked RNNs (Ch 64) add depth. Bidirectional RNNs (Ch 66) read forward and backward, which helps when the whole sequence is known.`,
  `Next-word predictor (Ch 63): tokenize, build sequences, pad, embed, LSTM, softmax over the vocabulary.`],
 formulas:[[`Forget gate`,`fₜ = σ(W_f [hₜ₋₁, xₜ] + b_f)`],[`Cell state`,`Cₜ = fₜ ⊙ Cₜ₋₁ + iₜ ⊙ C̃ₜ`],[`Hidden state`,`hₜ = oₜ ⊙ tanh(Cₜ)`]],fig:'lstm',cap:`LSTM at a glance: three gates around a cell-state highway.`},

{id:'seq2seq',grp:'DL 12: Seq2seq and attention',ch:'Lesson 1',title:'LLM history, encoder-decoder, attention',tag:`From a single context vector to looking at every word.`,
 points:[`The story (Ch 67): encoder-decoder, then attention, then transformers, then transfer learning in NLP, then LLMs and ChatGPT.`,
  `Encoder-decoder (Ch 68): the encoder compresses the input into one fixed context vector; the decoder generates the output step by step.`,
  `Bottleneck: one fixed vector can’t hold a long sentence, so quality drops with length.`,
  `Attention (Ch 69): at each output step, compute weights αᵢⱼ over all encoder states and take a weighted sum as a fresh context vector cᵢ.`,
  `Bahdanau (additive) scores from the previous decoder state sᵢ₋₁ using a small feed-forward net. Luong (multiplicative) scores from the current decoder state sᵢ, often with a dot product.`],
 formulas:[[`Context vector`,`cᵢ = Σⱼ αᵢⱼ hⱼ`],[`Weights`,`αᵢⱼ = softmax(eᵢⱼ)`],[`Bahdanau score`,`eᵢⱼ = vᵀ tanh(W sᵢ₋₁ + U hⱼ)`],[`Luong (dot) score`,`eᵢⱼ = sᵢᵀ hⱼ`]],fig:'attn',cap:`Thicker lines mean larger attention weights for this output step.`},

{id:'self-attention',grp:'DL 13: Transformers',ch:'Lesson 1',title:'Self-attention and multi-head attention',tag:`Every token looks at every other token, in parallel.`,
 points:[`Transformers (2017) drop recurrence. This allows parallel training and direct long-range links.`,
  `Static word embeddings don’t change with context. Self-attention gives contextual embeddings.`,
  `Each token makes a query q, key k and value v through learned projections: Q = XW_Q, K = XW_K, V = XW_V.`,
  `Scaled dot-product attention: softmax(QKᵀ/√dₖ)V. Scaling matters because dot products grow with dₖ, which saturates softmax and kills gradients.`,
  `Why “self”? Q, K and V all come from the same sequence (unlike encoder-decoder attention, where they come from two).`,
  `Multi-head attention: several heads with different projections run in parallel, then are concatenated and projected. Each head can focus on a different relation.`],
 formulas:[[`Attention`,`Attention(Q,K,V) = softmax(QKᵀ / √dₖ) V`],[`Projections`,`Q = XW_Q,  K = XW_K,  V = XW_V`]],fig:'sa',cap:`Pipeline for one head, with an example attention matrix.`},

{id:'transformer',grp:'DL 13: Transformers',ch:'Lesson 2',title:'The full transformer: encoder, decoder, inference',tag:`Positions, norms, masks, and cross-attention.`,
 points:[`Positional encoding (Ch 78): attention has no sense of order, so position information is added to the embeddings (sine and cosine of different frequencies in the original paper).`,
  `Layer normalization (Ch 79): normalizes across the features of each token, which works with any batch size and sequence length. Batch norm suits sequences poorly.`,
  `Encoder block (Ch 80): multi-head self-attention, Add & Norm, feed-forward, Add & Norm. Residual connections wrap each sub-layer.`,
  `Masked self-attention (Ch 81): in the decoder, each position may only attend to earlier positions.`,
  `Cross-attention (Ch 82): queries come from the decoder, keys and values from the encoder output.`,
  `Decoder (Ch 83): masked self-attention, cross-attention, feed-forward, each with Add & Norm, then linear and softmax.`,
  `Inference (Ch 84): generate one token at a time, feeding previous outputs back in. The encoder runs once.`],
 formulas:[[`Positional encoding`,`PE(pos,2i) = sin(pos / 10000^(2i/d)),  PE(pos,2i+1) = cos(pos / 10000^(2i/d))`],[`Sub-layer`,`LayerNorm(x + Sublayer(x))`]],fig:'tr',cap:`Encoder and decoder stacks. The encoder output feeds the decoder’s cross-attention.`}
];
const ML=[
{id:'ml-what',grp:'ML 1: Foundations',ch:'Lesson 1',title:'What machine learning is, and when to use it',tag:`Learning the rules from data instead of writing them by hand.`,
 points:[`Traditional programming: rules + data give answers. Machine learning: data + answers give the rules (the model).`,
  `Use ML when (Ch 1): there are too many cases to code by hand, you can’t list every case in advance (a dog in any photo), or you want to mine large data for hidden patterns.`,
  `AI, ML and DL (Ch 2): AI is the broad goal of machines acting intelligently. Early AI used hand-coded logic. ML learns patterns from data. DL is ML with deep neural networks.`,
  `ML took off after 2010 because of more data, cheaper compute and better algorithms.`],
 formulas:[],fig:'mlvs',cap:`The flow of information flips: in ML the rules are the output.`},

{id:'ml-types',grp:'ML 1: Foundations',ch:'Lesson 2',title:'Types of machine learning',tag:`What data you have decides which family fits.`,
 points:[`Supervised: labeled data (X, y); learn to predict y. Regression predicts a number, classification predicts a category. The notes put it at roughly 70% of real applications.`,
  `Unsupervised: only X. Find structure: clustering, dimensionality reduction, anomaly detection.`,
  `Semi-supervised: a few labels plus many unlabeled examples; labels spread to similar points (photo tagging).`,
  `Reinforcement: an agent acts, gets rewards or penalties (often delayed) and learns to maximize total reward (games, robotics).`,
  `Quick chooser: labels available means supervised, no labels means unsupervised, few labels means semi-supervised, decisions with rewards means reinforcement.`],
 formulas:[],fig:'mltypes',cap:`The four families, what each needs, and a typical use.`},

{id:'ml-modes',grp:'ML 1: Foundations',ch:'Lesson 3',title:'Batch vs online learning, instance vs model based',tag:`When the model learns, and what it keeps.`,
 points:[`Batch (offline) learning: train on all the data at once, deploy, and stop learning. To update, retrain from scratch on old plus new data.`,
  `Batch problems: models go stale as data drifts, retraining is heavy, and it can’t adapt in real time or on small devices.`,
  `Online learning: update the model incrementally on single points or mini-batches as data streams in. The learning rate sets how fast it adapts (high means it forgets old data quickly).`,
  `Online risks: bad data or outliers can corrupt the model, so monitor it.`,
  `Instance-based (lazy) learning: store the training examples and predict by similarity to them (KNN). Model-based learning: fit a function with parameters (linear regression) and predict from it.`],
 formulas:[],fig:'batchonline',cap:`Batch retrains on a schedule; online keeps updating.`},

{id:'ml-challenges',grp:'ML 1: Foundations',ch:'Lesson 4',title:'The 10 challenges in machine learning',tag:`Most failures come from data, then from model fit, then from operations.`,
 points:[`Data (1–5): collecting data (APIs, scraping, partnerships), too little data (augmentation, transfer learning), non-representative data (proper sampling), poor quality data (cleaning, validation), irrelevant features (feature selection, domain knowledge).`,
  `Model fit (6–7): overfitting (memorizes training data; fix with regularization, more data, simpler model) and underfitting (too simple; fix with a more complex model or better features).`,
  `Operations (8–10): software integration (APIs, containers), offline models going stale (automated retraining and monitoring), and cost (focus on ROI, MLOps).`,
  `Ch 9 shows ML at work in retail, banking, transport, manufacturing and consumer internet.`],
 formulas:[],fig:null,cap:''},

{id:'ml-lifecycle',grp:'ML 1: Foundations',ch:'Lesson 5',title:'The ML development life cycle (9 phases)',tag:`From a business question to a model that keeps working.`,
 points:[`1 Frame the problem: define the goal, users, ML task type, success metrics, data sources, budget.`,
  `2 Gather data: files, databases, APIs, scraping. 3 Preprocess: clean, remove duplicates, fix types, handle missing values and outliers.`,
  `4 EDA: understand distributions and relationships. 5 Feature engineering and selection: build and choose the inputs.`,
  `6 Model training, evaluation and selection: try algorithms, tune, compare on validation data.`,
  `7 Deploy: serve the model (API, app). 8 Test: check it with real conditions and users. 9 Optimize: monitor, retrain, improve.`,
  `Ch 51 (ML system design framework) revisits this with production concerns.`],
 formulas:[],fig:'mlflow',cap:`The nine phases in order. Real projects loop back often.`},

{id:'ml-gathering',grp:'ML 2: Getting and understanding data',ch:'Lesson 1',title:'Gathering data with pandas, APIs and scraping',tag:`Every source ends up as a DataFrame.`,
 points:[`CSV and Excel: pd.read_csv, pd.read_excel. Check the delimiter, encoding and header row.`,
  `JSON: pd.read_json; nested JSON needs flattening (json_normalize).`,
  `SQL: connect with a database connector and load with pd.read_sql.`,
  `APIs (Ch 54 uses the TMDB API): send HTTP requests with the key, read the JSON response, loop over pages, and respect rate limits.`,
  `Web scraping (Ch 55): when there is no API, fetch pages with requests and parse the HTML with BeautifulSoup. Check the site’s terms first.`,
  `After loading, always look at shape, dtypes and a few rows.`],
 formulas:[],fig:'datasrc',cap:`Five common sources, one common destination.`},

{id:'ml-eda',grp:'ML 2: Getting and understanding data',ch:'Lesson 2',title:'Understanding data and EDA',tag:`Seven questions, then one plot per pair of variable types.`,
 points:[`The 7 basic questions (Ch 57): How big is it? What does it look like? What are the column types? Any missing values? What do the numbers look like (describe)? Any duplicates? How are columns correlated?`,
  `Univariate analysis (Ch 58): categorical columns with count plots and pie charts; numerical columns with histograms, KDE, box plots and summary statistics (mean, median, skew).`,
  `Bivariate and multivariate (Ch 59): scatter plot for numeric vs numeric; bar, box and distribution plots for numeric vs categorical; heatmap of a crosstab for categorical vs categorical.`,
  `Pandas Profiling (Ch 60) generates an automatic report: overview, variables, interactions and correlations.`],
 formulas:[],fig:'edagrid',cap:`Which plot to reach for, by variable types.`},

{id:'ml-scaling',grp:'ML 3: Feature engineering',ch:'Lesson 1',title:'Feature scaling: standardization and normalization',tag:`Put features on comparable ranges, using training data only.`,
 points:[`Why: algorithms based on distances or gradients (KNN, K-Means, SVM, linear and logistic regression, neural nets, PCA) are sensitive to feature ranges. Tree-based models are not.`,
  `Standardization (z-score): mean 0, standard deviation 1. Unbounded. A solid default.`,
  `Min-max scaling squeezes into [0, 1] but is sensitive to outliers. Mean normalization centers around the mean. MaxAbs divides by the largest absolute value (keeps sparsity).`,
  `Robust scaling uses the median and IQR, so it copes with outliers.`,
  `Fit the scaler on the training set only, then transform both train and test. Fitting on all data leaks information.`],
 formulas:[[`Standardization`,`x′ = (x − μ) / σ`],[`Min-max`,`x′ = (x − min) / (max − min)`],[`MaxAbs`,`x′ = x / max|x|`],[`Robust`,`x′ = (x − median) / IQR`]],fig:'scaling',cap:`The same five values on three scales. Order and spacing are preserved.`},

{id:'ml-encoding',grp:'ML 3: Feature engineering',ch:'Lesson 2',title:'Encoding categorical data and binning numbers',tag:`Turn labels into numbers without inventing false order.`,
 points:[`Nominal categories have no order (color, city). Ordinal categories do (Low, Medium, High).`,
  `Ordinal encoding maps ordered categories to integers in the right order. Label encoding is for the target column.`,
  `One-hot encoding creates one 0/1 column per category, so no false order is implied.`,
  `Dummy variable trap: the k columns add up to 1, causing multicollinearity. Drop one column to keep k − 1.`,
  `High cardinality: keep the top categories and group the rest as “other”.`,
  `Discretization (binning, Ch 70) turns numbers into ranges: equal width, equal frequency (quantile), KMeans bins, or custom domain bins.`],
 formulas:[[`Dummy columns`,`k categories → k − 1 columns`]],fig:'onehot',cap:`One-hot encoding of a color column.`},

{id:'ml-pipelines',grp:'ML 3: Feature engineering',ch:'Lesson 3',title:'ColumnTransformer and pipelines',tag:`One object that preprocesses and predicts, leak-free.`,
 points:[`Doing imputation, encoding and scaling column by column gets messy and error-prone.`,
  `ColumnTransformer applies different transformers to different column groups, as a list of (name, transformer, columns). remainder="passthrough" keeps the other columns untouched.`,
  `Pipeline chains steps, ending in the model, so one fit and one predict does everything.`,
  `Benefits: no leakage in cross-validation (preprocessing is fitted inside each training fold), cleaner code, one object to save and deploy, and tuning any step’s parameters in grid search.`],
 formulas:[],fig:'colpipe',cap:`Branches for each column type merge before the model.`},

{id:'ml-transforms',grp:'ML 3: Feature engineering',ch:'Lesson 4',title:'Mathematical transforms for skewed data',tag:`Pull long tails toward a bell shape.`,
 points:[`Many models work best when features look roughly normal. Check with a histogram, KDE and a QQ plot (points on the diagonal mean normal).`,
  `Function transformers apply log, reciprocal, square or square root. Log helps right-skewed, strictly positive data. Square helps left-skew.`,
  `Power transformers learn the exponent λ for you. Box-Cox needs strictly positive data. Yeo-Johnson also handles zero and negatives.`,
  `Transforming skewed data can improve linear models; trees mostly don’t care.`],
 formulas:[[`Box-Cox`,`x(λ) = (x^λ − 1) / λ for λ ≠ 0, ln x for λ = 0 (x > 0)`]],fig:'skewlog',cap:`A log transform pulls in the long right tail.`},

{id:'ml-datetime',grp:'ML 3: Feature engineering',ch:'Lesson 5',title:'Date and time, mixed data, constructing features',tag:`Hidden signals in dates, codes and combined columns.`,
 points:[`Dates (Ch 72): convert strings with pd.to_datetime first. Then extract year, month, day, weekday, quarter, is_weekend; from time, hour and part of day.`,
  `Time elapsed: subtract two dates (days since signup, age of a car).`,
  `Mixed data (Ch 71): a column holding letters and numbers (a cabin code like “B25”) can be split into a category part and a numeric part.`,
  `Feature construction (Ch 83): combine columns into new ones (family size = SibSp + Parch + 1, BMI from height and weight). Feature splitting breaks one column into several (name into title).`],
 formulas:[[`Example construction`,`family_size = SibSp + Parch + 1`]],fig:'datefeat',cap:`One date becomes several useful numeric features.`},

{id:'ml-missing',grp:'ML 4: Missing data and outliers',ch:'Lesson 1',title:'Missing data: CCA and simple imputation',tag:`Drop, fill, or flag. Know why the data is missing first.`,
 points:[`Types: MCAR (missing completely at random), MAR (depends on other observed columns), MNAR (depends on the missing value itself).`,
  `Complete case analysis (CCA): drop rows with missing values. Needs MCAR and only a small share missing (rule of thumb: under about 5%), otherwise you lose data and add bias.`,
  `Numerical fills: mean (roughly symmetric data), median (skewed or outliers), arbitrary value like −999, or end-of-distribution (μ ± 3σ).`,
  `Categorical fills: most frequent value (mode) or a new “Missing” category when missingness itself is informative.`,
  `Random sample imputation keeps the distribution. A missing indicator adds a 0/1 column marking which values were missing.`,
  `Compute fill values on training data only. Mean or median fills shrink variance and weaken correlations.`],
 formulas:[[`End-of-distribution value`,`μ ± 3σ`]],fig:'missingspike',cap:`Mean imputation piles values at the center.`},

{id:'ml-missing-adv',grp:'ML 4: Missing data and outliers',ch:'Lesson 2',title:'KNN imputer and MICE',tag:`Use the other columns to fill each gap.`,
 points:[`Univariate imputation looks at one column. Multivariate imputation uses the other columns too.`,
  `KNN imputer: find the k nearest rows using nan-Euclidean distance (ignores missing coordinates and rescales), then fill with their average, optionally weighted by distance.`,
  `MICE (multivariate imputation by chained equations): start with a simple fill, then repeatedly regress each column with missing values on the others and refill. Cycle for several rounds until values settle.`,
  `Both handle MAR better than mean fills, but cost more compute and need scaled features for distance-based KNN.`],
 formulas:[[`nan-Euclidean distance`,`√( (total / present) × Σ over present coords (xᵢ − yᵢ)² )`]],fig:'mice',cap:`MICE cycles through columns, modeling each from the rest.`},

{id:'ml-outliers',grp:'ML 4: Missing data and outliers',ch:'Lesson 3',title:'Outliers: z-score, IQR and percentiles',tag:`Find the extremes, then remove or cap them.`,
 points:[`An outlier is a point far from the rest. It is dangerous when it is an error or when it distorts a model that is sensitive to it (linear and logistic regression, distance-based methods). Tree-based models are fairly robust.`,
  `Z-score method: flag |z| > 3. Works for roughly normal data.`,
  `IQR method: flag points beyond Q1 − 1.5·IQR or Q3 + 1.5·IQR. Works for skewed data.`,
  `Percentile method: cut at chosen percentiles such as 1st and 99th.`,
  `Treatment: trimming removes the rows; capping (winsorizing) replaces extremes with the limit. Keep outliers that are real and meaningful.`],
 formulas:[[`Z-score`,`z = (x − μ) / σ`],[`IQR`,`IQR = Q3 − Q1`],[`Fences`,`lower = Q1 − 1.5·IQR,  upper = Q3 + 1.5·IQR`]],fig:'boxfence',cap:`A box plot with IQR fences. Red points fall outside.`},

{id:'ml-linear',grp:'ML 5: Regression and gradient descent',ch:'Lesson 1',title:'Simple linear regression and OLS',tag:`Find the straight line with the smallest squared error.`,
 points:[`Simple linear regression models y as a straight-line function of one input: ŷ = mx + b.`,
  `Ordinary least squares (OLS) chooses m and b to minimize the sum of squared residuals.`,
  `Why squared errors, not absolute? Squares are smooth and differentiable everywhere, the loss has a single minimum (convex), and large errors are punished more.`,
  `Setting the partial derivatives to zero gives closed-form answers. The fitted line always passes through (x̄, ȳ).`,
  `Two ways to find the parameters: this closed form, or gradient descent.`],
 formulas:[[`Model`,`ŷ = m x + b`],[`Loss`,`L = Σ (yᵢ − m xᵢ − b)²`],[`Slope`,`m = Σ (xᵢ − x̄)(yᵢ − ȳ) / Σ (xᵢ − x̄)²`],[`Intercept`,`b = ȳ − m x̄`]],fig:'regline',cap:`Best-fit line, residuals (dashed) and the mean point.`},

{id:'ml-metrics',grp:'ML 5: Regression and gradient descent',ch:'Lesson 2',title:'Regression metrics: MAE, MSE, RMSE, R², adjusted R²',tag:`Five ways to say how wrong the line is.`,
 points:[`MAE: average absolute error, in the target’s units, robust to outliers.`,
  `MSE: average squared error. Punishes big errors, but units are squared.`,
  `RMSE: square root of MSE, back in the target’s units, still outlier-sensitive.`,
  `R²: the share of variance explained compared with always predicting the mean. 1 is perfect, 0 is no better than the mean, negative is worse than the mean.`,
  `Adjusted R²: R² corrected for the number of features p. Plain R² never drops when you add a feature, even a useless one; adjusted R² rises only if the feature really helps.`],
 formulas:[[`MAE`,`(1/n) Σ |yᵢ − ŷᵢ|`],[`MSE`,`(1/n) Σ (yᵢ − ŷᵢ)²`],[`RMSE`,`√MSE`],[`R²`,`1 − SS_res / SS_tot`],[`Adjusted R²`,`1 − (1 − R²)(n − 1) / (n − p − 1)`]],fig:'r2',cap:`R² compares the line’s errors (rose) with the mean’s errors (amber).`},

{id:'ml-multiple',grp:'ML 5: Regression and gradient descent',ch:'Lesson 3',title:'Multiple linear regression and the normal equation',tag:`Many features, one matrix formula, five assumptions.`,
 points:[`Multiple linear regression uses several inputs: ŷ = β₀ + β₁x₁ + … + β_d x_d.`,
  `In matrix form ŷ = Xβ, where X has a column of ones for the intercept. Minimizing squared error gives the normal equation β = (XᵀX)⁻¹ Xᵀ y.`,
  `Inverting XᵀX gets expensive as the number of features grows, which is why gradient descent is used for large problems.`,
  `Assumptions (Ch 24): linearity, little multicollinearity among features, constant error variance (homoscedasticity), normally distributed residuals, and independent errors (no autocorrelation).`],
 formulas:[[`Model`,`ŷ = β₀ + β₁x₁ + … + β_d x_d`],[`Matrix form`,`ŷ = Xβ`],[`Normal equation`,`β = (XᵀX)⁻¹ Xᵀ y`]],fig:'matdim',cap:`Shapes in the matrix form: X is n × (d+1).`},

{id:'ml-gd',grp:'ML 5: Regression and gradient descent',ch:'Lesson 4',title:'Gradient descent for regression: batch, SGD, mini-batch',tag:`Walk downhill on the loss, with different amounts of data per step.`,
 points:[`Idea: start with parameters, compute the gradient of the loss, step the opposite way, repeat. Learning rate η sets the step size.`,
  `Batch GD uses all n points for every update. Smooth and stable, but slow on big data.`,
  `Stochastic GD (SGD) uses one random point per update. Cheap and noisy, can escape shallow minima, and may jitter around the minimum (decay η).`,
  `Mini-batch GD uses a small batch (like 32 to 256). The practical middle, and the default in deep learning.`,
  `Too small η is slow, too large diverges. Scale features first so the loss surface is rounder and descent converges faster.`,
  `The same loop trains neural networks (see the Deep learning track).`],
 formulas:[[`Gradients (MSE)`,`∂L/∂b = −(2/n) Σ (yᵢ − ŷᵢ),   ∂L/∂m = −(2/n) Σ (yᵢ − ŷᵢ) xᵢ`],[`Update`,`m ← m − η ∂L/∂m,   b ← b − η ∂L/∂b`],[`Matrix form`,`β ← β + (2η/n) Xᵀ (y − Xβ)`]],fig:'gdpaths',cap:`Batch is smooth, SGD zig-zags, mini-batch sits between.`},

{id:'ml-bias-var',grp:'ML 5: Regression and gradient descent',ch:'Lesson 5',title:'Polynomial regression and the bias-variance trade-off',tag:`Complexity buys flexibility and costs stability.`,
 points:[`Polynomial regression adds powers of x (x², x³ …) as features. It is still linear in the parameters, so the same tools apply. The degree controls complexity.`,
  `Underfit (M1): too simple, high bias, low variance. Poor on train and test.`,
  `Good fit (M2): low bias, low variance. Good on both.`,
  `Overfit (M3): too complex, low bias, high variance. Excellent on train, poor on test; it memorizes noise.`,
  `Expected error splits into bias², variance and irreducible noise.`,
  `Remedies: more data, regularization, simpler model, cross-validation to choose complexity, ensembles.`],
 formulas:[[`Polynomial model`,`ŷ = β₀ + β₁x + β₂x² + … + β_d xᵈ`],[`Error decomposition`,`Error = Bias² + Variance + Irreducible noise`]],fig:'fits',cap:`Three fits to the same points.`,fig2:'errcurve',cap2:`Training error keeps falling; test error turns up when the model overfits.`}
];

const ML2=[
{id:'ml-regularization',grp:'ML 6: Regularization and logistic regression',ch:'Lesson 1',title:'Regularization: Ridge, Lasso and Elastic Net',tag:`Penalize big coefficients so the model stops memorizing.`,
 points:[`Overfit linear models have large, unstable coefficients. Regularization adds a penalty on coefficient size to the loss (Ch 100).`,
  `Ridge (L2): adds λΣw². Shrinks coefficients toward zero but never exactly to zero. It has a closed form, w = (XᵀX + λI)⁻¹Xᵀy, which stays solvable even when features are collinear.`,
  `Five Ridge insights (Ch 103): coefficients shrink, larger coefficients shrink more, higher λ raises bias and lowers variance, features should be scaled, and λ is picked by cross-validation.`,
  `Lasso (L1): adds λΣ|w|. It can set coefficients exactly to zero, so it also selects features.`,
  `Why Lasso gives sparsity (Ch 105): its penalty pulls each weight by a constant amount λ toward zero, so small weights reach zero. Ridge’s pull is proportional to w, so it fades as w gets small.`,
  `Elastic Net (Ch 106): mixes both. In scikit-learn, alpha is overall strength and l1_ratio is the L1 share (1 is pure Lasso, 0 is pure Ridge).`],
 formulas:[[`Ridge loss`,`L = Σ (yᵢ − ŷᵢ)² + λ Σ wⱼ²`],[`Ridge solution`,`w = (XᵀX + λI)⁻¹ Xᵀ y`],[`Lasso loss`,`L = Σ (yᵢ − ŷᵢ)² + λ Σ |wⱼ|`],[`Elastic Net (sklearn)`,`(1/2n)‖y − Xw‖² + α·ρ‖w‖₁ + α(1 − ρ)/2 ‖w‖₂²,  ρ = l1_ratio`]],
 fig:'regpen',cap:`Loss contours meet the penalty region. A diamond’s corner sits on an axis, so a weight becomes exactly zero.`},

{id:'ml-logistic',grp:'ML 6: Regularization and logistic regression',ch:'Lesson 2',title:'Logistic regression',tag:`A linear score squashed into a probability.`,
 points:[`From the perceptron (Ch 107–109): the step function gives only hard 0/1 answers and no gradient. Replace it with the sigmoid to get a probability and a smooth loss.`,
  `Predict class 1 when p ≥ 0.5, which is the same as w·x + b ≥ 0. The decision boundary is linear.`,
  `Loss (Ch 110): maximizing the Bernoulli likelihood is the same as minimizing binary cross-entropy (log loss).`,
  `The sigmoid’s derivative is σ(1 − σ) (Ch 111), which makes the gradient simple.`,
  `Gradient descent (Ch 112): ∂L/∂w = (1/n) Σ (ŷ − y) x. Same shape as linear regression, with ŷ = σ(z). No closed-form solution.`,
  `Coefficients act on the log-odds: log(p / (1 − p)) = w·x + b.`],
 formulas:[[`Sigmoid`,`σ(z) = 1 / (1 + e⁻ᶻ)`],[`Log loss`,`L = −(1/n) Σ [y log ŷ + (1 − y) log(1 − ŷ)]`],[`Gradient`,`∂L/∂w = (1/n) Σ (ŷᵢ − yᵢ) xᵢ`],[`Log-odds`,`log(p / (1 − p)) = w·x + b`]],
 fig:'sigmoid',cap:`The sigmoid turns any score into a value between 0 and 1.`},

{id:'ml-softmax',grp:'ML 6: Regularization and logistic regression',ch:'Lesson 3',title:'Softmax and polynomial logistic regression',tag:`Many classes, curved boundaries, and sklearn’s knobs.`,
 points:[`Softmax regression (multinomial logistic, Ch 115): one weight vector per class, scores turned into probabilities that sum to 1. Loss is categorical cross-entropy; the gradient is (ŷₖ − yₖ)x.`,
  `Polynomial logistic regression (Ch 116): add polynomial features so the boundary can curve. Scale features and watch for overfitting at high degree.`,
  `scikit-learn hyperparameters (Ch 117): penalty (l1, l2, elasticnet), C, solver, max_iter, class_weight.`,
  `C is the inverse of regularization strength: smaller C means stronger regularization.`],
 formulas:[[`Softmax`,`pₖ = e^(zₖ) / Σⱼ e^(zⱼ)`],[`Categorical cross-entropy`,`L = −Σₖ yₖ log pₖ`]],
 fig:'softmax',cap:`Softmax exaggerates the biggest score and normalizes.`},

{id:'ml-class-metrics',grp:'ML 6: Regularization and logistic regression',ch:'Lesson 4',title:'Classification metrics, confusion matrix, ROC and AUC',tag:`Accuracy lies on imbalanced data; use the matrix.`,
 points:[`Confusion matrix: TP, FP, FN, TN. Accuracy = (TP + TN) / total.`,
  `Accuracy paradox: with 98% negatives, always predicting “negative” scores 98% yet finds nothing.`,
  `Precision = TP / (TP + FP): of predicted positives, how many are real. Recall (TPR) = TP / (TP + FN): of real positives, how many you found. F1 is their harmonic mean.`,
  `Pick by cost: missing a disease (FN) favors recall; flagging spam wrongly (FP) favors precision.`,
  `ROC curve (Ch 49): plot TPR against FPR = FP / (FP + TN) for every threshold. AUC is the area under it: 0.5 is random, 1 is perfect.`,
  `Lowering the threshold raises recall and lowers precision.`],
 formulas:[[`Precision`,`TP / (TP + FP)`],[`Recall (TPR)`,`TP / (TP + FN)`],[`FPR`,`FP / (FP + TN)`],[`F1`,`2PR / (P + R)`]],
 fig:'confusion',cap:`The confusion matrix and the metrics read from it.`,fig2:'roc',cap2:`ROC curves: the further toward the top-left, the better.`},

{id:'ml-trees',grp:'ML 7: Trees and ensembles',ch:'Lesson 1',title:'Decision trees: entropy, Gini, information gain',tag:`Ask the question that cleans up the data the most.`,
 points:[`Structure: root node (first question), internal nodes (splits), leaf nodes (predictions). Works for numbers and categories, needs no scaling, and is easy to read.`,
  `Entropy measures disorder: 0 for a pure node, 1 for a 50/50 binary node. Gini impurity is 1 − Σp²: 0 for pure, 0.5 at worst for two classes.`,
  `Information gain = parent impurity minus the weighted average impurity of the children. The tree greedily picks the split with the largest gain.`,
  `For numeric features it tries thresholds between sorted values.`,
  `A fully grown tree memorizes the data (high variance). Control it (Ch 119) with max_depth, min_samples_split, min_samples_leaf, max_features, max_leaf_nodes, criterion and pruning (ccp_alpha).`],
 formulas:[[`Entropy`,`H = −Σ pₖ log₂ pₖ`],[`Gini`,`G = 1 − Σ pₖ²`],[`Information gain`,`IG = H(parent) − Σ (nᵢ/n) H(childᵢ)`]],
 fig:'dtree',cap:`Each split lowers impurity until leaves are pure.`,fig2:'impurity',cap2:`Entropy and Gini both peak at a 50/50 mix.`},

{id:'ml-regtrees',grp:'ML 7: Trees and ensembles',ch:'Lesson 2',title:'Regression trees',tag:`The same tree, predicting a number by averaging.`,
 points:[`A regression tree splits to minimize error inside the resulting groups (variance or MSE) instead of entropy.`,
  `Each leaf predicts the mean target of its training samples, so the fit is a staircase of constants.`,
  `Depth and minimum leaf size control smoothness: deeper means more steps and more overfitting.`,
  `Cannot extrapolate beyond the training range. dtreeviz (Ch 121) draws the splits and distributions.`],
 formulas:[[`Leaf value`,`ŷ_leaf = mean(y in leaf)`],[`Split criterion`,`minimize Σ over leaves Σ (y − ȳ_leaf)²`]],
 fig:'regtree',cap:`A regression tree is a step function.`},

{id:'ml-ensembles',grp:'ML 7: Trees and ensembles',ch:'Lesson 3',title:'Ensembles: voting, stacking and blending',tag:`Many models, one decision.`,
 points:[`Ensembles combine models for better accuracy. Diverse models (different algorithms, data or features) make different errors, which average out.`,
  `Bagging trains models in parallel on resampled data and mainly cuts variance (Random Forest). Boosting trains sequentially, each fixing the last, and mainly cuts bias (AdaBoost, Gradient Boosting, XGBoost) (Ch 13).`,
  `Voting classifier (Ch 123–124): hard voting takes the majority class; soft voting averages predicted probabilities (and can be weighted). Voting regressor (Ch 125) averages predictions.`,
  `Stacking (Ch 20): base models’ predictions become the features of a meta-model that learns how to combine them. Use k-fold out-of-fold predictions so the meta-model doesn’t see leaked training predictions.`,
  `Blending is the simpler version that uses a hold-out set instead of k-fold. Multi-layer stacking is possible.`],
 formulas:[],fig:'ensembles',cap:`Voting averages; stacking learns the combination.`},

{id:'ml-bagging-rf',grp:'ML 7: Trees and ensembles',ch:'Lesson 4',title:'Bagging and Random Forest',tag:`Average many noisy trees to get a stable one.`,
 points:[`Bagging (bootstrap aggregating, Ch 126–128): train each model on a bootstrap sample (rows drawn with replacement), then vote or average. It mostly reduces variance.`,
  `A bootstrap sample contains about 63% of the unique rows; the other 37% are out-of-bag (OOB).`,
  `Random Forest (Ch 129) = bagging of decision trees plus a random subset of features at each split (max_features). That decorrelates the trees.`,
  `Why it works (Ch 130): deep trees have low bias but high variance; averaging many different ones cuts variance. Bagging vs RF (Ch 131): RF adds the feature randomness.`,
  `Hyperparameters (Ch 132–133): n_estimators, max_depth, max_features, min_samples_split and leaf, bootstrap, max_samples. Tune with random or grid search.`,
  `OOB evaluation (Ch 134): score each row using only trees that never saw it. A free validation estimate (oob_score=True).`,
  `Feature importance (Ch 135): impurity-based (fast, biased toward high-cardinality features) or permutation-based (more reliable).`],
 formulas:[[`Chance a row is never drawn`,`(1 − 1/n)ⁿ → e⁻¹ ≈ 0.368`]],
 fig:'bagging',cap:`Bootstrap, grow randomized trees, then aggregate.`},

{id:'ml-adaboost',grp:'ML 7: Trees and ensembles',ch:'Lesson 5',title:'AdaBoost',tag:`Reweight the mistakes, then try again.`,
 points:[`Boosting builds weak learners one after another. AdaBoost typically uses stumps (depth-1 trees).`,
  `Start with equal sample weights. After each learner, raise the weights of misclassified samples so the next one focuses on them.`,
  `Each learner gets a say α based on its weighted error ε: more accurate means a bigger α.`,
  `Two ways to use weights (Ch 11): pass them as sample weights, or resample with replacement according to them.`,
  `Final prediction is the sign of the α-weighted vote of all learners.`,
  `Hyperparameters (Ch 12): n_estimators, learning_rate (shrinkage, trades off with n_estimators) and the base estimator. Noisy labels and outliers hurt, since they keep getting upweighted.`],
 formulas:[[`Learner weight`,`αₜ = ½ ln((1 − εₜ) / εₜ)`],[`Weight update`,`wᵢ ← wᵢ · e^(±αₜ), then normalize`],[`Prediction`,`H(x) = sign( Σ αₜ hₜ(x) )`]],
 fig:'adaboost',cap:`Larger dots are the points the next stump must get right.`},

{id:'ml-gboost',grp:'ML 7: Trees and ensembles',ch:'Lesson 6',title:'Gradient boosting',tag:`Each new tree fits what the model still gets wrong.`,
 points:[`Gradient boosting builds an additive model: Fₘ = Fₘ₋₁ + η·hₘ. Each tree hₘ is fitted to the negative gradient (pseudo-residuals) of the loss at the current predictions (Ch 18).`,
  `For squared loss ½(y − F)², the negative gradient is simply the residual y − F. The ½ cancels the 2 from differentiation (Ch 18.6).`,
  `Regression (Ch 17): start with F₀ = mean of y, compute residuals, fit a small tree to them, set each leaf (terminal region) to the average residual, update with learning rate η, repeat.`,
  `Classification (Ch 19): use log loss. F₀ is the log-odds of the base rate, residuals are y − p, leaf value is Σr / Σp(1 − p), and p = σ(F).`,
  `Versus AdaBoost: gradient boosting fits residuals of any differentiable loss; AdaBoost reweights samples.`,
  `Hyperparameters: n_estimators, learning_rate (smaller needs more trees), max_depth, subsample.`],
 formulas:[[`Additive model`,`Fₘ(x) = Fₘ₋₁(x) + η · hₘ(x)`],[`Pseudo-residual`,`rᵢ = −∂L(yᵢ, F)/∂F at F = Fₘ₋₁`],[`Classification leaf`,`γ = Σ rᵢ / Σ pᵢ(1 − pᵢ)`]],
 fig:'gboost',cap:`Each stage adds a small correction.`},

{id:'ml-xgboost',grp:'ML 7: Trees and ensembles',ch:'Lesson 7',title:'XGBoost',tag:`Gradient boosting with a regularized, second-order objective.`,
 points:[`XGBoost is an optimized, regularized gradient boosting library (Ch 41): flexible losses, fast (parallel tree building, approximate splits), handles missing values, supports early stopping and cross-validation.`,
  `Regression (Ch 42): base prediction is the mean; compute residuals; for a candidate node, similarity score SS = (Σr)² / (n + λ).`,
  `Split by gain = SS_left + SS_right − SS_parent. Pick the best gain; prune a split if gain − γ < 0. Leaf output = Σr / (n + λ). Update ŷ ← ŷ + η·output.`,
  `Classification (Ch 43): base probability 0.5; residuals y − p; SS = (Σr)² / (Σp(1 − p) + λ); leaf output = Σr / (Σp(1 − p) + λ), converted through log-odds.`,
  `Derivation (Ch 45): a second-order Taylor expansion of the loss gives gradient g and hessian h, with optimal leaf weight w* = −G / (H + λ).`,
  `λ shrinks leaf outputs and fights overfitting.`],
 formulas:[[`Similarity score (regression)`,`SS = (Σ rᵢ)² / (n + λ)`],[`Gain`,`Gain = SS_L + SS_R − SS_parent`],[`Leaf output`,`Σ rᵢ / (n + λ)`],[`Optimal weight`,`w* = − G / (H + λ)`]],
 fig:'xgbtree',cap:`One XGBoost split, scored by similarity gain.`},

{id:'ml-knn',grp:'ML 8: Other classic algorithms',ch:'Lesson 1',title:'K-nearest neighbors',tag:`Predict by asking the closest examples.`,
 points:[`KNN is lazy and instance-based: no training step, it stores the data. For a query, find the k closest points (Euclidean, Manhattan, Minkowski) and vote (classification) or average (regression).`,
  `Choosing k (Ch 23.5): small k gives low bias and high variance (overfits, noisy boundary); large k gives high bias (underfits). Choose with cross-validation; use an odd k for two classes.`,
  `Six failure cases (Ch 23.8): large N (O(N) work per prediction), high dimensions (distances lose meaning), outliers, unscaled features, imbalanced data, and no interpretability.`,
  `Always scale features before KNN.`],
 formulas:[[`Euclidean distance`,`d(x, z) = √( Σ (xᵢ − zᵢ)² )`],[`Minkowski`,`d = ( Σ |xᵢ − zᵢ|ᵖ )^(1/p)`]],
 fig:'knn',cap:`With k = 3 the query takes the majority class of its three nearest neighbors.`},

{id:'ml-svm',grp:'ML 8: Other classic algorithms',ch:'Lesson 2',title:'Support vector machines: margin and soft margin',tag:`The widest street between two classes.`,
 points:[`SVM finds the hyperplane w·x + b = 0 with the maximum margin. Margin width is 2/‖w‖, so maximizing it means minimizing ½‖w‖².`,
  `Support vectors are the points on the margin. Only they define the boundary; other points can move without changing it.`,
  `Hard margin demands y(w·x + b) ≥ 1 for every point. It fails when classes overlap or there are outliers.`,
  `Soft margin (Ch 27) allows violations through slack variables ξ. Minimize ½‖w‖² + C Σ ξ. Large C: narrow margin, few violations (can overfit). Small C: wide margin, more tolerance.`,
  `Hinge loss: max(0, 1 − y(w·x + b)).`,
  `Versus logistic regression: SVM focuses on the margin and support vectors; logistic regression models probabilities using all points.`],
 formulas:[[`Margin`,`2 / ‖w‖`],[`Hard-margin constraint`,`yᵢ (w·xᵢ + b) ≥ 1`],[`Soft-margin objective`,`min ½‖w‖² + C Σ ξᵢ`],[`Hinge loss`,`max(0, 1 − y (w·x + b))`]],
 fig:'svm',cap:`The solid line is the hyperplane; dashed lines are the margin; circled points are support vectors.`},

{id:'ml-kernels',grp:'ML 8: Other classic algorithms',ch:'Lesson 3',title:'The kernel trick',tag:`Curved boundaries by implicitly lifting the data.`,
 points:[`Some data can’t be separated by a line. Mapping it into higher dimensions (like x → (x, x²)) can make it separable.`,
  `Kernel trick: compute the dot product in the lifted space directly with a kernel function, K(x, z) = φ(x)·φ(z), without ever building φ(x).`,
  `Common kernels (Ch 28–29): linear, polynomial, RBF (Gaussian), sigmoid.`,
  `RBF γ: large γ means each point has a narrow influence (overfits); small γ gives a smoother boundary. C and γ work together.`,
  `Pick kernel, C and γ with GridSearchCV (Ch 29).`],
 formulas:[[`Polynomial kernel`,`K(x, z) = (γ x·z + r)ᵈ`],[`RBF kernel`,`K(x, z) = exp(−γ ‖x − z‖²)`]],
 fig:'kernel',cap:`Lifting 1D data into (x, x²) makes it linearly separable.`},

{id:'ml-probability',grp:'ML 8: Other classic algorithms',ch:'Lesson 4',title:'Probability basics and Bayes’ theorem',tag:`The language Naive Bayes is written in.`,
 points:[`Conditional probability (Ch 30): P(A|B) = P(A∩B) / P(B), the chance of A once B is known.`,
  `Independent events (Ch 31): P(A∩B) = P(A)P(B). Knowing B doesn’t change A.`,
  `Mutually exclusive events (Ch 31, 34): P(A∩B) = 0, they can’t both happen. If both have positive probability they are dependent, not independent.`,
  `Bayes’ theorem (Ch 35–36): P(A|B) = P(B|A)P(A) / P(B). Prior P(A), likelihood P(B|A), evidence P(B), posterior P(A|B).`,
  `The evidence expands with the law of total probability: P(B) = Σ P(B|Aᵢ)P(Aᵢ). The factory-defect problem in Ch 36 shows this: which machine made a defective item.`],
 formulas:[[`Conditional`,`P(A|B) = P(A∩B) / P(B)`],[`Independence`,`P(A∩B) = P(A) P(B)`],[`Bayes`,`P(A|B) = P(B|A) P(A) / P(B)`],[`Total probability`,`P(B) = Σᵢ P(B|Aᵢ) P(Aᵢ)`]],
 fig:'venn',cap:`The overlap A∩B is what conditioning on B zooms into.`},

{id:'ml-naive-bayes',grp:'ML 8: Other classic algorithms',ch:'Lesson 5',title:'Naive Bayes classifier',tag:`Bayes plus one bold assumption.`,
 points:[`Goal: pick the class with the highest posterior P(C|x). By Bayes, that is proportional to P(C)·P(x|C) (the MAP rule, Ch 38).`,
  `“Naive” assumption: features are conditionally independent given the class, so P(x|C) = Π P(xᵢ|C). It is rarely true but often works well.`,
  `Training is just counting (Ch 37’s match-prediction example): class priors and per-feature likelihoods. Fast, works with little data.`,
  `Zero-frequency problem: an unseen feature value gives probability 0 and wipes out the product. Fix with Laplace smoothing (add α to counts).`,
  `Gaussian Naive Bayes (Ch 40): for numeric features, model P(xᵢ|C) with a normal density using the class’s mean and variance. Other variants: Multinomial (counts, text) and Bernoulli (binary).`,
  `Multiply many small numbers? Sum log-probabilities instead to avoid underflow.`],
 formulas:[[`Posterior (proportional)`,`P(C|x) ∝ P(C) Π P(xᵢ | C)`],[`MAP decision`,`ŷ = argmax_C P(C) Π P(xᵢ | C)`],[`Laplace smoothing`,`P(xᵢ|C) = (count + α) / (N_C + α·k)`],[`Gaussian likelihood`,`P(x|C) = (1/√(2πσ²)) exp(−(x − μ)² / 2σ²)`]],
 fig:'nbgraph',cap:`The class generates each feature independently.`},

{id:'ml-kmeans',grp:'ML 8: Other classic algorithms',ch:'Lesson 6',title:'K-Means clustering and the elbow method',tag:`Move centroids until the groups stop changing.`,
 points:[`K-Means partitions data into k clusters. Steps: choose k, initialize centroids, assign each point to its nearest centroid, move each centroid to the mean of its points, repeat until assignments stop changing.`,
  `Objective: minimize WCSS (within-cluster sum of squares, “inertia”).`,
  `Elbow method (Ch 14–15): plot WCSS for k = 1, 2, 3 … and pick the bend where improvement slows.`,
  `Initialization (Ch 14.8): random (can land in bad local minima), K-Means++ (smarter spread, the default), manual, or multiple runs (n_init).`,
  `Limits (Ch 16): assumes round, similar-size clusters; sensitive to outliers and feature scale (scale first); you must choose k.`],
 formulas:[[`Centroid`,`μ_c = (1/|C|) Σ x  for x in cluster C`],[`WCSS`,`Σ_c Σ_{x∈c} ‖x − μ_c‖²`]],
 fig:'kmeans',cap:`Three clusters and their centroids.`,fig2:'elbow',cap2:`Pick k where the curve bends.`},

{id:'ml-hier-dbscan',grp:'ML 8: Other classic algorithms',ch:'Lesson 7',title:'Hierarchical clustering and DBSCAN',tag:`Clusters without picking k first, and clusters by density.`,
 points:[`Agglomerative hierarchical clustering (Ch 22): start with every point alone and repeatedly merge the two closest clusters. The result is a dendrogram.`,
  `Linkage decides “closest”: single (nearest pair), complete (farthest pair), average, Ward (smallest increase in variance).`,
  `Choose clusters by cutting the dendrogram, ideally across the longest vertical gap. Benefits: no k up front, a readable tree. Limit: expensive on large data.`,
  `DBSCAN (Ch 46) groups by density using eps (radius) and minPts. Core point: at least minPts neighbors within eps. Border point: within eps of a core but not dense itself. Noise: neither.`,
  `Clusters are chains of density-connected core points. DBSCAN finds arbitrary shapes, labels outliers, and needs no k, but struggles with varying density and high dimensions.`],
 formulas:[[`Core point`,`|{ q : d(p, q) ≤ ε }| ≥ minPts`]],
 fig:'dendro',cap:`Cutting the dendrogram at a height yields clusters.`,fig2:'dbscan',cap2:`DBSCAN point types: core, border, noise.`},

{id:'ml-pca',grp:'ML 8: Other classic algorithms',ch:'Lesson 8',title:'Curse of dimensionality and PCA',tag:`Keep the directions that carry the variance.`,
 points:[`Curse of dimensionality (Ch 84): as features grow, data gets sparse, distances lose meaning, you need far more samples, and models overfit.`,
  `Two fixes: feature selection (keep a subset) or feature extraction (build new features, like PCA).`,
  `PCA (Ch 85–87) finds orthogonal directions that maximize variance. Steps: standardize, compute the covariance matrix, take eigenvectors (components) and eigenvalues (variance explained), sort, project onto the top k.`,
  `Pick k with explained-variance ratio (often 90–95% cumulative) or a scree plot.`,
  `Trade-offs: components are linear mixes (harder to interpret), some information is lost, and PCA misses non-linear structure or cases where low-variance directions matter (Ch 87.9).`],
 formulas:[[`Covariance matrix`,`C = (1/(n − 1)) XᵀX   (X centered)`],[`Eigenproblem`,`C v = λ v`],[`Explained variance ratio`,`λᵢ / Σ λⱼ`]],
 fig:'pca',cap:`PC1 follows the longest spread; PC2 is perpendicular.`},

{id:'ml-imbalanced',grp:'ML 9: Practice and tooling',ch:'Lesson 1',title:'Imbalanced data',tag:`When one class is rare, accuracy is a trap.`,
 points:[`Imbalance: one class is much rarer (fraud, disease). Models drift toward the majority class and accuracy looks great while the minority is missed.`,
  `Use better metrics: precision, recall, F1, ROC-AUC or precision-recall AUC.`,
  `Undersampling drops majority rows (fast, loses information). Oversampling duplicates minority rows (keeps data, risks overfitting).`,
  `SMOTE creates synthetic minority points by interpolating between a minority sample and one of its nearest minority neighbors.`,
  `Other options: ensemble methods (balanced bagging or boosting), class_weight, and moving the decision threshold.`,
  `Resample only the training split, never the test set.`],
 formulas:[[`SMOTE`,`x_new = x + u · (x_neighbor − x),  u ∈ [0, 1]`]],
 fig:'imbalanced',cap:`Original versus undersampled versus oversampled class counts.`},

{id:'ml-optuna',grp:'ML 9: Practice and tooling',ch:'Lesson 2',title:'Optuna and smarter hyperparameter search',tag:`Let past trials guide the next one.`,
 points:[`Grid search tries every combination (costly). Random search samples combinations (often better for many parameters). Bayesian optimization models the objective and tries promising values next.`,
  `Optuna (Ch 48): you write an objective(trial) that suggests parameters (suggest_int, suggest_float, suggest_categorical), trains, and returns a score. A study runs many trials and optimizes (maximize or minimize).`,
  `Samplers choose the next parameters. The default is TPE (Tree-structured Parzen Estimator); others include random, grid and CMA-ES.`,
  `Pruning stops unpromising trials early. Built-in plots show parameter importance and the optimization history.`,
  `Same idea as Keras Tuner in the Deep learning track.`],
 formulas:[],fig:'optuna',cap:`The Optuna loop: study, trial, objective, sampler.`},

{id:'ml-tensors',grp:'ML 9: Practice and tooling',ch:'Lesson 3',title:'Tensors',tag:`The shape of data in ML and deep learning.`,
 points:[`A tensor is an n-dimensional array. Rank (number of axes): 0 scalar, 1 vector, 2 matrix, 3 or more tensor.`,
  `Shape lists the size of each axis, like (samples, features).`,
  `Common shapes: tabular (samples, features); time series or text (samples, steps, features); images (samples, height, width, channels); video adds a time axis.`,
  `NumPy: ndim, shape, reshape. Many deep learning errors are shape mismatches, so check shapes first.`],
 formulas:[],fig:'tensors',cap:`From scalar to rank-3 tensor.`}
];

const EX1=[
{id:'found-counting',grp:'Foundations 1: Probability and statistics',ch:'Counting',title:'Counting: permutations and combinations',tag:`Count arrangements and selections without listing them.`,
 points:[`Product rule: if one step has m outcomes and another has n, together they have m × n. Sum rule: if tasks are exclusive, add the counts.`,
  `Permutation (order matters): P(n, r) = n!/(n − r)!. Combination (order ignored): C(n, r) = n!/(r!(n − r)!). Always P = C × r!.`,
  `Letters with repeats: n!/(n₁! n₂! …). Example: MISSISSIPPI has 11!/(4! 4! 2!) = 34,650 arrangements.`,
  `Circular arrangement of n distinct objects: (n − 1)!.`,
  `Repetition allowed: choosing r items from n types is C(n + r − 1, r). Non-negative integer solutions of x₁ + … + x_k = n number C(n + k − 1, k − 1) (“stars and bars”).`,
  `“At least one” problems: subtract the complement. Committee of 3 from 5 men and 4 women with at least one woman: C(9, 3) − C(5, 3) = 84 − 10 = 74.`,
  `Pascal’s rule C(n, r) = C(n − 1, r − 1) + C(n − 1, r). Binomial theorem: (x + y)ⁿ = Σ C(n, k) xᵏ yⁿ⁻ᵏ.`],
 formulas:[[`Permutations`,`P(n, r) = n! / (n − r)!`],[`Combinations`,`C(n, r) = n! / (r! (n − r)!)`],[`Repeated letters`,`n! / (n₁! n₂! … n_k!)`],[`Stars and bars`,`solutions of x₁ + … + x_k = n:  C(n + k − 1, k − 1)`]],
 fig:'counting',cap:`Ordered pairs (all off-diagonal cells) versus unordered pairs (upper triangle only).`},

{id:'found-probability-basics',grp:'Foundations 1: Probability and statistics',ch:'Probability',title:'Probability axioms, conditioning, independence and Bayes',tag:`The rules every other probability topic is built on.`,
 points:[`Axioms: P(A) ≥ 0; P(S) = 1; for mutually exclusive events P(A ∪ B) = P(A) + P(B). From these: P(Aᶜ) = 1 − P(A) and P(A ∪ B) = P(A) + P(B) − P(A ∩ B).`,
  `Conditional probability: P(A|B) = P(A ∩ B)/P(B). Multiplication rule: P(A ∩ B) = P(B) P(A|B).`,
  `Independent: P(A ∩ B) = P(A) P(B), equivalently P(A|B) = P(A). Mutually exclusive: P(A ∩ B) = 0. Two events with positive probabilities cannot be both.`,
  `Joint probability P(A, B); marginal probability is the sum of the joint over the other variable: P(A) = Σ P(A, B).`,
  `Total probability: P(B) = Σ P(B|Aᵢ) P(Aᵢ) over a partition Aᵢ. Bayes: P(Aᵢ|B) = P(B|Aᵢ) P(Aᵢ) / P(B).`,
  `Worked example: prevalence 1%, test detects 99% of cases (sensitivity), 5% false positives. P(+) = 0.01 · 0.99 + 0.99 · 0.05 = 0.0594, so P(disease | +) = 0.0099/0.0594 = 1/6 ≈ 16.7%, far below 99%.`,
  `Quick example: P(at least one head in 3 flips) = 1 − (½)³ = 7/8.`],
 formulas:[[`Inclusion–exclusion`,`P(A ∪ B) = P(A) + P(B) − P(A ∩ B)`],[`Conditional`,`P(A|B) = P(A ∩ B) / P(B)`],[`Total probability`,`P(B) = Σ P(B|Aᵢ) P(Aᵢ)`],[`Bayes`,`P(A|B) = P(B|A) P(A) / P(B)`]],
 fig:'bayestree',cap:`A probability tree for the screening-test example. Multiply along branches, add across leaves.`},

{id:'found-random-variables',grp:'Foundations 1: Probability and statistics',ch:'Random variables',title:'Random variables: PMF, PDF, CDF, expectation, variance',tag:`Describe a random quantity with a distribution and a few summary numbers.`,
 points:[`Discrete random variable: PMF p(x) = P(X = x), with Σ p(x) = 1. Continuous: PDF f(x) ≥ 0 with ∫ f = 1; probabilities are areas, P(X = x) = 0.`,
  `CDF: F(x) = P(X ≤ x). It is non-decreasing from 0 to 1. For continuous X, f = F′ and P(a < X ≤ b) = F(b) − F(a).`,
  `Expectation: E[X] = Σ x p(x) or ∫ x f(x) dx. Linearity: E[aX + b] = aE[X] + b and E[X + Y] = E[X] + E[Y] always.`,
  `Variance: Var(X) = E[X²] − (E[X])². Var(aX + b) = a² Var(X). Fair die: E = 3.5, E[X²] = 91/6, Var = 35/12 ≈ 2.92.`,
  `Var(X + Y) = Var X + Var Y + 2 Cov(X, Y). Independent variables have Cov = 0, but Cov = 0 does not imply independence.`,
  `Conditional expectation E[X|Y] is a function of Y. Law of total expectation: E[X] = E[E[X|Y]]. Law of total variance: Var(X) = E[Var(X|Y)] + Var(E[X|Y]).`],
 formulas:[[`Expectation`,`E[X] = Σ x p(x)  or  ∫ x f(x) dx`],[`Variance`,`Var(X) = E[X²] − (E[X])²`],[`Linear change`,`E[aX + b] = aE[X] + b,  Var(aX + b) = a² Var(X)`],[`Total expectation`,`E[X] = E[ E[X | Y] ]`],[`Total variance`,`Var(X) = E[Var(X|Y)] + Var(E[X|Y])`]],
 fig:'rvdist',cap:`A PMF and its CDF for a Binomial(4, ½) variable.`},

{id:'found-descriptive-stats',grp:'Foundations 1: Probability and statistics',ch:'Statistics',title:'Mean, median, mode, standard deviation, covariance and correlation',tag:`Summarize data, and measure how two variables move together.`,
 points:[`Mean (sum / n), median (middle value), mode (most frequent). Outliers move the mean far more than the median. Right-skewed data usually has mean > median.`,
  `Population variance σ² = Σ(x − μ)² / N. Sample variance s² = Σ(x − x̄)² / (n − 1) (the n − 1 corrects bias). Standard deviation is the square root.`,
  `Example: {2, 4, 4, 4, 5, 5, 7, 9} has mean 5, median 4.5, mode 4, population variance 32/8 = 4, so σ = 2. Sample variance 32/7 ≈ 4.57.`,
  `Covariance Cov(X, Y) = E[(X − μₓ)(Y − μᵧ)] = E[XY] − E[X]E[Y]. Its sign shows direction, but its size depends on units.`,
  `Pearson correlation ρ = Cov(X, Y)/(σₓ σᵧ) lies in [−1, 1]. It measures linear association only. Y = aX + b gives ρ = +1 if a > 0 and −1 if a < 0.`,
  `Correlation does not imply causation, and ρ = 0 does not mean independence.`],
 formulas:[[`Sample variance`,`s² = Σ (xᵢ − x̄)² / (n − 1)`],[`Covariance`,`Cov(X, Y) = E[XY] − E[X] E[Y]`],[`Correlation`,`ρ = Cov(X, Y) / (σₓ σᵧ)`]],
 fig:'corr',cap:`Three scatter plots with strong positive, no, and strong negative linear correlation.`},

{id:'found-discrete-distributions',grp:'Foundations 1: Probability and statistics',ch:'Distributions',title:'Discrete distributions: uniform, Bernoulli, binomial, Poisson',tag:`Counts of successes and events, with their means and variances.`,
 points:[`Discrete uniform on {1..n}: each value 1/n, mean (n + 1)/2, variance (n² − 1)/12.`,
  `Bernoulli(p): one trial, success with probability p. Mean p, variance p(1 − p).`,
  `Binomial(n, p): successes in n independent trials. P(X = k) = C(n, k) pᵏ (1 − p)ⁿ⁻ᵏ. Mean np, variance np(1 − p). Example: exactly 2 heads in 4 fair flips = 6/16 = 0.375.`,
  `Poisson(λ): events in a fixed interval. P(X = k) = e^(−λ) λᵏ/k!. Mean = variance = λ. Example: λ = 3, P(X = 2) = e⁻³ · 9/2 ≈ 0.224.`,
  `Poisson approximates Binomial when n is large and p is small, with λ = np.`,
  `Note: Poisson is sometimes listed with the continuous distributions, but its counts are discrete, so it lives here.`],
 formulas:[[`Binomial PMF`,`P(X = k) = C(n, k) pᵏ (1 − p)ⁿ⁻ᵏ`],[`Binomial moments`,`E[X] = np,  Var(X) = np(1 − p)`],[`Poisson PMF`,`P(X = k) = e^(−λ) λᵏ / k!`],[`Poisson moments`,`E[X] = Var(X) = λ`]],
 fig:'poisson',cap:`Poisson counts (left) and the exponential waiting time (right).`},

{id:'found-continuous-distributions',grp:'Foundations 1: Probability and statistics',ch:'Distributions',title:'Continuous distributions: uniform, exponential, normal, t and chi-squared',tag:`Bell curves, waiting times and the test distributions.`,
 points:[`Uniform(a, b): f = 1/(b − a). Mean (a + b)/2, variance (b − a)²/12.`,
  `Exponential(λ): f(x) = λe^(−λx), x ≥ 0. CDF 1 − e^(−λx). Mean 1/λ, variance 1/λ². Memoryless: P(X > s + t | X > s) = P(X > t). Example: mean 10 minutes, P(X > 15) = e^(−1.5) ≈ 0.223.`,
  `Normal N(μ, σ²): symmetric bell. About 68%, 95%, 99.7% of the mass lies within 1, 2, 3 standard deviations. Standardize with z = (x − μ)/σ. Sums of independent normals are normal.`,
  `Useful values: Φ(1) = 0.8413, Φ(1.645) = 0.95, Φ(1.96) = 0.975.`,
  `t-distribution with ν degrees of freedom: bell-shaped but heavier tails than normal; approaches the normal as ν grows. Used when σ is estimated by s.`,
  `Chi-squared with k degrees of freedom: the sum of k squared standard normals. Non-negative, right-skewed, mean k, variance 2k.`],
 formulas:[[`Standardization`,`z = (x − μ) / σ`],[`Normal PDF`,`f(x) = (1/(σ√(2π))) exp( −(x − μ)² / (2σ²) )`],[`Exponential`,`F(x) = 1 − e^(−λx),  mean 1/λ`],[`Chi-squared`,`χ²_k = Z₁² + … + Z_k²,  mean k,  variance 2k`]],
 fig:'normal',cap:`The 68–95–99.7 rule for a normal distribution.`},

{id:'found-clt-ci',grp:'Foundations 1: Probability and statistics',ch:'Statistics',title:'Central limit theorem and confidence intervals',tag:`Why sample means behave, and how to put error bars on them.`,
 points:[`Sample mean x̄ of n independent observations has mean μ and standard deviation σ/√n (the standard error).`,
  `Central limit theorem: for large n (a common rule of thumb is about 30), x̄ is approximately normal whatever the shape of the population.`,
  `Confidence interval for the mean when σ is known: x̄ ± z(α/2) · σ/√n. Critical z: 1.645 for 90%, 1.96 for 95%, 2.576 for 99%.`,
  `Example: n = 100, x̄ = 50, σ = 10 gives 50 ± 1.96 · 1 = (48.04, 51.96).`,
  `When σ is unknown use s and the t distribution with n − 1 degrees of freedom: x̄ ± t · s/√n.`,
  `Interpretation: if you repeated the sampling, about 95% of such intervals would contain μ. Width shrinks like 1/√n, so halving the margin needs 4 times the data.`],
 formulas:[[`Standard error`,`SE = σ / √n`],[`CI (σ known)`,`x̄ ± z(α/2) · σ / √n`],[`CI (σ unknown)`,`x̄ ± t(n−1, α/2) · s / √n`]],
 fig:'clt',cap:`The distribution of the sample mean tightens as n grows (standard error σ/√n).`},

{id:'found-hypothesis',grp:'Foundations 1: Probability and statistics',ch:'Statistics',title:'Hypothesis testing: z, t and chi-squared tests',tag:`Decide whether the data contradicts a baseline claim.`,
 points:[`State H₀ (baseline) and H₁ (alternative). Compute a test statistic, then a p-value: the probability, if H₀ were true, of a result at least this extreme. Reject H₀ if p < α.`,
  `Type I error: reject a true H₀ (probability α). Type II error: fail to reject a false H₀ (probability β). Power = 1 − β.`,
  `z-test (σ known, or large n): z = (x̄ − μ₀)/(σ/√n). Example: x̄ = 52, μ₀ = 50, σ = 10, n = 100 gives z = 2; two-tailed p ≈ 0.0455 < 0.05, so reject.`,
  `t-test (σ unknown): t = (x̄ − μ₀)/(s/√n) with n − 1 degrees of freedom. Variants: two-sample and paired tests.`,
  `Chi-squared test: χ² = Σ (O − E)²/E. Goodness of fit has k − 1 degrees of freedom; test of independence has (r − 1)(c − 1).`,
  `Chi-squared example: observed 18, 22, 30, 30 against expected 25 each: (49 + 9 + 25 + 25)/25 = 4.32 with 3 degrees of freedom. The 5% critical value is 7.81, so we do not reject.`],
 formulas:[[`z statistic`,`z = (x̄ − μ₀) / (σ / √n)`],[`t statistic`,`t = (x̄ − μ₀) / (s / √n)`],[`Chi-squared`,`χ² = Σ (O − E)² / E`]],
 fig:'rejection',cap:`Two-tailed rejection regions at α = 0.05.`},

{id:'found-vector-spaces',grp:'Foundations 2: Linear algebra',ch:'Vector spaces',title:'Vector spaces, subspaces, independence, basis and dimension',tag:`The structure behind every linear-algebra question.`,
 points:[`A vector space is closed under addition and scalar multiplication (and satisfies the usual axioms). Rⁿ is the standard example.`,
  `Subspace test: contains the zero vector, closed under addition, closed under scalar multiplication. {(x, y): y = 2x} is a subspace of R²; {(x, y): y = x + 1} is not, because it misses (0, 0).`,
  `Span of vectors is all their linear combinations. Vectors are linearly independent if c₁v₁ + … + c_kv_k = 0 forces every cᵢ = 0.`,
  `A basis is an independent set that spans the space. Every basis has the same size, the dimension. dim Rⁿ = n.`,
  `Column space = span of the columns of A; its dimension is rank(A). Null space = solutions of Ax = 0; its dimension is nullity.`,
  `n vectors in Rⁿ are independent exactly when the determinant of the matrix of those vectors is non-zero.`,
  `Example: (1, 2) and (2, 4) are dependent. span{(1,0,0), (0,1,0), (1,1,0)} has dimension 2, since the third is the sum of the first two.`],
 formulas:[[`Independence`,`c₁v₁ + … + c_kv_k = 0  ⇒  all cᵢ = 0`],[`Dimension facts`,`dim Rⁿ = n;  dim Col(A) = rank(A)`]],
 fig:'vspace',cap:`Independent vectors span a plane; dependent vectors span only a line.`},

{id:'found-linear-systems',grp:'Foundations 2: Linear algebra',ch:'Linear systems',title:'Systems of equations, Gaussian elimination, rank, nullity, determinant',tag:`Solve Ax = b and read off what the answer must look like.`,
 points:[`Gaussian elimination row-reduces the augmented matrix [A | b] to echelon form. The number of pivots is the rank.`,
  `Consistency (Rouché–Capelli): solutions exist iff rank(A) = rank([A | b]). Unique if that rank equals the number of unknowns n; infinitely many if it is less than n.`,
  `Rank–nullity: rank(A) + nullity(A) = number of columns. The homogeneous system Ax = 0 always has the zero solution, and has non-trivial solutions iff rank < n.`,
  `Worked example: x + y + z = 6, 2y + 5z = −4, 2x + 5y − z = 27 has the unique solution x = 5, y = 3, z = −2.`,
  `Determinant: det(AB) = det A · det B, det(Aᵀ) = det A, det(kA) = kⁿ det A for n × n. Swapping two rows flips the sign; adding a multiple of one row to another changes nothing.`,
  `For square A: invertible ⇔ det A ≠ 0 ⇔ rank = n ⇔ Ax = 0 has only the zero solution. Example: [[1, 2], [2, 4]] has rank 1, nullity 1, det 0.`],
 formulas:[[`Rank–nullity`,`rank(A) + nullity(A) = n  (columns)`],[`Consistency`,`rank(A) = rank([A | b])`],[`Scaling`,`det(kA) = kⁿ det(A)`],[`Product`,`det(AB) = det(A) det(B)`]],
 fig:'linsys',cap:`Three outcomes for two equations in two unknowns.`},

{id:'found-eigen',grp:'Foundations 2: Linear algebra',ch:'Eigenvalues',title:'Eigenvalues and eigenvectors',tag:`Directions a matrix only stretches.`,
 points:[`Av = λv with v ≠ 0. Find λ from the characteristic equation det(A − λI) = 0, then solve (A − λI)v = 0.`,
  `Sum of eigenvalues = trace. Product of eigenvalues = determinant. Eigenvalues of a triangular matrix are its diagonal entries.`,
  `Aᵏ has eigenvalues λᵏ; A⁻¹ has 1/λ (if A is invertible); Aᵀ has the same eigenvalues as A.`,
  `Real symmetric matrices have real eigenvalues and orthogonal eigenvectors for distinct eigenvalues.`,
  `A is diagonalizable, A = PDP⁻¹, iff it has n linearly independent eigenvectors. Then Aᵏ = PDᵏP⁻¹.`,
  `Example: A = [[3, 1], [1, 3]] has λ = 4 with v = (1, 1) and λ = 2 with v = (1, −1). Check: trace 6 = 4 + 2, determinant 8 = 4 · 2.`],
 formulas:[[`Eigen-equation`,`A v = λ v`],[`Characteristic equation`,`det(A − λI) = 0`],[`Trace and determinant`,`Σ λᵢ = tr(A),  Π λᵢ = det(A)`],[`Diagonalization`,`A = P D P⁻¹`]],
 fig:'eigen',cap:`The unit circle becomes an ellipse whose axes are the eigenvector directions.`},
